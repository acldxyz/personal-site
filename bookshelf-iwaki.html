<style>
  /* After Tadao Ando's Picture Book Museum in Iwaki, where the books are not
     shelved spine-out but stood face-out up a concrete wall, so
     a child chooses by cover the way you choose a painting. Here every book
     has a niche of its own in one wall, newest at the top left, and the
     cover art is the
     whole display: no spines, no list, nothing to read until you go up to
     one. */

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* --h is the cover height and the one number the wall is built from: the
       niche, the wall between niches and the cover widths all follow it. */
    --h: clamp(92px, 10.5vw, 148px);
    --pad: calc(var(--h) * .13);       /* air round a book inside its niche */
    /* Wide enough for an ordinary 2:3 cover with air either side. A squarer
       cover is narrowed to fit and comes out shorter, as it would on a real
       wall; the niche does not grow for it, or the grid would lose its rhythm. */
    --niche-w: calc(var(--h) * .72 + 2 * var(--pad));
    --niche-h: calc(var(--h) + var(--pad) * 2.2);
    --cover-gap: calc(var(--h) * .16);
    --margin: clamp(22px, 2.8vw, 40px);

    --ink: #6f665d;
    --ink-strong: #2f2a24;
    --ink-quiet: #8a8076;
    --focus: #3d7ba8;
  }

  /* A column, so the wall can take whatever height the window has left: a
     filter down to two books still stands them on a wall, not in a box. */
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 90% 70% at 50% 44%, #faf8f3 0%, #f2eee5 55%, #e8e3d8 100%)
      fixed;
    color: var(--ink);
    font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- topbar */

  /* The same bar as bookshelf.html, so the draft can be swapped in without
     the rest of the site noticing. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: clamp(14px, 1.6vw, 20px) var(--margin);
    border-bottom: 1px solid rgba(0,0,0,.08);
  }

  .wordmark {
    display: inline-block;
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Impact, system-ui, sans-serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: -.01em;
    line-height: 1.15;
    color: var(--ink-strong);
    text-decoration: none;
    opacity: .82;
    transition: opacity .2s ease;
  }
  .wordmark:hover { opacity: 1; }
  .wordmark:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .site-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 1px;
    font-size: 11px;
    margin-right: -.9em;
  }

  .site-nav a, .opt {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink);
    text-decoration: none;
    background: none;
    padding: .52em .9em;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: color .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .site-nav a:hover, .opt:hover {
    color: var(--ink-strong);
    background: rgba(0,0,0,.05);
    border-color: rgba(0,0,0,.14);
  }
  .site-nav a:focus-visible, .opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* -------------------------------------------------------------- lobby */

  /* The filters stand across the top like the museum's entrance hall rather
     than down a rail: the wall below is the room, and it gets the full width. */
  .lobby {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 28px;
    padding: clamp(22px, 2.6vw, 34px) var(--margin) 0;
  }

  .page-label, .readout, .plaque, .rec {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .page-label { color: var(--ink-strong); margin-right: 8px; }

  .group { display: flex; align-items: center; gap: 1px; border: 0; }
  .group legend {
    float: left;
    margin-right: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #a49a8e;
  }
  .opt[aria-pressed="true"] {
    color: var(--ink-strong);
    background: rgba(0,0,0,.07);
    border-color: rgba(0,0,0,.16);
  }

  .readout {
    margin-left: auto;
    color: var(--ink-quiet);
    font-variant-numeric: tabular-nums;
  }
  .readout b { font-weight: 600; color: var(--ink-strong); }

  /* --------------------------------------------------------------- wall */

  .wall {
    position: relative;
    flex: 1 0 auto;
    margin-top: clamp(18px, 2vw, 28px);
    padding: calc(var(--cover-gap) * 1.6) var(--margin) 80px;
    border-top: 1px solid rgba(0,0,0,.08);
  }

  /* Iwaki's reading room has the Pacific along one side, and the light off it
     rakes across the wall. Same side as the site's light, upper left. */
  .wall::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(100deg, rgba(255,253,247,.55) 0%, rgba(255,253,247,0) 38%);
  }

  /* The museum labels a picture on the wall beside it, not under a heading
     a screen away. With one wall running the length of the page, the label
     is pinned to the window instead, so it is in view wherever the covers
     being looked at are. It holds nothing at rest. */
  .plaque {
    position: fixed;
    left: var(--margin);
    bottom: 18px;
    z-index: 5;
    max-width: calc(100vw - 2 * var(--margin));
    padding: .78em 1.2em;
    border-radius: 999px;
    border: 1px solid rgba(0,0,0,.10);
    background: rgba(250,248,243,.92);
    box-shadow: 0 6px 18px -8px rgba(40,30,20,.28);
    color: var(--ink-strong);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity .3s ease-out, transform .3s ease-out;
  }
  .plaque.on { opacity: 1; transform: none; }
  .plaque em { font-style: normal; color: var(--ink-quiet); }

  /* The niches are Ando's formwork grid turned into the shelving: one panel,
     one book. The grid is filled from the left and stops where the books do,
     so a filtered wall still starts in the same place. auto-fill keeps the
     empty tracks, which is what lets the grid centre without a short row
     drifting to the middle. */
  .niches {
    display: grid;
    grid-template-columns: repeat(auto-fill, var(--niche-w));
    gap: var(--cover-gap);
    justify-content: center;
  }

  /* Cut into the wall rather than built onto it. Light from the upper left
     puts the top and left inner walls in shadow and catches the lower right
     lip, which is the whole of what makes a flat box read as a recess. Each
     niche keeps a pair of tie holes in the wall above it, so the concrete is
     still there between them. */
  .niche {
    position: relative;
    height: var(--niche-h);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: var(--pad) var(--pad) calc(var(--pad) * 1.2);
    border-radius: 2px;
    background:
      linear-gradient(to bottom, rgba(70,58,44,.075), rgba(70,58,44,.03) 55%, rgba(70,58,44,.05));
    box-shadow:
      inset 4px 5px 9px -2px rgba(50,38,24,.22),
      inset 1px 1px 0 rgba(50,38,24,.16),
      inset -1px -1px 0 rgba(255,255,255,.7),
      0 0 0 1px rgba(70,58,44,.05);
  }
  .niche::before {
    content: '';
    position: absolute;
    top: calc(var(--cover-gap) * -.5 - 1.5px);
    left: 22%;
    right: 22%;
    height: 3px;
    background:
      radial-gradient(circle, rgba(70,58,44,.16) 0 1.4px, transparent 1.9px) left center / 3px 3px no-repeat,
      radial-gradient(circle, rgba(70,58,44,.16) 0 1.4px, transparent 1.9px) right center / 3px 3px no-repeat;
  }
  /* Filtered out, a book's niche goes with it and the rest close up: on one
     wall, empty niches held in place would leave a filtered view as a few
     books scattered through a hundred holes. */
  .niche.off { display: none; }

  /* One book, face out, stood on the floor of its niche and leaning back a
     few degrees against the rear wall — which is also why the cover's top
     edge is a shade darker than its foot. */
  .cover {
    position: relative;
    display: block;
    width: min(calc(var(--h) * var(--s)), 100%);
    aspect-ratio: var(--s);
    border-radius: 1.5px 2.5px 2.5px 1.5px;
    background: var(--k);
    transform-origin: 50% 100%;
    transform: perspective(900px) rotateX(4deg);
    box-shadow:
      inset 0 0 0 1px rgba(60,48,32,.14),
      3px 4px 7px -3px rgba(40,30,20,.34),
      1px 2px 2px rgba(40,30,20,.14);
    transition: transform .3s ease-out, box-shadow .3s ease-out;
    outline-offset: 4px;
  }
  .cover img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  /* The hinge down the left edge and the lean's falloff, in black and white
     only so no cover's colour shifts. */
  .cover::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0,0,0,.20) 0, rgba(255,255,255,.14) 3px, rgba(0,0,0,0) 7px),
      linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,0) 40%);
  }

  /* A cover host that fails leaves the book's own colour standing in for its
     art, which the background above already paints. The name is on the link
     for a screen reader either way. */

  /* Taken out to look at: it comes upright and forward out of the niche, and
     its shadow falls further because it is further from the wall. */
  .cover:hover, .cover:focus-visible {
    transform: perspective(900px) rotateX(0deg) scale(1.08);
    box-shadow:
      inset 0 0 0 1px rgba(60,48,32,.14),
      8px 12px 20px -6px rgba(40,30,20,.38),
      2px 4px 6px rgba(40,30,20,.14);
    z-index: 2;
  }
  .cover:focus-visible { outline: 2px solid var(--focus); }

  /* All-time favourites get the one thing a child's library would give them:
     a small paper tag on the floor of the niche. */
  .niche.fav::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: calc(var(--pad) * .45);
    width: 9px;
    height: 4px;
    margin-left: -4.5px;
    background: #c94a3f;
    border-radius: 1px;
    box-shadow: 0 1px 1px rgba(0,0,0,.2);
  }

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 18px var(--margin) 40px;
  }
  .rec {
    color: var(--ink-quiet);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: transparent;
    transition: color .2s ease, text-decoration-color .2s ease;
  }
  .rec:hover { color: var(--ink-strong); text-decoration-color: currentColor; }
  .rec:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .legend-fav { color: var(--ink-quiet); font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  .legend-fav::before {
    content: '';
    display: inline-block;
    width: 9px; height: 5px;
    margin-right: 8px;
    vertical-align: middle;
    background: #c94a3f;
    border-radius: 1px;
  }

  .empty {
    padding: 40px var(--margin);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-quiet);
  }

  @media (max-width: 860px) {
    :root { --h: clamp(78px, 21vw, 104px); --cover-gap: 9px; --margin: 20px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px 20px 16px; }
    .site-nav { justify-content: flex-start; margin: 0 0 0 -.9em; }
    .readout { margin-left: 0; width: 100%; }
    .lobby { gap: 8px 18px; }
    .group { flex-wrap: wrap; }
    .group legend { width: 100%; margin: 4px 0 2px .9em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01s !important;
      transition-duration: .01s !important;
      transition-delay: 0s !important;
    }
  }
</style>

  { t: "The Corrections", a: "Jonathan Franzen", y: "≤ 2021", r: "", g: "Novel", c: "Black", k: "#04171d", s: 0.667, p: 567, u: "https://books.google.com/books/content?id=3SETVDEO45AC&printsec=frontcover&img=1&zoom=1&source=gbs_api" },
  { t: "Freedom", a: "Jonathan Franzen", y: "≤ 2021", r: "X", g: "Novel", c: "Blue", k: "#6891a9", s: 0.688, p: 562, u: "https://covers.openlibrary.org/b/id/15205666-L.jpg" },
  { t: "Curious Case of the Dog in the Nighttime", a: "Mark Haddon", y: "≤ 2021", r: "S", g: "Novel", c: "Red", k: "#ef4b32", s: 0.6, p: 240, u: "https://books.google.com/books/content?id=Thc32eB1Kx4C&printsec=frontcover&img=1&zoom=1&source=gbs_api" },
  { t: "Sol Lewitt 100 Views", a: "Sol LeWitt", y: "≤ 2021", r: "A", g: "Non-Fiction", c: "Black", k: "#484848", s: 0.871, p: 271, u: "https://books.google.com/books/content?id=PIo0AQAAIAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api" },
];
</script>

<script>
(function () {
  'use strict';

  var GROUPS = [
    { key: 'g', name: 'Genre', values: ['Sci-Fi', 'Non-Fiction', 'Novel', 'Fantasy', 'Play'] },
    { key: 'y', name: 'Year', values: ['2026', '2025', '2024', '2023', '2022', '≤ 2021'] },
    { key: 'r', name: 'Recommended', values: ['A', 'Y'], labels: { A: 'All-Time', Y: 'Yes' } }
  ];

  // 'S' and 'X' were two passes at the same verdict; both mean yes.
  books.forEach(function (b) { b.r = b.r === 'A' ? 'A' : (b.r ? 'Y' : ''); });

  var active = { g: 'all', y: 'all', r: 'all' };
  var buttons = [];
  var niches = document.getElementById('niches');
  var plaque = document.getElementById('plaque');

  // 'Yes' is a floor, not a tier: the all-time books were recommended too.
  function matches(b) {
    return (active.g === 'all' || b.g === active.g) &&
           (active.y === 'all' || b.y === active.y) &&
           (active.r === 'all' || (active.r === 'Y' ? b.r !== '' : b.r === active.r));
  }

  /* ---- lobby ---- */

  var filters = document.getElementById('filters');
  GROUPS.forEach(function (grp) {
    var fs = document.createElement('fieldset');
    fs.className = 'group';
    var lg = document.createElement('legend');
    lg.textContent = grp.name;
    fs.appendChild(lg);
    ['all'].concat(grp.values).forEach(function (v) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.textContent = v === 'all' ? 'All' : (grp.labels ? grp.labels[v] : v);
      btn.dataset.group = grp.key;
      btn.dataset.value = v;
      btn.addEventListener('click', function () {
        active[grp.key] = active[grp.key] === v ? 'all' : v;
        render();
      });
      fs.appendChild(btn);
      buttons.push(btn);
    });
    filters.appendChild(fs);
  });

  /* ---- wall ---- */

  function show(b) {
    plaque.textContent = b.t + '  ';
    var em = document.createElement('em');
    em.textContent = '· ' + b.a + ' · ' + b.y;
    plaque.appendChild(em);
    plaque.classList.add('on');
  }
  function rest() { plaque.classList.remove('on'); }

  books.forEach(function (b) {
    var niche = document.createElement('div');
    niche.className = 'niche' + (b.r === 'A' ? ' fav' : '');
    var a = document.createElement('a');
    a.className = 'cover';
    a.href = 'https://www.amazon.com/s?k=' + encodeURIComponent(b.t + ' ' + b.a) + '&i=stripbooks';
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.setProperty('--k', b.k);
    a.style.setProperty('--s', b.s);

    var img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = '';   // the link carries the name, and keeps it if the image fails
    img.src = b.u;
    a.setAttribute('aria-label', b.t + ' by ' + b.a);
    // Some cover hosts answer a missing book with a 1px placeholder rather
    // than an error, so a suspiciously small image counts as no image.
    function noCover() { img.remove(); }
    img.addEventListener('error', noCover);
    img.addEventListener('load', function () { if (img.naturalWidth < 8) noCover(); });
    a.appendChild(img);

    a.addEventListener('pointerenter', function () { show(b); });
    a.addEventListener('focus', function () { show(b); });
    a.addEventListener('pointerleave', function () { rest(); });
    a.addEventListener('blur', function () { rest(); });

    niche.appendChild(a);
    b.el = niche;
    niches.appendChild(niche);
  });

  function render() {
    buttons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', active[btn.dataset.group] === btn.dataset.value);
    });
    var shown = 0;
    books.forEach(function (b) {
      var on = matches(b);
      b.el.classList.toggle('off', !on);
      if (on) shown++;
    });
    rest();
    document.getElementById('empty').hidden = shown > 0;
    document.getElementById('readout').innerHTML =
      '<b>' + shown + '</b> of ' + books.length + ' books';
  }

  render();
})();
</script>
</body>
</html>
