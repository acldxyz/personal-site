<style>
  /* After Tadao Ando's Picture Book Museum in Iwaki, where the books are not
     shelved spine-out but stood face-out on long ledges up a concrete wall, so
     a child chooses by cover the way you choose a painting. Here each year is
     a bay of that wall, and the covers are the whole display: no spines, no
     list, nothing to read until you go up to one. */

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* --h is the cover height and the one number the wall is built from: the
       ledge, the pitch between ledges and the cover widths all follow it. */
    --h: clamp(92px, 10.5vw, 148px);
    --ledge: 7px;
    --rise: clamp(26px, 2.6vw, 38px);   /* air between a ledge and the covers above */
    --pitch: calc(var(--h) + var(--ledge) + var(--rise));
    --cover-gap: clamp(10px, 1.1vw, 16px);
    --margin: clamp(22px, 2.8vw, 40px);

    --ink: #6f665d;
    --ink-strong: #2f2a24;
    --ink-quiet: #8a8076;
    --focus: #3d7ba8;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 90% 70% at 50% 44%, #faf8f3 0%, #f2eee5 55%, #e8e3d8 100%)
      fixed;
    color: var(--ink);
    font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- topbar */

  /* The same bar as bookshelf.html, so the draft can be swapped in without
     the rest of the site noticing. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: clamp(14px, 1.6vw, 20px) var(--margin);
    border-bottom: 1px solid rgba(0,0,0,.08);
  }

  .wordmark {
    display: inline-block;
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Impact, system-ui, sans-serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: -.01em;
    line-height: 1.15;
    color: var(--ink-strong);
    text-decoration: none;
    opacity: .82;
    transition: opacity .2s ease;
  }
  .wordmark:hover { opacity: 1; }
  .wordmark:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .site-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 1px;
    font-size: 11px;
    margin-right: -.9em;
  }

  .site-nav a, .opt {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink);
    text-decoration: none;
    background: none;
    padding: .52em .9em;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: color .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .site-nav a:hover, .opt:hover {
    color: var(--ink-strong);
    background: rgba(0,0,0,.05);
    border-color: rgba(0,0,0,.14);
  }
  .site-nav a:focus-visible, .opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* -------------------------------------------------------------- lobby */

  /* The filters stand across the top like the museum's entrance hall rather
     than down a rail: the wall below is the room, and it gets the full width. */
  .lobby {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 28px;
    padding: clamp(22px, 2.6vw, 34px) var(--margin) 0;
  }

  .page-label, .readout, .bay-label, .bay-caption, .rec {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .page-label { color: var(--ink-strong); margin-right: 8px; }

  .group { display: flex; align-items: center; gap: 1px; border: 0; }
  .group legend {
    float: left;
    margin-right: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #a49a8e;
  }
  .opt[aria-pressed="true"] {
    color: var(--ink-strong);
    background: rgba(0,0,0,.07);
    border-color: rgba(0,0,0,.16);
  }

  .readout {
    margin-left: auto;
    color: var(--ink-quiet);
    font-variant-numeric: tabular-nums;
  }
  .readout b { font-weight: 600; color: var(--ink-strong); }

  /* --------------------------------------------------------------- wall */

  /* Ando's concrete is read by its formwork: panels a shaku by two, each with
     six tie holes left by the bolts. Drawn here at the faintest it can be and
     still register, it is what makes the paper read as a wall rather than as
     a page, without asking the covers to compete with it. The panel is sized
     off --pitch so the wall's grain scales with the covers. */
  .wall {
    --panel-w: calc(var(--pitch) * 0.5);
    position: relative;
    margin-top: clamp(18px, 2vw, 28px);
    padding: var(--rise) var(--margin) 80px;
    background:
      radial-gradient(circle, rgba(70,58,44,.10) 0 1.5px, transparent 2.2px)
        calc(var(--panel-w) * .25) calc(var(--pitch) / 6) / calc(var(--panel-w) * .5) calc(var(--pitch) / 3),
      linear-gradient(90deg, rgba(70,58,44,.07) 1px, transparent 1px)
        0 0 / var(--panel-w) 100%,
      linear-gradient(rgba(70,58,44,.07) 1px, transparent 1px)
        0 0 / 100% var(--pitch);
    border-top: 1px solid rgba(0,0,0,.08);
  }

  /* Iwaki's reading room has the Pacific along one side, and the light off it
     rakes across the wall. Same side as the site's light, upper left. */
  .wall::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(100deg, rgba(255,253,247,.55) 0%, rgba(255,253,247,0) 38%);
  }

  .bay { position: relative; margin-bottom: calc(var(--rise) * 1.4); }
  .bay[hidden] { display: none; }

  .bay-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    height: 14px;
    margin-bottom: 18px;
  }
  .bay-label { color: var(--ink-strong); font-variant-numeric: tabular-nums; }
  .bay-caption {
    color: var(--ink-quiet);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    transition: color .2s ease;
  }
  .bay-caption.on { color: var(--ink); }
  .bay-caption em { font-style: normal; color: var(--ink-quiet); }

  /* Every line of covers stands on a ledge, and the ledges are drawn as one
     repeating background on the bay rather than as elements, so a bay that
     wraps to three lines gets three ledges and the last one still runs the
     full width of the wall, as a real ledge would past its last book. The
     row gap is exactly the --rise the gradient leaves, which keeps the two in
     register. */
  .ledges {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    column-gap: var(--cover-gap);
    row-gap: calc(var(--ledge) + var(--rise));
    padding-bottom: var(--ledge);
    background: repeating-linear-gradient(to bottom,
      transparent 0 var(--h),
      #e2cfae var(--h) calc(var(--h) + 2px),                 /* top, catching the light */
      #b8946a calc(var(--h) + 2px) calc(var(--h) + var(--ledge)),   /* front edge */
      rgba(60,45,28,.16) calc(var(--h) + var(--ledge)),      /* cast onto the wall */
      transparent calc(var(--h) + var(--ledge) + 9px),
      transparent var(--pitch));
  }

  /* One book, face out. It leans back against the wall a few degrees from its
     foot, as anything stood on a picture ledge does — which is also why the
     cover's top edge is a shade darker than its foot. */
  .cover {
    position: relative;
    flex: 0 0 auto;
    display: block;
    height: var(--h);
    width: calc(var(--h) * var(--s));
    border-radius: 1.5px 2.5px 2.5px 1.5px;
    background: var(--k);
    transform-origin: 50% 100%;
    transform: perspective(900px) rotateX(5deg);
    box-shadow:
      inset 0 0 0 1px rgba(60,48,32,.14),
      3px 5px 8px -3px rgba(40,30,20,.32),
      1px 2px 2px rgba(40,30,20,.14);
    transition: transform .3s ease-out, box-shadow .3s ease-out, opacity .3s ease, visibility 0s;
    outline-offset: 4px;
  }
  .cover img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  /* The hinge down the left edge and the lean's falloff, in black and white
     only so no cover's colour shifts. */
  .cover::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0,0,0,.20) 0, rgba(255,255,255,.14) 3px, rgba(0,0,0,0) 7px),
      linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,0) 40%);
  }

  /* No cover image to be had: set the title on the book's own colour, the way
     the spines are set on the live shelf. */
  .cover .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10%;
    overflow: hidden;
    text-align: center;
    /* follows the cover, or a phone-sized cover loses the ends of its words */
    font-size: clamp(6px, calc(var(--h) * .068), 9px);
    font-weight: 600;
    letter-spacing: .05em;
    line-height: 1.25;
    text-transform: uppercase;
    color: var(--t);
  }

  /* Taken down off the ledge to look at: it comes upright and forward, and its
     shadow falls further onto the wall because it is further from it. */
  .cover:hover, .cover:focus-visible {
    transform: perspective(900px) translateY(-3px) rotateX(0deg) scale(1.04);
    box-shadow:
      inset 0 0 0 1px rgba(60,48,32,.14),
      8px 14px 22px -6px rgba(40,30,20,.36),
      2px 4px 6px rgba(40,30,20,.14);
    z-index: 2;
  }
  .cover:focus-visible { outline: 2px solid var(--focus); }

  /* Filtered out but left standing in its place, so the books that remain do
     not slide along the ledge and the wall keeps its shape. visibility takes
     it off the tab order and the accessibility tree as well. */
  .cover.off {
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
  }

  /* All-time favourites get the one thing a child's library would give them:
     a small paper tag on the ledge below. */
  .cover.fav::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: calc(var(--ledge) * -1 + 1px);
    width: 9px;
    height: 5px;
    margin-left: -4.5px;
    background: #c94a3f;
    border-radius: 1px;
    box-shadow: 0 1px 1px rgba(0,0,0,.2);
    transform: translateZ(0);
  }

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 0 var(--margin) 40px;
  }
  .rec {
    color: var(--ink-quiet);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: transparent;
    transition: color .2s ease, text-decoration-color .2s ease;
  }
  .rec:hover { color: var(--ink-strong); text-decoration-color: currentColor; }
  .rec:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .legend-fav { color: var(--ink-quiet); font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  .legend-fav::before {
    content: '';
    display: inline-block;
    width: 9px; height: 5px;
    margin-right: 8px;
    vertical-align: middle;
    background: #c94a3f;
    border-radius: 1px;
  }

  .empty {
    padding: 40px var(--margin);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-quiet);
  }

  @media (max-width: 860px) {
    :root { --h: clamp(78px, 21vw, 104px); --cover-gap: 9px; --margin: 20px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px 20px 16px; }
    .site-nav { justify-content: flex-start; margin: 0 0 0 -.9em; }
    .readout { margin-left: 0; width: 100%; }
    .lobby { gap: 8px 18px; }
    .group { flex-wrap: wrap; }
    .group legend { width: 100%; margin: 4px 0 2px .9em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01s !important;
      transition-duration: .01s !important;
      transition-delay: 0s !important;
    }
  }
</style>
</head>

  { t: "The Corrections", a: "Jonathan Franzen", y: "≤ 2021", r: "", g: "Novel", c: "Black", k: "#04171d", s: 0.667, p: 567, u: "https://books.google.com/books/content?id=3SETVDEO45AC&printsec=frontcover&img=1&zoom=1&source=gbs_api" },
  { t: "Freedom", a: "Jonathan Franzen", y: "≤ 2021", r: "X", g: "Novel", c: "Blue", k: "#6891a9", s: 0.688, p: 562, u: "https://covers.openlibrary.org/b/id/15205666-L.jpg" },
  { t: "Curious Case of the Dog in the Nighttime", a: "Mark Haddon", y: "≤ 2021", r: "S", g: "Novel", c: "Red", k: "#ef4b32", s: 0.6, p: 240, u: "https://books.google.com/books/content?id=Thc32eB1Kx4C&printsec=frontcover&img=1&zoom=1&source=gbs_api" },
  { t: "Sol Lewitt 100 Views", a: "Sol LeWitt", y: "≤ 2021", r: "A", g: "Non-Fiction", c: "Black", k: "#484848", s: 0.871, p: 271, u: "https://books.google.com/books/content?id=PIo0AQAAIAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api" },
];
</script>

<script>
(function () {
  'use strict';

  var GROUPS = [
    { key: 'g', name: 'Genre', values: ['Sci-Fi', 'Non-Fiction', 'Novel', 'Fantasy', 'Play'] },
    { key: 'r', name: 'Recommended', values: ['A', 'Y'], labels: { A: 'All-Time', Y: 'Yes' } }
  ];
  var YEARS = ['2026', '2025', '2024', '2023', '2022', '≤ 2021'];

  // 'S' and 'X' were two passes at the same verdict; both mean yes.
  books.forEach(function (b) { b.r = b.r === 'A' ? 'A' : (b.r ? 'Y' : ''); });

  var active = { g: 'all', r: 'all' };
  var buttons = [];
  var bays = {};
  var wall = document.getElementById('wall');

  function lum(hex) {
    var c = [1, 3, 5].map(function (i) {
      var v = parseInt(hex.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  // Same choice as the live shelf: whichever ink contrasts more, measured.
  function inkOn(hex) {
    var L = lum(hex);
    var dark = (L + 0.05) / (lum('#171310') + 0.05);
    var light = (lum('#fffcf6') + 0.05) / (L + 0.05);
    return dark >= light ? '#171310' : '#fffcf6';
  }

  // 'Yes' is a floor, not a tier: the all-time books were recommended too.
  function matches(b) {
    return (active.g === 'all' || b.g === active.g) &&
           (active.r === 'all' || (active.r === 'Y' ? b.r !== '' : b.r === active.r));
  }

  /* ---- lobby ---- */

  var filters = document.getElementById('filters');
  GROUPS.forEach(function (grp) {
    var fs = document.createElement('fieldset');
    fs.className = 'group';
    var lg = document.createElement('legend');
    lg.textContent = grp.name;
    fs.appendChild(lg);
    ['all'].concat(grp.values).forEach(function (v) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.textContent = v === 'all' ? 'All' : (grp.labels ? grp.labels[v] : v);
      btn.dataset.group = grp.key;
      btn.dataset.value = v;
      btn.addEventListener('click', function () {
        active[grp.key] = active[grp.key] === v ? 'all' : v;
        render();
      });
      fs.appendChild(btn);
      buttons.push(btn);
    });
    filters.appendChild(fs);
  });

  /* ---- wall ---- */

  YEARS.forEach(function (y) {
    var bay = document.createElement('section');
    bay.className = 'bay';
    bay.setAttribute('aria-label', y);

    var head = document.createElement('div');
    head.className = 'bay-head';
    var label = document.createElement('h2');
    label.className = 'bay-label';
    label.textContent = y;
    // A sighted reader's caption for whichever cover is in hand. The covers
    // carry their own names for a screen reader, so this is kept from it.
    var cap = document.createElement('p');
    cap.className = 'bay-caption';
    cap.setAttribute('aria-hidden', 'true');
    head.appendChild(label);
    head.appendChild(cap);

    var ledges = document.createElement('div');
    ledges.className = 'ledges';

    bay.appendChild(head);
    bay.appendChild(ledges);
    wall.insertBefore(bay, document.getElementById('empty'));
    bays[y] = { el: bay, ledges: ledges, cap: cap, books: [] };
  });

  function rest(bay) {
    var n = bay.books.filter(function (b) { return !b.el.classList.contains('off'); }).length;
    bay.cap.textContent = n + (n === 1 ? ' book' : ' books');
    bay.cap.classList.remove('on');
  }

  function show(bay, b) {
    bay.cap.innerHTML = '';
    bay.cap.appendChild(document.createTextNode(b.t + '  '));
    var em = document.createElement('em');
    em.textContent = '· ' + b.a;
    bay.cap.appendChild(em);
    bay.cap.classList.add('on');
  }

  books.forEach(function (b) {
    var bay = bays[b.y];
    var a = document.createElement('a');
    a.className = 'cover' + (b.r === 'A' ? ' fav' : '');
    a.href = 'https://www.amazon.com/s?k=' + encodeURIComponent(b.t + ' ' + b.a) + '&i=stripbooks';
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.setProperty('--k', b.k);
    a.style.setProperty('--t', inkOn(b.k));
    a.style.setProperty('--s', b.s);

    var img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = b.t + ' by ' + b.a;
    img.src = b.u;
    // Some cover hosts answer a missing book with a 1px placeholder rather
    // than an error, so a suspiciously small image is treated as no image.
    function noCover() {
      img.remove();
      var f = document.createElement('span');
      f.className = 'fallback';
      f.textContent = b.t;
      a.setAttribute('aria-label', b.t + ' by ' + b.a);
      a.appendChild(f);
    }
    img.addEventListener('error', noCover);
    img.addEventListener('load', function () { if (img.naturalWidth < 8) noCover(); });
    a.appendChild(img);

    a.addEventListener('pointerenter', function () { show(bay, b); });
    a.addEventListener('focus', function () { show(bay, b); });
    a.addEventListener('pointerleave', function () { rest(bay); });
    a.addEventListener('blur', function () { rest(bay); });

    b.el = a;
    bay.books.push(b);
    bay.ledges.appendChild(a);
  });

  function render() {
    buttons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', active[btn.dataset.group] === btn.dataset.value);
    });
    var shown = 0;
    YEARS.forEach(function (y) {
      var bay = bays[y], n = 0;
      bay.books.forEach(function (b) {
        var on = matches(b);
        b.el.classList.toggle('off', !on);
        if (on) n++;
      });
      // A bay with nothing left on it is taken down altogether; within a bay
      // the gaps are kept, so the survivors stay where they were.
      bay.el.hidden = n === 0;
      shown += n;
      rest(bay);
    });
    document.getElementById('empty').hidden = shown > 0;
    document.getElementById('readout').innerHTML =
      '<b>' + shown + '</b> of ' + books.length + ' books';
  }

  render();
})();
</script>
</body>
</html>
