<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thoughts — Adam Dawson</title>
<link rel="icon" type="image/svg+xml" href="favicon-block.svg">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S9B2L8ZZLW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-S9B2L8ZZLW');

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #6f665d;
    --ink-strong: #2f2a24;
    --ink-quiet: #8a8076;
    --prose: #574f47;
    --focus: #3d7ba8;
  }

  html { min-height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 90% 70% at 50% 44%, #faf8f3 0%, #f2eee5 55%, #e8e3d8 100%)
      fixed;
    /* the gradient's own edge colour, so nothing past it can ever show white */
    background-color: #e8e3d8;
    color: var(--ink);
    font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------ masthead */

  .mast {
    padding: clamp(18px, 3vw, 34px) clamp(18px, 3vw, 40px) 0;
  }

  .wordmark {
    display: inline-block;
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Impact, system-ui, sans-serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: -.01em;
    line-height: 1.15;
    color: var(--ink-strong);
    text-decoration: none;
    opacity: .82;
    transition: opacity .2s ease;
  }
  .wordmark:hover { opacity: 1; }
  .wordmark:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .page-label {
    margin-top: 9px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-quiet);
  }

  /* --------------------------------------------------------------- entries */

  /* While there are only a few entries the column sits in the middle of the
     page, like everything else in this language; once it outgrows the
     viewport, the auto margins collapse and it simply reads top to bottom. */
  .entries {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: min(34rem, 100% - 40px);
    margin: 0 auto;
    padding: clamp(40px, 8vh, 90px) 0 clamp(60px, 12vh, 120px);
  }

  .entry {
    opacity: 0;
    transform: translateY(6px);
    animation: arrive .62s ease-out forwards;
  }

  /* A short rule between entries rather than a box around each: the page
     should read as a notebook, not a feed. */
  .entry + .entry {
    margin-top: clamp(48px, 8vh, 72px);
    padding-top: clamp(48px, 8vh, 72px);
    border-top: 1px solid rgba(0, 0, 0, .10);
  }

  .entry h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    line-height: 1.5;
    color: var(--ink-strong);
  }

  .entry h2 a {
    color: inherit;
    text-decoration: none;
    border-radius: 4px;
  }
  .entry h2 a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .entry time {
    display: block;
    margin-top: 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #a49a8e;
  }

  .entry .body { margin-top: 22px; }

  .entry p {
    font-size: 17px;
    line-height: 1.68;
    color: var(--prose);
  }
  .entry p + p { margin-top: 1.05em; }

  @keyframes arrive {
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wordmark { transition-duration: .01s; }
    .entry { animation-duration: .01s; animation-delay: 0s !important; }
  }
</style>
</head>
<body>

<header class="mast">
  <a class="wordmark" href="index.html">ADAM<br>DAWSON</a>
  <div class="page-label">Thoughts</div>
</header>

<!-- Newest first. Each entry is an <article> with an id, so a single thought
     can be linked to directly (thoughts.html#a-wave). -->
<main class="entries" aria-label="Thoughts">

  <article class="entry" id="a-wave">
    <h2><a href="#a-wave">A wave</a></h2>
    <time datetime="2026-11">November 2026</time>
    <div class="body">
      <p>Wave hello at a stranger. There’s joy in seeing someone. There’s joy in
      being seen. The practice works regardless of their acknowledgment or
      reciprocation.</p>
    </div>
  </article>

</main>

<script>
  // Stagger the arrival so a page of entries settles in reading order rather
  // than all at once. Capped, so a long page never makes anyone wait.
  Array.prototype.forEach.call(document.querySelectorAll('.entry'), function (el, i) {
    el.style.animationDelay = Math.min(i, 4) * 0.08 + 's';
  });
</script>
</body>
</html>
