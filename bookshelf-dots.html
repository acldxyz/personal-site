<style>
  /* After Damien Hirst's spot paintings: a grid of spots of one size on a
     white ground, the gap between them equal to a spot, and no colour used
     twice. Here every book is a spot, painted in its cover's own colour, so
     the canvas is the shelf seen from across the room. Nothing is written
     on it; a spot gives up its title only when you go up to it. */

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --margin: clamp(22px, 2.8vw, 40px);

    --ink: #6f665d;
    --ink-strong: #2f2a24;
    --ink-quiet: #8a8076;
    --focus: #3d7ba8;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 90% 70% at 50% 44%, #faf8f3 0%, #f2eee5 55%, #e8e3d8 100%)
      fixed;
    color: var(--ink);
    font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- topbar */

  /* The same bar as bookshelf.html, so the draft can be swapped in without
     the rest of the site noticing. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: clamp(14px, 1.6vw, 20px) var(--margin);
    border-bottom: 1px solid rgba(0,0,0,.08);
  }

  .wordmark {
    display: inline-block;
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Impact, system-ui, sans-serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: -.01em;
    line-height: 1.15;
    color: var(--ink-strong);
    text-decoration: none;
    opacity: .82;
    transition: opacity .2s ease;
  }
  .wordmark:hover { opacity: 1; }
  .wordmark:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .site-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 1px;
    font-size: 11px;
    margin-right: -.9em;
  }

  .site-nav a, .opt {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink);
    text-decoration: none;
    background: none;
    padding: .52em .9em;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: color .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .site-nav a:hover, .opt:hover {
    color: var(--ink-strong);
    background: rgba(0,0,0,.05);
    border-color: rgba(0,0,0,.14);
  }
  .site-nav a:focus-visible, .opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* -------------------------------------------------------------- lobby */

  /* The filters stand across the top rather than down a rail, so the
     painting below gets the full width. */
  .lobby {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 28px;
    padding: clamp(22px, 2.6vw, 34px) var(--margin) 0;
  }

  .page-label, .readout, .plaque p, .rec {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .page-label { color: var(--ink-strong); margin-right: 8px; }

  /* min-width: 0 because a fieldset is otherwise at least as wide as its
     contents, and would push the page sideways on a phone rather than let
     its buttons wrap. */
  .group { display: flex; align-items: center; gap: 1px; border: 0; min-width: 0; }
  .group legend {
    float: left;
    margin-right: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #a49a8e;
  }
  .opt[aria-pressed="true"] {
    color: var(--ink-strong);
    background: rgba(0,0,0,.07);
    border-color: rgba(0,0,0,.16);
  }

  .readout {
    margin-left: auto;
    color: var(--ink-quiet);
    font-variant-numeric: tabular-nums;
  }
  .readout b { font-weight: 600; color: var(--ink-strong); }


  /* ------------------------------------------------------------- canvas */

  /* The painting hangs in whatever the window has left below the filters,
     centred, and layout() sizes it to fill as much of that as the grid's
     proportions allow. */
  .gallery {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(18px, 2.4vw, 34px) var(--margin) clamp(18px, 2.4vw, 34px);
  }

  /* --d is the spot's diameter and the one number the painting is built
     from: Hirst's spacing is a spot's width, and so is the margin to the
     canvas edge. --cols is set with it. */
  .canvas {
    --d: 24px;
    display: grid;
    grid-template-columns: repeat(var(--cols, 10), var(--d));
    grid-auto-rows: var(--d);
    gap: var(--d);
    padding: var(--d);
    /* Primed canvas: whiter than the page, so it reads as a painting hung on
       it rather than a panel of the page. */
    background: #fcfbf8;
    box-shadow:
      0 0 0 1px rgba(60,48,32,.06),
      0 2px 3px rgba(40,30,20,.06),
      0 18px 40px -18px rgba(40,30,20,.34);
  }

  /* Flat household gloss, as Hirst's assistants lay it: one even coat, no
     edge and no shading. The palest spots hold their circle on the white
     ground by colour alone, because the canvas is kept 10 clear of every
     spot along with the spots themselves — see SPOT below. */
  .spot {
    display: block;
    width: var(--d);
    height: var(--d);
    border-radius: 50%;
    background: var(--k);
    transition: transform .2s ease-out, background-color .3s ease, box-shadow .3s ease;
  }
  .spot:hover, .spot:focus-visible { transform: scale(1.22); }
  .spot:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* The pencilled circle a spot is painted into. A filtered-out book goes
     back to it, so the grid stays whole; and the places past the last book,
     there to square off the canvas, are left at it, unpainted, for the
     books still to come. */
  .spot.off, .spot.blank {
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(60,50,40,.16);
    transform: none;
  }
  .spot.off { pointer-events: none; }

  /* The label is pinned to the window, on the side away from the spot it
     names, and carries the cover: the canvas shows only colour, so this is
     where the book itself is seen. It holds nothing at rest. */
  .plaque {
    position: fixed;
    left: var(--margin);
    bottom: 18px;
    z-index: 5;
    display: flex;
    align-items: flex-end;
    gap: 14px;
    max-width: min(520px, calc(100vw - 2 * var(--margin)));
    padding: 10px 18px 10px 10px;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,.10);
    background: rgba(250,248,243,.94);
    box-shadow: 0 10px 28px -10px rgba(40,30,20,.36);
    color: var(--ink-strong);
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity .3s ease-out, transform .3s ease-out;
  }
  .plaque.on { opacity: 1; transform: none; }
  /* Held on the far side from the book it names, which it would otherwise
     cover whenever that book was low on the left wall. */
  .plaque.east { left: auto; right: var(--margin); }
  .plaque img, .plaque .swatch {
    flex: none;
    height: 132px;
    width: auto;
    border-radius: 1.5px 2.5px 2.5px 1.5px;
    box-shadow: 3px 4px 8px -3px rgba(40,30,20,.36), inset 0 0 0 1px rgba(60,48,32,.14);
  }
  .plaque .swatch { width: calc(132px * var(--s)); background: var(--k); }
  .plaque p { min-width: 0; padding-bottom: 2px; line-height: 1.7; }
  .plaque b, .plaque em { display: block; font-weight: 600; font-style: normal; }
  .plaque em { color: var(--ink-quiet); }
  @media (max-width: 860px) {
    .plaque img, .plaque .swatch { height: 96px; }
    .plaque .swatch { width: calc(96px * var(--s)); }
  }


  .foot {
    display: flex;
    justify-content: flex-end;
    gap: 20px;
    padding: 18px var(--margin) 40px;
  }
  .rec {
    color: var(--ink-quiet);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: transparent;
    transition: color .2s ease, text-decoration-color .2s ease;
  }
  .rec:hover { color: var(--ink-strong); text-decoration-color: currentColor; }
  .rec:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .empty {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-quiet);
    text-align: center;
    padding-bottom: 8px;
  }

  @media (max-width: 860px) {
    :root { --margin: 20px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px 20px 16px; }
    .site-nav { justify-content: flex-start; margin: 0 0 0 -.9em; }
    .readout { margin-left: 0; width: 100%; }
    .lobby { gap: 8px 18px; }
    .group { flex-wrap: wrap; }
    .group legend { width: 100%; margin: 4px 0 2px .9em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01s !important;
      transition-duration: .01s !important;
      transition-delay: 0s !important;
    }
  }
</style>

     Hirst's one rule for the spots is that no colour repeats, and it has to

     here is at least 10 apart in CIELAB (ΔE76), plainly different at a
     glance, and every spot is still a colour taken from its own cover. The
     canvas counts as a colour already used: the spots carry no edge, so a
     white cover's spot would otherwise be a hole in the grid.

     A book keeps its cover's main colour where that is already distinct,
     newest first. The rest, listed below, were found by reducing each cover
     to its palette and taking the most prominent colour on it that stands
     clear of every other spot, the hardest covers to place choosing first.
     10 is as far apart as this shelf allows; at 12 some all-black covers
     have nothing left to give. A new book needs the same check: if its main
     colour comes within 10 of a spot here, it takes another from its cover. */

  books.forEach(function (b) { b.paint = SPOT[b.t] || b.k.toLowerCase(); });

  /* ---- lobby ---- */

  var filters = document.getElementById('filters');
  GROUPS.forEach(function (grp) {
    var fs = document.createElement('fieldset');
    fs.className = 'group';
    var lg = document.createElement('legend');
    lg.textContent = grp.name;
    fs.appendChild(lg);
    ['all'].concat(grp.values).forEach(function (v) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.textContent = v === 'all' ? 'All' : (grp.labels ? grp.labels[v] : v);
      btn.dataset.group = grp.key;
      btn.dataset.value = v;
      btn.addEventListener('click', function () {
        active[grp.key] = active[grp.key] === v ? 'all' : v;
        render();
      });
      fs.appendChild(btn);
      buttons.push(btn);
    });
    filters.appendChild(fs);
  });

  /* ---- plaque ---- */

  function show(b) {
    plaque.textContent = '';
    var r = b.el.getBoundingClientRect();
    plaque.classList.toggle('east', r.left + r.width / 2 < innerWidth / 2);
    // The cover is only fetched when a spot is first pointed at: the canvas
    // itself shows none of them. Where it fails, the spot's colour in the
    // cover's shape stands in.
    var swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.setProperty('--k', b.paint);
    swatch.style.setProperty('--s', b.s);
    var art = swatch;
    if (!b.noCover) {
      art = document.createElement('img');
      art.alt = '';
      art.src = b.u;
      art.addEventListener('error', function () { b.noCover = true; if (art.parentNode) art.replaceWith(swatch); });
      art.addEventListener('load', function () { if (art.naturalWidth < 8) art.dispatchEvent(new Event('error')); });
    }
    var p = document.createElement('p');
    var t = document.createElement('b');
    t.textContent = b.t;
    var em = document.createElement('em');
    em.textContent = b.a + ' · ' + b.y;
    p.appendChild(t);
    p.appendChild(em);
    plaque.appendChild(art);
    plaque.appendChild(p);
    plaque.classList.add('on');
  }
  function rest() { plaque.classList.remove('on'); }

  /* ---- spots ---- */

  books.forEach(function (b) {
    var a = document.createElement('a');
    a.className = 'spot';
    a.setAttribute('role', 'listitem');
    a.href = 'https://www.amazon.com/s?k=' + encodeURIComponent(b.t + ' ' + b.a) + '&i=stripbooks';
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', b.t + ' by ' + b.a);
    a.style.setProperty('--k', b.paint);
    a.addEventListener('pointerenter', function () { show(b); });
    a.addEventListener('focus', function () { show(b); });
    a.addEventListener('pointerleave', rest);
    a.addEventListener('blur', rest);
    b.el = a;
    canvas.appendChild(a);
  });

  /* ---- layout ----
     The painting is whatever grid of spots fills the space best. A canvas c
     spots wide is (2c + 1) diameters across, a spot and a gap per column and
     one more gap for the far margin; so for every column count the spot is
     as large as both the width and the height allow, and the count that
     gives the largest spot wins. On a phone that is a tall narrow canvas, on
     a wide screen a long low one, and the spot shrinks or grows to match.
     Where it would still come out too small to point at, the canvas keeps
     the width and runs on down the page instead. */

  var MIN_D = 12, MAX_D = 72;

  function layout() {
    var cs = getComputedStyle(gallery);
    var W = gallery.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var top = gallery.getBoundingClientRect().top + scrollY;
    var foot = document.querySelector('.foot').offsetHeight;
    var H = innerHeight - top - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - foot;
    // On a phone the filters take half the screen, and fitting what is left
    // would leave spots too small to tap. There the painting may run on below
    // the fold, as tall as most of a screen.
    if (W < 560) H = Math.max(H, innerHeight * 0.78);
    var n = books.length, best = { d: 0 };

    for (var c = 1; c <= n; c++) {
      var r = Math.ceil(n / c);
      var d = Math.min(W / (2 * c + 1), H / (2 * r + 1));
      // A near tie goes to the grid with fewer unpainted places.
      if (d > best.d + 0.25 || (d > best.d - 0.25 && c * r - n < best.spare)) {
        best = { c: c, r: r, d: d, spare: c * r - n };
      }
    }
    if (best.d < MIN_D) {
      var cols = Math.max(1, Math.floor((W / MIN_D - 1) / 2));
      best = { c: cols, r: Math.ceil(n / cols), d: MIN_D, spare: cols * Math.ceil(n / cols) - n };
    }
    var dd = Math.floor(Math.min(MAX_D, best.d) * 4) / 4;
    canvas.style.setProperty('--d', dd + 'px');
    canvas.style.setProperty('--cols', best.c);

    while (blanks.length < best.spare) {
      var e = document.createElement('span');
      e.className = 'spot blank';
      e.setAttribute('aria-hidden', 'true');
      blanks.push(e);
    }
    blanks.forEach(function (e, i) {
      if (i < best.spare) canvas.appendChild(e); else e.remove();
    });
  }

  function render() {
    buttons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', active[btn.dataset.group] === btn.dataset.value);
    });
    var shown = 0;
    books.forEach(function (b) {
      var on = matches(b);
      b.el.classList.toggle('off', !on);
      // Back to pencil, so out of reach too: off the tab order and unread.
      if (on) { b.el.removeAttribute('tabindex'); b.el.removeAttribute('aria-hidden'); shown++; }
      else { b.el.tabIndex = -1; b.el.setAttribute('aria-hidden', 'true'); }
    });
    rest();
    document.getElementById('empty').hidden = shown > 0;
    document.getElementById('readout').innerHTML =
      '<b>' + shown + '</b> of ' + books.length + ' books';
  }

  var pending = 0;
  addEventListener('resize', function () {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(layout);
  });
  render();
  layout();
})();
</script>
