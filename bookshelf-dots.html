<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookshelf — Adam Dawson</title>
<link rel="icon" type="image/svg+xml" href="favicon-block.svg">
<!-- Draft: no analytics tag until it ships, so browsing it does not count as
     visits to the live Bookshelf. -->
<style>
  /* After Damien Hirst's spot paintings: a grid of spots of one size on a
     white ground, the gap between them equal to a spot, and no colour used
     twice. Here every book is a spot, painted in its cover's own colour, so
     the canvas is the shelf seen from across the room. Nothing is written
     on it; a spot gives up its title only when you go up to it. */

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --margin: clamp(22px, 2.8vw, 40px);

    --ink: #6f665d;
    --ink-strong: #2f2a24;
    --ink-quiet: #8a8076;
    --focus: #3d7ba8;
  }

  /* The page is the canvas: one flat primed white, edge to edge, rather
     than the site's warm paper with a painting hung on it. It has to be
     exactly the white the spot colours were chosen against (see SPOT), or
     the palest of them lose their 10 of separation from the ground. */
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: #fcfbf8;
    color: var(--ink);
    font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- topbar */

  /* The bar holds three things at rest: the wordmark, Filter beside it and
     the menu at the far end. Both menus open sideways from their buttons as
     overlays: the site links slide out leftward from the menu along the bar,
     and the filters unroll rightward in a band beneath it. Neither takes
     space from the page as it opens, so the spots never move for them. */
  .topbar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: clamp(14px, 2vw, 28px);
    padding: clamp(14px, 1.6vw, 20px) var(--margin);
    background: #fcfbf8;
  }
  .topbar .toggle { margin-left: -.9em; }

  /* On a desktop, Filter steps down out of the bar to sit under the name,
     at the start of the row kept free for the filters. Opened, it gives way
     to them: it fades as they unroll from the same place, and comes back
     when they are closed. */
  @media (min-width: 861px) {
    .topbar .toggle {
      position: absolute;
      left: var(--margin);
      top: calc(100% + 2px);
      z-index: 11;
      transition: color .2s ease, background-color .2s ease, border-color .2s ease, opacity .2s ease, visibility 0s;
    }
    .topbar .toggle[aria-expanded="true"] {
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility 0s linear .2s;
    }
  }

  /* Closes the filters from inside them; pushed to the far end of the row. */
  .band-close { margin-left: auto; }
  .menu { position: relative; margin-left: auto; display: flex; align-items: center; }

  .wordmark {
    display: inline-block;
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Impact, system-ui, sans-serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: -.01em;
    line-height: 1.15;
    color: var(--ink-strong);
    text-decoration: none;
    opacity: .82;
    transition: opacity .2s ease;
  }
  .wordmark:hover { opacity: 1; }
  .wordmark:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* Opens leftward from the menu button, on the page's white, over whatever
     it reaches; on a phone that is the wordmark too, and the row scrolls
     sideways rather than wrapping. Inert while closed. */
  .site-nav {
    position: absolute;
    right: calc(100% + 4px);
    top: 50%;
    display: flex;
    align-items: center;
    gap: 1px;
    min-height: 44px;    /* as tall as the two-line wordmark it may cover */
    /* Out to within 10px of the window's left edge, so on a phone its white
       covers the wordmark entirely rather than leaving a sliver showing. */
    max-width: calc(100vw - var(--margin) - 44px);
    overflow-x: auto;
    scrollbar-width: none;
    background: #fcfbf8;
    transform: translateY(-50%);
    clip-path: inset(-4px -4px -4px 100%);
    opacity: 0;
    transition: clip-path .45s ease-out, opacity .3s ease;
  }
  .site-nav::-webkit-scrollbar { display: none; }
  .site-nav.open { clip-path: inset(-4px -4px -4px 0); opacity: 1; }

  /* Three rules that close into a cross. */
  .burger {
    position: relative;
    width: 40px;
    height: 34px;
    margin-right: -10px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: none;
    cursor: pointer;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .burger:hover { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.14); }
  .burger:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .burger span {
    position: absolute;
    left: 12px;
    width: 16px;
    height: 1.5px;
    background: var(--ink);
    transition: transform .3s ease, opacity .2s ease, background-color .2s ease;
  }
  .burger span:nth-child(1) { top: 11px; }
  .burger span:nth-child(2) { top: 16px; }
  .burger span:nth-child(3) { top: 21px; }
  .burger:hover span, .burger[aria-expanded="true"] span { background: var(--ink-strong); }
  .burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
  .burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

  .site-nav a, .opt {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink);
    text-decoration: none;
    background: none;
    padding: .52em .9em;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: color .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .site-nav a:hover, .opt:hover {
    color: var(--ink-strong);
    background: rgba(0,0,0,.05);
    border-color: rgba(0,0,0,.14);
  }
  .site-nav a:focus-visible, .opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ------------------------------------------------------------ gallery */

  /* The spots are the page. They sit in whatever the window leaves below
     the bar, and everything else steps back: the only other thing near them
     is the label, which is also where the filters are folded away. */
  .gallery {
    position: relative;
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    /* --reserve is the filter band's height, kept free above the spots
       whenever the band is short enough to spare it, open or not: see
       layout(). */
    padding: calc(clamp(18px, 2.6vw, 40px) + var(--reserve, 0px)) var(--margin) clamp(18px, 2.6vw, 40px);
  }

  .work {
    --d: 24px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  /* --d is the spot's diameter and the one number the painting is built
     from: Hirst's spacing is a spot's width, and so is the margin to the
     canvas edge. layout() sets it and the canvas's size on the figure,
     every spot's
     place, and all of them transition, so when a filter changes the grid
     the canvas resizes and the spots travel to their new places together
     instead of the painting being torn down and rehung. */
  .canvas {
    position: relative;
    width: var(--cw, 0px);
    height: var(--ch, 0px);
    /* A book leaving fades where it stood, but takes the new spot size like
       the rest, so on a shrinking canvas it can stand past the edge. Clipped,
       as paint would be. A spot's hover growth stays well inside the margin. */
    overflow: hidden;
    /* No ground of its own: the page is the canvas. The box remains, unseen,
       to hold the one-spot margin that a saved image is cropped to. */
    transition: width .45s ease-out, height .45s ease-out;
  }

  /* Flat household gloss, as Hirst's assistants lay it: one even coat, no
     edge and no shading. The palest spots hold their circle on the white
     ground by colour alone, because the canvas is kept 10 clear of every
     spot along with the spots themselves — see SPOT below. */
  .spot {
    position: absolute;
    left: var(--x, 0px);
    top: var(--y, 0px);
    width: var(--d);
    height: var(--d);
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--k);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition:
      left .45s ease-out, top .45s ease-out, width .45s ease-out, height .45s ease-out,
      transform .2s ease-out, opacity .3s ease;
  }
  .canvas.still, .canvas.still .spot { transition: none; }
  /* --px/--py are the push from the pointer (see field()). The spot the
     pointer is on is marked .lit by the script rather than by :hover, so
     that it is judged from where the spots rest, not from where they have
     been pushed to; it grows in place. */
  .spot { transform: translate(var(--px, 0px), var(--py, 0px)); }
  .spot.lit, .spot:focus-visible { transform: translate(var(--px, 0px), var(--py, 0px)) scale(1.3); }
  .spot:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* A filtered-out book leaves the painting: it fades where it stood while
     the rest regroup without it. It stops answering the pointer at once
     rather than after the fade, so nothing on the canvas responds that is
     not in the picture. */
  .spot.off {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: none;
    transition:
      left .45s ease-out, top .45s ease-out, width .45s ease-out, height .45s ease-out,
      opacity .3s ease, visibility 0s linear .3s;
  }

  .empty {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
  }

  /* --------------------------------------------------------------- label */

  /* The wall label, as a gallery hangs one: small, below the painting's
     left edge and no wider than the painting. It says what the work is and
     how many spots, and the filters fold away inside it, so they are there
     when wanted and otherwise one quiet word. */
  /* With no canvas edge to hang from, the label lines up with the spots
     themselves: its left edge under the first column, its right edge under
     the last. */
  .label {
    width: max(calc(var(--cw, 0px) - 2 * var(--d)), min(340px, 100%));
    max-width: calc(100% - var(--d));
    margin-left: var(--d);
    padding-top: 2px;
  }

  .label-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px 18px;
  }

  .label h1, .caption p, .rec, .empty, .group legend {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  /* The caption names the painting at rest and, while a spot is pointed
     at, the book it is. Both are kept in one cell, cross-fading, and the
     cell holds the taller one's height, so the label never jumps. */
  .caption {
    display: grid;
    min-width: 0;
    min-height: 52px;
  }
  .about, .book {
    grid-area: 1 / 1;
    pointer-events: none;    /* the faded one must not catch the other's clicks */
    min-width: 0;
    transition: opacity .2s ease;
  }
  .caption.pointing .about, .book { opacity: 0; }
  .caption.pointing .book { opacity: 1; }

  .label h1 { color: var(--ink-strong); line-height: 1.7; }
  .label h1 .which { color: var(--ink); }
  .caption p { color: var(--ink-quiet); line-height: 1.7; font-variant-numeric: tabular-nums; }

  .book { display: flex; align-items: flex-start; gap: 12px; }
  .book img, .book .swatch {
    flex: none;
    height: 52px;
    width: auto;
    border-radius: 1px 2px 2px 1px;
    box-shadow: 2px 3px 6px -3px rgba(40,30,20,.4), inset 0 0 0 1px rgba(60,48,32,.14);
  }
  .book .swatch { width: calc(52px * var(--s)); background: var(--k); }
  .book p { min-width: 0; }
  .book b {
    display: block;
    font-weight: 600;
    color: var(--ink-strong);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1px;
    flex: none;
    margin: -.45em -.9em 0 0;
  }

  .rec {
    padding: .52em .9em;
    color: var(--ink-quiet);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: transparent;
    transition: color .2s ease, text-decoration-color .2s ease;
  }
  .rec:hover { color: var(--ink-strong); text-decoration-color: currentColor; }
  .rec:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .opt[aria-pressed="true"], .opt[aria-expanded="true"] {
    color: var(--ink-strong);
    background: rgba(0,0,0,.07);
    border-color: rgba(0,0,0,.16);
  }
  /* The count of active filters rides on the toggle, so a closed band still
     says the painting is showing less than the whole shelf. */
  .toggle .n { color: var(--ink-strong); }

  /* Shown only while a filter is on; it keeps its place while hidden, so
     the band's height never changes with it. */
  .clear { transition: color .2s ease, background-color .2s ease, border-color .2s ease, opacity .3s ease; }
  .clear[disabled] { opacity: 0; pointer-events: none; }

  /* The filters, in one band under the bar that unrolls left to right from
     the Filter button. It is laid out even while closed, only clipped away,
     so its height is known before it opens and the room for it can be kept
     free. Where it would take too much of a small screen it lies over the
     top of the spots instead, on the page's white with a soft edge, and the
     spots under it are left exactly as they were. Inert while closed. */
  .band {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    padding: 2px var(--margin) 12px;
    background: #fcfbf8;
    clip-path: inset(0 100% -24px 0);
    opacity: 0;
    transition: clip-path .45s ease-out, opacity .3s ease;
  }
  .band.open { clip-path: inset(0 0 -24px 0); opacity: 1; }
  .band.over { box-shadow: 0 14px 18px -14px rgba(40,30,20,.22); }
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px clamp(18px, 2.4vw, 34px);
    /* Pulled out by a button's inset, so the text in it lines up with the
       name; stated in the buttons' 11px, not this box's own font size. */
    margin-left: calc(-11px * .9);
  }

  /* min-width: 0 because a fieldset is otherwise at least as wide as its
     contents, and would push the page sideways on a phone rather than let
     its buttons wrap. */
  .group { display: flex; align-items: baseline; border: 0; min-width: 0; }
  .group legend {
    float: left;
    flex: none;
    /* The row is pulled out by .9em of the buttons' 11px; the legend's own
       10px em would come up short and leave it left of the name above. */
    padding: 0 .3em 0 calc(11px * .9);
    font-size: 10px;
    color: #a49a8e;
  }
  /* The options wrap within their own column, so a second line starts under
     the first option rather than under the group's name. */
  .group .opts { display: flex; flex-wrap: wrap; gap: 1px; min-width: 0; }

  @media (max-width: 860px) {
    :root { --margin: 20px; }
  }
  @media (max-width: 560px) {
    .label-row { flex-direction: column; }
    .actions { margin: 0 0 0 -.9em; }
    .group { flex-direction: column; }
    .group legend { width: 100%; margin: 4px 0 0; }
  }

  /* ---------------------------------------------------------------- card */

  /* A spot's first click opens its card over the painting: the cover, and
     when it was read, what kind of book it is and whether it is
     recommended. The painting stays where it is behind a veil of the page's
     white; the cover itself is the way through to buying it. */
  .card {
    margin: auto;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: #fcfbf8;
    color: var(--ink);
    box-shadow:
      0 0 0 1px rgba(60,48,32,.08),
      0 24px 60px -18px rgba(40,30,20,.38);
    max-width: min(620px, calc(100vw - 2 * var(--margin)));
    max-height: calc(100vh - 2 * var(--margin));
    opacity: 0;
    transform: translateY(8px) scale(.98);
    transition: opacity .3s ease-out, transform .3s ease-out, overlay .3s allow-discrete, display .3s allow-discrete;
  }
  .card[open] { opacity: 1; transform: none; }
  @starting-style { .card[open] { opacity: 0; transform: translateY(8px) scale(.98); } }
  .card::backdrop {
    background: rgba(252,251,248,.72);
    opacity: 0;
    transition: opacity .3s ease-out, overlay .3s allow-discrete, display .3s allow-discrete;
  }
  .card[open]::backdrop { opacity: 1; }
  @starting-style { .card[open]::backdrop { opacity: 0; } }

  .card-body {
    display: flex;
    gap: clamp(20px, 3vw, 32px);
    padding: clamp(20px, 3vw, 30px);
  }

  /* The cover is the link. It lifts a little when pointed at, as a book
     picked up would, and says where it goes underneath. */
  .buy {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: var(--ink-quiet);
  }
  .buy .art {
    display: block;
    height: clamp(200px, 34vh, 290px);
    width: auto;
    border-radius: 1.5px 3px 3px 1.5px;
    box-shadow: 3px 5px 12px -4px rgba(40,30,20,.42), inset 0 0 0 1px rgba(60,48,32,.14);
    transition: transform .3s ease-out, box-shadow .3s ease-out;
  }
  .buy .art.swatch { width: calc(clamp(200px, 34vh, 290px) * var(--s)); background: var(--k); }
  .buy:hover .art { transform: translateY(-3px); box-shadow: 6px 12px 22px -6px rgba(40,30,20,.42), inset 0 0 0 1px rgba(60,48,32,.14); }
  .buy:hover { color: var(--ink-strong); }
  .buy:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 3px; }
  .buy span, .facts dt, .card-close, .card h2, .card .by {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .buy span { transition: color .2s ease; }

  .card-text { min-width: 0; display: flex; flex-direction: column; padding-top: 2px; }
  .card h2 { color: var(--ink-strong); font-size: 13px; line-height: 1.45; }
  .card .by { color: var(--ink-quiet); margin-top: 4px; }
  .facts {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px 22px;
    margin-top: 28px;
    font-size: 13px;
    color: var(--ink-strong);
  }
  .facts dt { font-size: 10px; color: #a49a8e; padding-top: 2px; }

  .card-close {
    position: absolute;
    top: 10px;
    right: 10px;
  }

  @media (max-width: 560px) {
    /* Full width, so the cover at its top left stays clear of the close
       button at the top right. */
    .card { width: calc(100vw - 2 * var(--margin)); }
    .card-body { flex-direction: column; align-items: flex-start; }
    .buy .art { height: 220px; }
    .buy .art.swatch { width: calc(220px * var(--s)); }
    .facts { margin-top: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01s !important;
      transition-duration: .01s !important;
      transition-delay: 0s !important;
    }
  }
</style>
</head>

<header class="topbar">
  <a class="wordmark" href="index.html">ADAM<br>DAWSON</a>
  <button type="button" class="opt toggle" id="toggle" aria-expanded="false" aria-controls="band">Filter<span class="n" id="n"></span></button>
  <div class="menu">
    <nav class="site-nav" id="site-nav" aria-label="Primary" inert>

  </div>
  <div class="band" id="band" inert>
    <div class="filters" id="filters"></div>
  </div>
</header>

<main class="gallery" id="gallery">
  <figure class="work">
    <div class="canvas" id="canvas" role="group" aria-label="One spot per book, newest first">
      <p class="empty" id="empty" hidden>No book is all of those</p>
    </div>

    <figcaption class="label" id="label">
      <div class="label-row">
        <div class="caption" id="caption">
          <div class="about">
            <h1>Bookshelf<span class="which" id="which"></span></h1>
            <p id="count" aria-live="polite"></p>

          <div class="book" id="book" aria-hidden="true"></div>

        <div class="actions">
          <button type="button" class="opt" id="save">Save image</button>
          <a class="rec" href="mailto:adam@acld.xyz?subject=Book%20recommendation&amp;body=Title%3A%0D%0A%0D%0AAuthor%3A%0D%0A%0D%0AWhy%3A%0D%0A%0D%0A">Send a rec</a>
        </div>
      </div>
    </figcaption>
  </figure>
</main>

<dialog class="card" id="card" aria-labelledby="card-title">
  <div class="card-body">
    <a class="buy" id="card-buy" target="_blank" rel="noopener"></a>
    <div class="card-text">
      <h2 id="card-title"></h2>
      <p class="by" id="card-by"></p>
      <dl class="facts">
        <dt>Read</dt><dd id="card-read"></dd>
        <dt>Genre</dt><dd id="card-genre"></dd>
        <dt>Recommended</dt><dd id="card-rec"></dd>
      </dl>
    </div>
  </div>
  <button type="button" class="opt card-close" id="card-close" aria-label="Close">✕</button>
</dialog>

<script>
/* t title · a author · y year · r recommendation · g genre · c colour family
   k dominant hex · s cover aspect (w/h) · p pages · u cover */
var books = [
  { t: "The Tao of Fundraising", a: "John Kim", y: "2026", r: "X", g: "Non-Fiction", c: "White", k: "#e8e4da", s: 0.667, p: 256, u: "https://m.media-amazon.com/images/P/163763496X.01.L.jpg" },

<script>

    { key: 'y', name: 'Year', values: ['2026', '2025', '2024', '2023', '2022', '≤ 2021'],

  ];

  // 'S' and 'X' were two passes at the same verdict; both mean yes.
  books.forEach(function (b) { b.r = b.r === 'A' ? 'A' : (b.r ? 'Y' : ''); });

  // Three genres here rather than the data's five: novels, fantasy and plays
  // are all fiction that is not science fiction. The data keeps its own
  // labels, which bookshelf.html still uses.
  var GENRE = { Novel: 'Fiction', Fantasy: 'Fiction', Play: 'Fiction' };

     blacks and near whites that differ by a digit. So every pair of spots
     here is at least 10 apart in CIELAB (ΔE76), plainly different at a
     glance, and every spot is still a colour taken from its own cover. The
     canvas counts as a colour already used: the spots carry no edge, so a
     white cover's spot would otherwise be a hole in the grid.

     A book keeps its cover's main colour where that is already distinct,
     newest first. The rest, listed below, were found by reducing each cover
     to its palette and taking the most prominent colour on it that stands
     clear of every other spot, the hardest covers to place choosing first.
     10 is as far apart as this shelf allows; at 12 some all-black covers

     colour comes within 10 of a spot here, it takes another from its cover. */

  // no layout(), so the spots stay exactly where they are.
  function setOpen(btn, panel, open) {
    panel.classList.toggle('open', open);

  }
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') !== 'true';

    if (open) band.querySelector('.opt').focus();

  burger.addEventListener('click', function () {
    setOpen(burger, siteNav, burger.getAttribute('aria-expanded') !== 'true');
  });
  addEventListener('keydown', function (e) {
    // An open card takes Escape for itself and leaves the menus as they are.
    if (e.key !== 'Escape' || card.open) return;
    [[burger, siteNav], [toggle, band]].some(function (pair) {
      if (pair[0].getAttribute('aria-expanded') !== 'true') return false;

  });

  /* ---- caption ---- */

  function show(b) {
    book.textContent = '';
    // The cover is only fetched when a spot is first pointed at: the canvas
    // itself shows none of them. Where it fails, the spot's colour in the
    // cover's shape stands in.
    var swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.setProperty('--k', b.paint);
    swatch.style.setProperty('--s', b.s);
    var art = swatch;
    if (!b.noCover) {
      art = document.createElement('img');
      art.alt = '';
      art.src = b.u;
      art.addEventListener('error', function () { b.noCover = true; if (art.parentNode) art.replaceWith(swatch); });
      art.addEventListener('load', function () { if (art.naturalWidth < 8) art.dispatchEvent(new Event('error')); });
    }
    var p = document.createElement('p');
    var t = document.createElement('b');
    t.textContent = b.t;
    p.appendChild(t);
    p.appendChild(document.createTextNode(b.a + ' · ' + b.y));
    book.appendChild(art);
    book.appendChild(p);
    caption.classList.add('pointing');
  }
  function rest() { caption.classList.remove('pointing'); }

  /* The pointer is a field the spots lean away from, wherever it is over
     the painting: on a spot, between two, or in the white around them. Each
     spot is pushed straight away from the pointer by an amount that rises
     with distance up to one spot pitch, so the spot the pointer is on stays
     put while its four touching neighbours get the full push, three tenths
     of a diameter; then it falls off with the square of the distance and
     tapers to nothing at REACH pitches. Between two spots both part; in the
     white, the nearest lean back. Only the spot the pointer is actually on,
     judged from the resting grid, grows and names itself in the label.
     Everything eases as the rest of the page does; nothing springs. */
  var spotD = 0, pushed = [], lit = null;
  // PUSH is before the taper, which at one pitch leaves about two thirds
  // of it: the three tenths above.
  var PUSH = 0.45, REACH = 2.3;     // in diameters, and in spot pitches

  function field(px, py, skip) {
    var pitch = 2 * spotD, next = [];
    books.forEach(function (o) {
      if (!o.on || o === skip) return;
      var dx = o.cx - px, dy = o.cy - py;
      var r = Math.sqrt(dx * dx + dy * dy) / pitch;
      if (r >= REACH || r === 0) return;
      var taper = 1 - (r / REACH) * (r / REACH);
      var push = PUSH * spotD * (r < 1 ? r : 1 / (r * r)) * taper * taper;
      o.el.style.setProperty('--px', dx / (r * pitch) * push + 'px');
      o.el.style.setProperty('--py', dy / (r * pitch) * push + 'px');
      next.push(o);
    });
    pushed.forEach(function (o) {
      if (next.indexOf(o) < 0) { o.el.style.removeProperty('--px'); o.el.style.removeProperty('--py'); }
    });
    pushed = next;
  }
  function calm() {
    pushed.forEach(function (o) { o.el.style.removeProperty('--px'); o.el.style.removeProperty('--py'); });
    pushed = [];
  }
  function light(b) {
    if (lit === b) return;
    if (lit) lit.el.classList.remove('lit');
    lit = b;
    if (b) { b.el.classList.add('lit'); show(b); } else rest();
  }

  // Read against the canvas's resting box, a frame at a time. The reach runs
  // out past the canvas edge too, so a pointer just outside it still leans
  // the outer spots in a little.
  var pointer = null, frame = 0;
  function track() {
    frame = 0;
    if (!pointer || !spotD) return;
    var box = canvas.getBoundingClientRect();
    var x = pointer.x - box.left, y = pointer.y - box.top;
    var reach = REACH * 2 * spotD;
    if (x < -reach || y < -reach || x > box.width + reach || y > box.height + reach) { calm(); light(null); return; }
    var on = null;
    books.forEach(function (o) {
      if (o.on && Math.hypot(o.cx - x, o.cy - y) <= spotD / 2) on = o;
    });
    light(on);
    field(x, y, on);
  }
  gallery.addEventListener('pointermove', function (e) {
    pointer = { x: e.clientX, y: e.clientY };
    if (!frame) frame = requestAnimationFrame(track);
  });
  gallery.addEventListener('pointerleave', function () {
    pointer = null;
    calm();
    light(null);
  });

  function buyUrl(b) {
    var fromCover = /\/images\/P\/([0-9]{9}[0-9X])\./.exec(b.u);
    var isbn = ISBN[b.t] || (fromCover && fromCover[1]);
    return isbn ? 'https://www.amazon.com/dp/' + isbn
                : 'https://www.amazon.com/s?k=' + encodeURIComponent(b.t + ' ' + b.a) + '&i=stripbooks';
  }

  var card = document.getElementById('card');
  var REC = { A: 'All-time', Y: 'Yes', '': 'No' };

  function openCard(b) {
    light(null);
    calm();
    var buy = document.getElementById('card-buy');
    buy.textContent = '';
    buy.href = buyUrl(b);
    buy.setAttribute('aria-label', 'Buy ' + b.t + ' on Amazon (opens in a new tab)');
    var swatch = document.createElement('span');
    swatch.className = 'art swatch';
    swatch.style.setProperty('--k', b.paint);
    swatch.style.setProperty('--s', b.s);
    var art = swatch;
    if (!b.noCover) {
      art = document.createElement('img');
      art.className = 'art';
      art.alt = '';
      art.src = b.u;
      art.addEventListener('error', function () { b.noCover = true; if (art.parentNode) art.replaceWith(swatch); });
      art.addEventListener('load', function () { if (art.naturalWidth < 8) art.dispatchEvent(new Event('error')); });
    }
    var where = document.createElement('span');
    where.textContent = 'Buy on Amazon ↗';
    buy.appendChild(art);
    buy.appendChild(where);
    document.getElementById('card-title').textContent = b.t;
    document.getElementById('card-by').textContent = b.a;
    document.getElementById('card-read').textContent = b.y === '≤ 2021' ? '2021 or earlier' : b.y;
    document.getElementById('card-genre').textContent = b.g;
    document.getElementById('card-rec').textContent = REC[b.r];
    card.showModal();
  }

  document.getElementById('card-close').addEventListener('click', function () { card.close(); });
  // A click on the veil around the card, rather than on the card, closes it.
  card.addEventListener('click', function (e) {
    var r = card.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) card.close();
  });

  /* ---- spots ---- */

  books.forEach(function (b) {
    // A button, not a link: a spot opens its card and goes nowhere itself.
    // The card's cover is the only way through to the shop, so the two
    // steps can never fire together; a link here, even one whose click was
    // cancelled, was still followed by hosts that open new tabs themselves.
    var a = document.createElement('button');
    a.type = 'button';
    a.className = 'spot';
    a.setAttribute('aria-label', b.t + ' by ' + b.a);
    a.setAttribute('aria-haspopup', 'dialog');
    a.style.setProperty('--k', b.paint);
    // The keyboard gets the same push, from the focused spot's own centre;
    // only the keyboard, though. Focus also lands here when a card closes
    // and hands it back, and after a tap that is no reason to hold the
    // neighbours apart or keep the book named.
    a.addEventListener('focus', function () {
      if (!a.matches(':focus-visible')) return;
      show(b);
      field(b.cx, b.cy, b);
    });
    a.addEventListener('blur', function () { rest(); calm(); });
    a.addEventListener('click', function () { openCard(b); });
    b.el = a;
    canvas.appendChild(a);
  });

  /* ---- layout ----
     The painting is whatever grid of the spots on show fills the space best,
     worked out again every time the filters change. A canvas c spots wide is
     (2c + 1) diameters across, a spot and a gap per column and one more gap
     for the far margin; so for every column count the spot is as large as
     both the width and the height allow, and the count that gives the
     largest spot wins. Fewer books make a smaller grid of larger spots, a
     single book one spot as large as the space allows. Where the last row
     comes up short it runs from the left like the rows above it, and simply
     stops: no blank places, the canvas only ever holds the books on it. */

  var MIN_D = 12, MAX_D = 150;

  // The label takes the canvas's new width at once (only the canvas
  // animates), so this reads the height it will settle at.
  function labelHeight() {
    var label = document.getElementById('label');
    return label.querySelector('.label-row').offsetHeight + parseFloat(getComputedStyle(label).paddingTop);
  }

  // The filter band's height is kept free above the spots, open or not, so
  // opening it never moves them. Only while it is a slim band, though: on a
  // small screen the filters wrap into a block that would cost the spots
  // more than it is worth, and there the band lies over them instead.
  function reserve() {
    var h = band.offsetHeight;
    var keep = h <= Math.max(72, innerHeight * 0.14);
    band.classList.toggle('over', !keep);
    gallery.style.setProperty('--reserve', (keep ? h : 0) + 'px');
  }

  function layout(again) {
    if (!again) reserve();
    var shown = books.filter(function (b) { return b.on; });
    var n = shown.length;
    var cs = getComputedStyle(gallery);
    var W = gallery.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var top = gallery.getBoundingClientRect().top + scrollY;
    var lab = labelHeight();
    var H = innerHeight - top - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - lab;
    // On a phone the bar takes much of the screen, and fitting what is left
    // would leave spots too small to tap. There the painting may run on below
    // the fold, as tall as most of a screen.
    if (W < 560) H = Math.max(H, innerHeight * 0.72);

    document.getElementById('empty').hidden = n > 0;
    if (!n) return;            // an empty canvas keeps the size it had

    var best = { d: 0 };
    for (var c = 1; c <= n; c++) {
      var r = Math.ceil(n / c);
      var d = Math.min(W / (2 * c + 1), H / (2 * r + 1));
      // A near tie goes to the grid whose last row is fuller.
      if (d > best.d + 0.25 || (d > best.d - 0.25 && c * r - n < best.spare)) {
        best = { c: c, r: r, d: d, spare: c * r - n };
      }
    }
    if (best.d < MIN_D) {
      var cols = Math.max(1, Math.floor((W / MIN_D - 1) / 2));
      best = { c: cols, r: Math.ceil(n / cols), d: MIN_D };
    }
    c = best.c; r = best.r;
    var D = Math.floor(Math.min(MAX_D, best.d) * 4) / 4;
    spotD = D;

    // Set on the figure, not the canvas, so the label beneath reads the
    // canvas's width too and stays exactly as wide as the painting.
    work.style.setProperty('--d', D + 'px');
    work.style.setProperty('--cw', (2 * c + 1) * D + 'px');
    work.style.setProperty('--ch', (2 * r + 1) * D + 'px');
    shown.forEach(function (b, i) {
      var row = Math.floor(i / c), col = i % c;
      b.el.style.setProperty('--x', D + col * 2 * D + 'px');
      b.el.style.setProperty('--y', D + row * 2 * D + 'px');
      b.cx = D + col * 2 * D + D / 2;     // resting centre, for the field
      b.cy = D + row * 2 * D + D / 2;
    });

    // The label is as wide as the canvas, so a new canvas width can rewrap
    // the caption and change the height the painting was fitted around.
    // Measured again once, at the label's new width — never more, or a
    // borderline case could see-saw.
    if (!again && labelHeight() !== lab) layout(true);
  }

  function render() {
    buttons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', active[btn.dataset.group] === btn.dataset.value);
    });
    var shown = 0;
    books.forEach(function (b) {
      b.on = matches(b);
      b.el.classList.toggle('off', !b.on);
      // Out of the painting, so out of reach too: off the tab order and unread.
      if (b.on) { b.el.removeAttribute('tabindex'); b.el.removeAttribute('aria-hidden'); shown++; }
      else { b.el.tabIndex = -1; b.el.setAttribute('aria-hidden', 'true'); }
    });
    // The grid is about to move under the pointer: let go of it entirely
    // until the pointer moves again.
    light(null);
    calm();
    rest();

    // The label reads as a gallery label would for this selection.
    var names = GROUPS.filter(function (g) { return active[g.key] !== 'all'; }).map(function (g) {
      var v = active[g.key];
      if (g.key === 'r') return v === 'A' ? 'All-time' : 'Recommended';
      // In the label a bare 25 could be read as a count beside the count
      // below it, so a year there takes its apostrophe: ’25, ≤ ’21.
      if (g.key === 'y') return g.labels[v].replace(/(\d+)/, '\u2019$1');
      return v;
    });
    document.getElementById('which').textContent = names.length ? ' — ' + names.join(' · ') : '';
    document.getElementById('count').textContent =
      (shown === books.length ? books.length + ' spots' : shown + ' of ' + books.length + ' spots');
    document.getElementById('n').textContent = names.length ? ' · ' + names.length : '';
    clear.disabled = !names.length;

    layout();
  }

  /* ---- save ----
     The image is the spots alone, drawn afresh rather than captured from the
     screen: the grid as it stands, its one-spot margin all round, on the
     page's white, at a size that prints. It is drawn from where each spot is
     going, not where it is, so a save pressed mid-transition still comes out
     square. Where the device can share a file (most phones) it goes to the
     share sheet; otherwise it downloads. */

  var GROUND = '#fcfbf8';

  function picture() {
    var st = getComputedStyle(work);
    var d = parseFloat(st.getPropertyValue('--d'));
    var w = parseFloat(st.getPropertyValue('--cw')), h = parseFloat(st.getPropertyValue('--ch'));
    var k = Math.max(2, 2400 / w);          // at least 2400px across
    var c = document.createElement('canvas');
    c.width = Math.round(w * k);
    c.height = Math.round(h * k);
    var g = c.getContext('2d');
    g.fillStyle = GROUND;
    g.fillRect(0, 0, c.width, c.height);
    books.forEach(function (b) {
      if (!b.on) return;
      var x = parseFloat(b.el.style.getPropertyValue('--x')), y = parseFloat(b.el.style.getPropertyValue('--y'));
      g.fillStyle = b.paint;
      g.beginPath();
      g.arc((x + d / 2) * k, (y + d / 2) * k, d / 2 * k, 0, Math.PI * 2);
      g.fill();
    });
    return c;
  }

  function fileName() {
    var parts = GROUPS.filter(function (g) { return active[g.key] !== 'all'; }).map(function (g) {
      var v = active[g.key];
      return g.key === 'r' ? (v === 'A' ? 'all-time' : 'recommended') : v;
    });
    var tag = parts.join('-').toLowerCase().replace(/≤\s*/g, 'to-').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return 'bookshelf-spots' + (tag ? '-' + tag : '') + '.png';
  }

  // Inside a claude.ai artifact a page may not download for itself; the
  // viewer offers the file instead, after a confirmation. Anywhere else there
  // is no window.claude and the save goes the ordinary way.
  var viaViewer = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);

  document.getElementById('save').addEventListener('click', function () {
    if (!books.some(function (b) { return b.on; })) return;
    picture().toBlob(function (blob) {
      var name = fileName();
      viaViewer.then(function (downloads) {
        if (downloads) {
          downloads.save({ filename: name, data: blob }).catch(function () {});
          return;
        }
        ordinary(blob, name);
      });
    }, 'image/png');
  });

  function ordinary(blob, name) {
    var file = typeof File === 'function' ? new File([blob], name, { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Bookshelf' }).catch(function () {});
      return;
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  var pending = 0;
  addEventListener('resize', function () {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(layout);
  });

  // Hung, not assembled: the first layout is placed without transitions.
  canvas.classList.add('still');
  render();
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { canvas.classList.remove('still'); });
  });
})();
</script>
