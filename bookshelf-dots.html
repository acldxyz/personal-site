<style>
  /* After Damien Hirst's spot paintings: a grid of spots of one size on a
     white ground, the gap between them equal to a spot, and no colour used
     twice. Here every book is a spot, painted in its cover's own colour, so
     the canvas is the shelf seen from across the room. Nothing is written
     on it; a spot gives up its title only when you go up to it. */

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --margin: clamp(22px, 2.8vw, 40px);

    --ink: #6f665d;
    --ink-strong: #2f2a24;
    --ink-quiet: #8a8076;
    --focus: #3d7ba8;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 90% 70% at 50% 44%, #faf8f3 0%, #f2eee5 55%, #e8e3d8 100%)
      fixed;
    color: var(--ink);
    font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- topbar */

  /* The same bar as bookshelf.html, so the draft can be swapped in without
     the rest of the site noticing, less the rule beneath it: here the bar
     steps back and leaves the painting the only edge on the page. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: clamp(14px, 1.6vw, 20px) var(--margin);
  }

  .wordmark {
    display: inline-block;
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Impact, system-ui, sans-serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: -.01em;
    line-height: 1.15;
    color: var(--ink-strong);
    text-decoration: none;
    opacity: .82;
    transition: opacity .2s ease;
  }
  .wordmark:hover { opacity: 1; }
  .wordmark:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .site-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 1px;
    font-size: 11px;
    margin-right: -.9em;
  }

  .site-nav a, .opt {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink);
    text-decoration: none;
    background: none;
    padding: .52em .9em;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: color .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .site-nav a:hover, .opt:hover {
    color: var(--ink-strong);
    background: rgba(0,0,0,.05);
    border-color: rgba(0,0,0,.14);
  }
  .site-nav a:focus-visible, .opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ------------------------------------------------------------ gallery */

  /* The painting is the page. It hangs in a pool of light in whatever the
     window leaves below the bar, and everything else steps back: the only
     other thing near it is its wall label, which is also where the filters
     are folded away. */
  .gallery {
    position: relative;
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(18px, 2.6vw, 40px) var(--margin);
  }
  /* Gallery lighting: a soft pool on the wall, centred on the painting
     rather than on the window. */
  .gallery::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 52% 58% at 50% 46%,
      rgba(255,254,250,.85) 0%, rgba(255,254,250,.35) 45%, rgba(255,254,250,0) 75%);
  }

  .work {
    --d: 24px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  /* --d is the spot's diameter and the one number the painting is built
     from: Hirst's spacing is a spot's width, and so is the margin to the
     canvas edge. layout() sets it and the canvas's size on the figure,
     every spot's
     place, and all of them transition, so when a filter changes the grid
     the canvas resizes and the spots travel to their new places together
     instead of the painting being torn down and rehung. */
  .canvas {
    position: relative;
    width: var(--cw, 0px);
    height: var(--ch, 0px);
    /* A book leaving fades where it stood, but takes the new spot size like
       the rest, so on a shrinking canvas it can stand past the edge. Clipped,
       as paint would be. A spot's hover growth stays well inside the margin. */
    overflow: hidden;
    /* Primed canvas: whiter than the page, so it reads as a painting hung on
       it rather than a panel of the page. */
    background: #fcfbf8;
    box-shadow:
      0 0 0 1px rgba(60,48,32,.06),
      0 2px 3px rgba(40,30,20,.06),
      0 22px 48px -20px rgba(40,30,20,.36);
    transition: width .45s ease-out, height .45s ease-out;
  }

  /* Flat household gloss, as Hirst's assistants lay it: one even coat, no
     edge and no shading. The palest spots hold their circle on the white
     ground by colour alone, because the canvas is kept 10 clear of every
     spot along with the spots themselves — see SPOT below. */
  .spot {
    position: absolute;
    left: var(--x, 0px);
    top: var(--y, 0px);
    width: var(--d);
    height: var(--d);
    border-radius: 50%;
    background: var(--k);
    transition:
      left .45s ease-out, top .45s ease-out, width .45s ease-out, height .45s ease-out,
      transform .2s ease-out, opacity .3s ease;
  }
  .canvas.still, .canvas.still .spot { transition: none; }
  .spot:hover, .spot:focus-visible { transform: scale(1.22); }
  .spot:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* A filtered-out book leaves the painting: it fades where it stood while
     the rest regroup without it. It stops answering the pointer at once
     rather than after the fade, so nothing on the canvas responds that is
     not in the picture. */
  .spot.off {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: none;
    transition:
      left .45s ease-out, top .45s ease-out, width .45s ease-out, height .45s ease-out,
      opacity .3s ease, visibility 0s linear .3s;
  }

  .empty {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
  }

  /* --------------------------------------------------------------- label */

  /* The wall label, as a gallery hangs one: small, below the painting's
     left edge and no wider than the painting. It says what the work is and
     how many spots, and the filters fold away inside it, so they are there
     when wanted and otherwise one quiet word. */
  .label {
    width: max(var(--cw, 0px), min(340px, 100%));
    max-width: 100%;
    padding-top: 16px;
  }

  .label-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px 18px;
  }

  .label h1, .caption p, .rec, .empty, .group legend {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  /* The caption names the painting at rest and, while a spot is pointed
     at, the book it is. Both are kept in one cell, cross-fading, and the
     cell holds the taller one's height, so the label never jumps. */
  .caption {
    display: grid;
    min-width: 0;
    min-height: 52px;
  }
  .about, .book {
    grid-area: 1 / 1;
    min-width: 0;
    transition: opacity .2s ease;
  }
  .caption.pointing .about, .book { opacity: 0; }
  .caption.pointing .book { opacity: 1; }

  .label h1 { color: var(--ink-strong); line-height: 1.7; }
  .label h1 .which { color: var(--ink); }
  .caption p { color: var(--ink-quiet); line-height: 1.7; font-variant-numeric: tabular-nums; }

  .book { display: flex; align-items: flex-start; gap: 12px; }
  .book img, .book .swatch {
    flex: none;
    height: 52px;
    width: auto;
    border-radius: 1px 2px 2px 1px;
    box-shadow: 2px 3px 6px -3px rgba(40,30,20,.4), inset 0 0 0 1px rgba(60,48,32,.14);
  }
  .book .swatch { width: calc(52px * var(--s)); background: var(--k); }
  .book p { min-width: 0; }
  .book b {
    display: block;
    font-weight: 600;
    color: var(--ink-strong);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 1px;
    flex: none;
    margin: -.45em -.9em 0 0;
  }

  .rec {
    padding: .52em .9em;
    color: var(--ink-quiet);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: transparent;
    transition: color .2s ease, text-decoration-color .2s ease;
  }
  .rec:hover { color: var(--ink-strong); text-decoration-color: currentColor; }
  .rec:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .opt[aria-pressed="true"], .opt[aria-expanded="true"] {
    color: var(--ink-strong);
    background: rgba(0,0,0,.07);
    border-color: rgba(0,0,0,.16);
  }
  /* The count of active filters rides on the toggle, so a folded label
     still says the painting is showing less than the whole shelf. */
  .toggle .n { color: var(--ink-strong); }

  /* Shown only while a filter is on. */
  .clear { transition: color .2s ease, background-color .2s ease, border-color .2s ease, opacity .3s ease; }
  .clear[disabled] { opacity: 0; pointer-events: none; }

  /* The filters unfold beneath the caption. The row animates from nothing
     to its own height, and while folded it is inert, so its buttons are out
     of the tab order and unread. */
  /* Pulled out by a pill's inset, so the buttons' text lines up with the
     caption's while their hover pills have room inside the clip. */
  .drawer {
    margin-left: -.9em;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .45s ease-out;
  }
  .drawer.open { grid-template-rows: 1fr; }
  .drawer > div {
    overflow: hidden;
    min-height: 0;
  }
  .filters {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 0 2px;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .drawer.open .filters { opacity: 1; transition-delay: .12s; }

  /* min-width: 0 because a fieldset is otherwise at least as wide as its
     contents, and would push the page sideways on a phone rather than let
     its buttons wrap. */
  .group { display: flex; align-items: baseline; border: 0; min-width: 0; }
  .group legend {
    float: left;
    flex: none;
    width: 12.5em;
    padding-left: .9em;
    font-size: 10px;
    color: #a49a8e;
  }
  /* The options wrap within their own column, so a second line starts under
     the first option rather than under the group's name. */
  .group .opts { display: flex; flex-wrap: wrap; gap: 1px; min-width: 0; }

  @media (max-width: 860px) {
    :root { --margin: 20px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px 20px 16px; }
    .site-nav { justify-content: flex-start; margin: 0 0 0 -.9em; }
  }
  @media (max-width: 560px) {
    .label-row { flex-direction: column; }
    .actions { margin: 0 0 0 -.9em; }
    .group { flex-direction: column; }
    .group legend { width: 100%; margin: 6px 0 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01s !important;
      transition-duration: .01s !important;
      transition-delay: 0s !important;
    }
  }
</style>
</head>

      </div>
      <div class="drawer" id="drawer">
        <div><div class="filters" id="filters" inert></div></div>
      </div>
    </figcaption>
  </figure>
</main>

  { t: "Sol Lewitt 100 Views", a: "Sol LeWitt", y: "≤ 2021", r: "A", g: "Non-Fiction", c: "Black", k: "#484848", s: 0.871, p: 271, u: "https://books.google.com/books/content?id=PIo0AQAAIAAJ&printsec=frontcover&img=1&zoom=1&source=gbs_api" },
];
</script>

<script>
(function () {
  'use strict';

  var GROUPS = [
    { key: 'g', name: 'Genre', values: ['Sci-Fi', 'Non-Fiction', 'Novel', 'Fantasy', 'Play'] },
    { key: 'y', name: 'Year', values: ['2026', '2025', '2024', '2023', '2022', '≤ 2021'] },
    { key: 'r', name: 'Recommended', values: ['A', 'Y'], labels: { A: 'All-Time', Y: 'Yes' } }
  ];

  // 'S' and 'X' were two passes at the same verdict; both mean yes.
  books.forEach(function (b) { b.r = b.r === 'A' ? 'A' : (b.r ? 'Y' : ''); });

  var active = { g: 'all', y: 'all', r: 'all' };
  var buttons = [];
  var canvas = document.getElementById('canvas');
  var work = canvas.parentNode;
  var gallery = document.getElementById('gallery');
  var caption = document.getElementById('caption');
  var book = document.getElementById('book');

  // 'Yes' is a floor, not a tier: the all-time books were recommended too.
  function matches(b) {
    return (active.g === 'all' || b.g === active.g) &&
           (active.y === 'all' || b.y === active.y) &&
           (active.r === 'all' || (active.r === 'Y' ? b.r !== '' : b.r === active.r));
  }

  /* ---- colour ----
     Hirst's one rule for the spots is that no colour repeats, and it has to
     hold to the eye, not just in the code: the covers are thick with near
     blacks and near whites that differ by a digit. So every pair of spots
     here is at least 10 apart in CIELAB (ΔE76), plainly different at a
     glance, and every spot is still a colour taken from its own cover. The
     canvas counts as a colour already used: the spots carry no edge, so a
     white cover's spot would otherwise be a hole in the grid.

     A book keeps its cover's main colour where that is already distinct,
     newest first. The rest, listed below, were found by reducing each cover
     to its palette and taking the most prominent colour on it that stands
     clear of every other spot, the hardest covers to place choosing first.
     10 is as far apart as this shelf allows; at 12 some all-black covers
     have nothing left to give. A new book needs the same check: if its main
     colour comes within 10 of a spot here, it takes another from its cover. */

  var SPOT = {
    "The Metamorphosis of Prime Intellect": "#d1d1d1",
    "The Creative Act: A Way of Being": "#b2b9ae",
    "Trail Wise, Path Ways": "#828484",
    "A Little Life": "#606060",
    "Exhalation": "#5d727a",
    "Ender's Game": "#3a5763",
    "Who: The A Method for Hiring": "#357ec1",
    "Beginner's Mind": "#b7a36f",
    "Psychology of Money": "#ecd79a",
    "The Paper Menagerie and Other Stories": "#9a5736",
    "A Short Stay in Hell": "#534d3e",
    "Blood Music": "#775b58",
    "Counter-Intelligence": "#e6795f",
    "How to Make a Few Billion Dollars": "#ed2127",
    "The Road": "#303b45",
    "Blood, Sweat, and Pixels": "#f6cb16",
    "There Is No Antimemetics Division": "#3c2514",
    "Permutation City": "#948d51",
    "Never Let Me Go": "#9d8f85",
    "The Ocean at the End of the Lane": "#04072b",
    "Contact": "#ccf6e9",
    "Dungeon Crawler Carl": "#e41b59",
    "Murderbot: Exit Strategy": "#124435",
    "Murderbot: Artificial Condition": "#6d4c32",
    "The Hobbit": "#94822f",
    "The Three Body Problem": "#1b3b7d",
    "Ringworld": "#9edfd8",
    "Weed the People": "#e2d2b7",
    "Boys in the Boat": "#9a7b4e",
    "The Sounds of Life": "#bf8c51",
    "The Hard Thing About Hard Things": "#f47024",
    "The Tao of Fundraising": "#cfb7a5",
    "Roadside Picnic": "#7b9683",
    "Concrete Island": "#2759a2",
    "Gate of the Feral Gods": "#f5fd04",
    "Food Rules: An Eater's Manual": "#172911",
    "The Ministry of Time": "#6b7635",
    "Into Thin Air": "#5b6a84",
    "The Fall of Hyperion": "#d0a476",
    "Orbital": "#c57a71",
    "Semiosis": "#4e1d11",
    "Solaris": "#d5895c",
    "I, Robot": "#3c2d2d",
    "Jurassic Park": "#ea3d54",
    "Golden Son": "#4f3c24",
    "Chapterhouse Dune": "#344f46",
    "Hyperion": "#0c2a26",
    "The Return of the King": "#0c6b0c",
    "The Fellowship of the Ring": "#fbcb4d",
    "A River Runs Through It": "#ccba95",
    "Murderbot: All Systems Red": "#f35a05",
    "The Man Who Solved the Market": "#5b5516",
    "Hidden Life of Trees": "#eff9e3",
    "Billion Dollar Whale": "#d5eaf7",
    "The Kill Chain": "#546249",
    "Heretics of Dune": "#2f6567",
    "Troy": "#edd648",
    "Speaker for the Dead": "#2d2851",
    "Rocket Men": "#abc9cb",
    "Ghost Wars": "#421016",
    "Damascus Station": "#beba1f",
    "Ardennes 1944": "#f73517",
    "Snow Crash": "#782836",
    "Kitchen Confidential": "#c19a91",
    "Merchants of Debt": "#2b1006",
    "Stories of Your Life and Others": "#bc866b",
    "My Life at the Limit": "#b86624",
    "Super Pumped": "#6a1118",
    "The Martian": "#c2492b",
    "Dune": "#aa4539",
    "Foundation": "#0c1909",
    "Freedom": "#2c342d"
  };
  books.forEach(function (b) { b.paint = SPOT[b.t] || b.k.toLowerCase(); });

  /* ---- filters ---- */

  var filters = document.getElementById('filters');
  var drawer = document.getElementById('drawer');
  var toggle = document.getElementById('toggle');
  var clear = document.getElementById('clear');

  GROUPS.forEach(function (grp) {
    var fs = document.createElement('fieldset');
    fs.className = 'group';
    var lg = document.createElement('legend');
    lg.textContent = grp.name;
    fs.appendChild(lg);
    var opts = document.createElement('div');
    opts.className = 'opts';
    fs.appendChild(opts);
    ['all'].concat(grp.values).forEach(function (v) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.textContent = v === 'all' ? 'All' : (grp.labels ? grp.labels[v] : v);
      btn.dataset.group = grp.key;
      btn.dataset.value = v;
      btn.addEventListener('click', function () {
        active[grp.key] = active[grp.key] === v ? 'all' : v;
        render();
      });
      opts.appendChild(btn);
      buttons.push(btn);
    });
    filters.appendChild(fs);
  });

  function setDrawer(open) {
    drawer.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open);
    filters.inert = !open;
    layout();
  }
  toggle.addEventListener('click', function () {
    setDrawer(toggle.getAttribute('aria-expanded') !== 'true');
  });
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
      setDrawer(false);
      toggle.focus();
    }
  });
  clear.addEventListener('click', function () {
    active = { g: 'all', y: 'all', r: 'all' };
    render();
    toggle.focus();     // the button just pressed is about to disappear
  });

  /* ---- caption ---- */

  function show(b) {
    book.textContent = '';
    // The cover is only fetched when a spot is first pointed at: the canvas
    // itself shows none of them. Where it fails, the spot's colour in the
    // cover's shape stands in.
    var swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.setProperty('--k', b.paint);
    swatch.style.setProperty('--s', b.s);
    var art = swatch;
    if (!b.noCover) {
      art = document.createElement('img');
      art.alt = '';
      art.src = b.u;
      art.addEventListener('error', function () { b.noCover = true; if (art.parentNode) art.replaceWith(swatch); });
      art.addEventListener('load', function () { if (art.naturalWidth < 8) art.dispatchEvent(new Event('error')); });
    }
    var p = document.createElement('p');
    var t = document.createElement('b');
    t.textContent = b.t;
    p.appendChild(t);
    p.appendChild(document.createTextNode(b.a + ' · ' + b.y));
    book.appendChild(art);
    book.appendChild(p);
    caption.classList.add('pointing');
  }
  function rest() { caption.classList.remove('pointing'); }

  /* ---- spots ---- */

  books.forEach(function (b) {
    var a = document.createElement('a');
    a.className = 'spot';
    a.setAttribute('role', 'listitem');
    a.href = 'https://www.amazon.com/s?k=' + encodeURIComponent(b.t + ' ' + b.a) + '&i=stripbooks';
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', b.t + ' by ' + b.a);
    a.style.setProperty('--k', b.paint);
    a.addEventListener('pointerenter', function () { show(b); });
    a.addEventListener('focus', function () { show(b); });
    a.addEventListener('pointerleave', rest);
    a.addEventListener('blur', rest);
    b.el = a;
    canvas.appendChild(a);
  });

  /* ---- layout ----
     The painting is whatever grid of the spots on show fills the space best,
     worked out again every time the filters change. A canvas c spots wide is
     (2c + 1) diameters across, a spot and a gap per column and one more gap
     for the far margin; so for every column count the spot is as large as
     both the width and the height allow, and the count that gives the
     largest spot wins. Fewer books make a smaller grid of larger spots, a
     single book one spot as large as the space allows. Where the last row
     comes up short it is centred, as a hang would be, rather than leaving
     blank places: the canvas only ever holds the books that are on it. */

  var MIN_D = 12, MAX_D = 150;

  // The label's own row, plus the filters' full height while they are open:
  // the painting gives up room to them rather than being covered. The label
  // takes the canvas's new width at once (only the canvas animates), so this
  // reads the height it will settle at.
  function labelHeight() {
    var label = document.getElementById('label');
    return label.querySelector('.label-row').offsetHeight + parseFloat(getComputedStyle(label).paddingTop) +
           (drawer.classList.contains('open') ? filters.scrollHeight : 0);
  }

  function layout(again) {
    var shown = books.filter(function (b) { return b.on; });
    var n = shown.length;
    var cs = getComputedStyle(gallery);
    var W = gallery.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var top = gallery.getBoundingClientRect().top + scrollY;
    var lab = labelHeight();
    var H = innerHeight - top - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - lab;
    // On a phone the bar takes much of the screen, and fitting what is left
    // would leave spots too small to tap. There the painting may run on below
    // the fold, as tall as most of a screen.
    if (W < 560) H = Math.max(H, innerHeight * 0.72);

    document.getElementById('empty').hidden = n > 0;
    if (!n) return;            // an empty canvas keeps the size it had

    var best = { d: 0 };
    for (var c = 1; c <= n; c++) {
      var r = Math.ceil(n / c);
      var d = Math.min(W / (2 * c + 1), H / (2 * r + 1));
      // A near tie goes to the grid whose last row is fuller.
      if (d > best.d + 0.25 || (d > best.d - 0.25 && c * r - n < best.spare)) {
        best = { c: c, r: r, d: d, spare: c * r - n };
      }
    }
    if (best.d < MIN_D) {
      var cols = Math.max(1, Math.floor((W / MIN_D - 1) / 2));
      best = { c: cols, r: Math.ceil(n / cols), d: MIN_D };
    }
    c = best.c; r = best.r;
    var D = Math.floor(Math.min(MAX_D, best.d) * 4) / 4;

    // Set on the figure, not the canvas, so the label beneath reads the
    // canvas's width too and stays exactly as wide as the painting.
    work.style.setProperty('--d', D + 'px');
    work.style.setProperty('--cw', (2 * c + 1) * D + 'px');
    work.style.setProperty('--ch', (2 * r + 1) * D + 'px');
    var lastRow = n - (r - 1) * c;
    shown.forEach(function (b, i) {
      var row = Math.floor(i / c), col = i % c;
      var shift = row === r - 1 ? (c - lastRow) * D : 0;
      b.el.style.setProperty('--x', D + col * 2 * D + shift + 'px');
      b.el.style.setProperty('--y', D + row * 2 * D + 'px');
    });

    // The label is as wide as the canvas, so a new canvas width can rewrap
    // the caption and change the height the painting was fitted around.
    // Measured again once, at the label's new width — never more, or a
    // borderline case could see-saw.
    if (!again && labelHeight() !== lab) layout(true);
  }

  function render() {
    buttons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', active[btn.dataset.group] === btn.dataset.value);
    });
    var shown = 0;
    books.forEach(function (b) {
      b.on = matches(b);
      b.el.classList.toggle('off', !b.on);
      // Out of the painting, so out of reach too: off the tab order and unread.
      if (b.on) { b.el.removeAttribute('tabindex'); b.el.removeAttribute('aria-hidden'); shown++; }
      else { b.el.tabIndex = -1; b.el.setAttribute('aria-hidden', 'true'); }
    });
    rest();

    // The label reads as a gallery label would for this selection.
    var names = GROUPS.filter(function (g) { return active[g.key] !== 'all'; }).map(function (g) {
      var v = active[g.key];
      return g.key === 'r' ? (v === 'A' ? 'All-time' : 'Recommended') : v;
    });
    document.getElementById('which').textContent = names.length ? ' — ' + names.join(' · ') : '';
    document.getElementById('count').textContent = 'Household gloss on canvas · ' +
      (shown === books.length ? books.length + ' spots' : shown + ' of ' + books.length + ' spots');
    document.getElementById('n').textContent = names.length ? ' · ' + names.length : '';
    clear.disabled = !names.length;

    layout();
  }

  var pending = 0;
  addEventListener('resize', function () {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(layout);
  });

  // Hung, not assembled: the first layout is placed without transitions.
  canvas.classList.add('still');
  render();
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { canvas.classList.remove('still'); });
  });
})();
</script>
</body>
</html>
