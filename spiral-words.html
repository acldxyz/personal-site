<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern / Novelty</title>
<link rel="icon" type="image/svg+xml" href="favicon-block.svg">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 44%, #faf8f3 0%, #f2eee5 55%, #e8e3d8 100%);
    -webkit-font-smoothing: antialiased;
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .label, nav a {
    font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  /* Positioned from the script every frame. Real text rather than canvas
     text, so the tracking is the same .16em as everywhere else and the words
     are there for a screen reader. The trailing letter-spacing would push the
     visual centre right, hence the matching negative margin. */
  .label {
    position: fixed;
    left: 0;
    top: 0;
    margin-right: -.16em;
    white-space: nowrap;
    color: #6f665d;
    pointer-events: none;
    will-change: transform;
  }
  .label.pattern { color: #2f2a24; }

  nav {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
  }
  nav a {
    color: #6f665d;
    text-decoration: none;
    padding: .78em 1.2em;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: color .2s ease, background-color .2s ease, border-color .2s ease;
  }
  nav a:hover { color: #2f2a24; background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.14); }
  nav a:focus-visible { outline: 2px solid #3d7ba8; outline-offset: 2px; }
  nav a[aria-current="page"] { color: #2f2a24; }

  @media (prefers-reduced-motion: reduce) {
    nav a { transition-duration: .01s; }
  }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<span class="label pattern" id="pattern">Pattern</span>
<span class="label novelty" id="novelty">Novelty</span>
<nav aria-label="Versions">
  <a href="spiral-words.html" aria-current="page">Words</a>
  <a href="spiral-images.html">Images</a>
</nav>

<script>
(() => {
  const cvs = document.querySelector('canvas');
  const ctx = cvs.getContext('2d');
  const lblP = document.getElementById('pattern');
  const lblN = document.getElementById('novelty');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  const INK = [111, 102, 93];        // #6f665d
  const INK_DARK = [47, 42, 36];     // #2f2a24
  const TURNS = 3.3;
  const ROT = -0.05;                 // rad/s — slow enough that NOVELTY stays readable as it orbits

  let W, H, dpr, cx, cy, R, k, path, nHalf;

  const hash = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const smooth = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };

  // Archimedean spiral resampled to even arc length, so "distance along the
  // spiral" is the one coordinate everything else is written in. Even steps
  // are what let the pattern end tick at a perfectly regular rhythm.
  function makePath(r0, r1, turns) {
    const N = 6000, TH = turns * Math.PI * 2;
    const rx = new Float64Array(N + 1), ry = new Float64Array(N + 1), rs = new Float64Array(N + 1);
    rx[0] = r0;
    for (let i = 1; i <= N; i++) {
      const u = i / N, th = u * TH, r = r0 + (r1 - r0) * u;
      rx[i] = r * Math.cos(th); ry[i] = r * Math.sin(th);
      rs[i] = rs[i - 1] + Math.hypot(rx[i] - rx[i - 1], ry[i] - ry[i - 1]);
    }
    const L = rs[N], n = Math.floor(L) + 1;
    const X = new Float32Array(n), Y = new Float32Array(n), TX = new Float32Array(n), TY = new Float32Array(n);
    for (let i = 0, j = 0; i < n; i++) {
      while (j < N - 1 && rs[j + 1] < i) j++;
      const f = (i - rs[j]) / ((rs[j + 1] - rs[j]) || 1);
      X[i] = rx[j] + (rx[j + 1] - rx[j]) * f;
      Y[i] = ry[j] + (ry[j + 1] - ry[j]) * f;
    }
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1);
      const dx = X[b] - X[a], dy = Y[b] - Y[a], d = Math.hypot(dx, dy) || 1;
      TX[i] = dx / d; TY[i] = dy / d;
    }
    return { X, Y, TX, TY, L, n };
  }

  const P = { x: 0, y: 0, tx: 0, ty: 0 };
  function at(s) {
    const f = clamp(s, 0, path.n - 1), i = Math.min(path.n - 2, f | 0), a = f - i;
    P.x = path.X[i] + (path.X[i + 1] - path.X[i]) * a;
    P.y = path.Y[i] + (path.Y[i + 1] - path.Y[i]) * a;
    P.tx = path.TX[i]; P.ty = path.TY[i];
    return P;
  }

  function build() {
    W = innerWidth; H = innerHeight; dpr = Math.min(2, devicePixelRatio || 1);
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    cx = W / 2; cy = (H - 40) / 2;
    R = Math.max(120, Math.min(W / 2 - 16, (H - 110) / 2));
    k = clamp(R / 320, 0.6, 1.4);
    nHalf = { w: lblN.offsetWidth / 2, h: lblN.offsetHeight / 2 };
    // Inner radius clears the PATTERN label; outer leaves room for NOVELTY
    // to sit off the tip without leaving the screen as the spiral turns.
    const r0 = Math.max(R * 0.17, lblP.offsetWidth / 2 + 14);
    const r1 = R - nHalf.w - 18;
    path = makePath(r0, Math.max(r0 + 40, r1), TURNS);
    lblP.style.transform = `translate(${cx - lblP.offsetWidth / 2}px, ${cy - lblP.offsetHeight / 2}px)`;
  }

  function frame(t) {
    const L = path.L;
    const phi = t * ROT, c = Math.cos(phi), s = Math.sin(phi);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.translate(cx, cy);
    ctx.rotate(phi);
    ctx.lineCap = 'round';

    // Dashes are born at the centre and carried outward. Each keeps its index
    // for life, so the irregularity it picks up on the way out is its own and
    // doesn't flicker from frame to frame — it just grows as the dash travels.
    const period = 12 * k, v = 20 * k, A = 9 * k;
    const shift = t * v;
    for (let i = Math.floor(-shift / period) - 2; ; i++) {
      let s0 = i * period + shift;
      if (s0 > L) break;
      const u = clamp(s0 / L, 0, 1);
      const q = smooth(0.14, 0.96, u);           // 0 = pattern, 1 = novelty
      const r1 = hash(i * 1.13), r2 = hash(i * 7.31 + 1), r3 = hash(i * 3.7 + 2);
      s0 += q * period * 0.9 * (r2 - 0.5);
      const len = period * 0.5 * (1 - q) + q * period * (0.1 + 1.25 * r1);
      let s1 = s0 + len;
      if (s1 < 0) continue;
      s0 = Math.max(0, s0); s1 = Math.min(L, s1);
      if (s1 <= s0) continue;

      const alpha = smooth(0, 30 * k, s0) * (1 - smooth(L - 50 * k, L, s1));
      if (alpha <= 0) continue;
      const mid = (s0 + s1) / 2;
      const tilt = q * q * (r3 - 0.5) * 1.6;       // dashes turn off the line, scattering
      const q2 = q * q;
      const col = INK_DARK.map((d, j) => Math.round(d + (INK[j] - d) * q));

      ctx.beginPath();
      for (let sx = s0, first = true; ; sx += 1.5) {
        const ss = Math.min(sx, s1);
        const p = at(ss);
        const wob = q2 * A * (Math.sin(0.09 * ss + 1.7 * t + r3 * 40) * 0.65 +
                               Math.sin(0.031 * ss - 1.1 * t + r1 * 20) * 0.35)
                  + (ss - mid) * tilt;
        const x = p.x - p.ty * wob, y = p.y + p.tx * wob;
        first ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        first = false;
        if (ss >= s1) break;
      }
      ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
      ctx.lineWidth = (1.7 * (1 - q) + q * (0.8 + 2.2 * r3)) * Math.min(1.2, k + 0.2);
      ctx.stroke();
    }

    // NOVELTY rides off the outer tip, upright, pushed out along the tangent
    // far enough that its box clears the end of the line at any angle.
    const tip = at(L);
    const tx = tip.tx * c - tip.ty * s, ty = tip.tx * s + tip.ty * c;
    const px = tip.x * c - tip.y * s, py = tip.x * s + tip.y * c;
    const off = nHalf.w * Math.abs(tx) + nHalf.h * Math.abs(ty) + 10;
    lblN.style.transform =
      `translate(${cx + px + tx * off - nHalf.w}px, ${cy + py + ty * off - nHalf.h}px)`;
  }

  let t0 = null, raf = 0;
  function loop(now) {
    if (t0 === null) t0 = now;
    frame((now - t0) / 1000);
    raf = requestAnimationFrame(loop);
  }
  function start() {
    cancelAnimationFrame(raf);
    build();
    // Reduced motion gets one still frame, taken far enough in that the
    // dashes have already reached the tip and the drift is visible.
    if (reduce.matches) frame(30);
    else raf = requestAnimationFrame(loop);
  }

  addEventListener('resize', start);
  reduce.addEventListener('change', start);
  start();
})();
</script>
</body>
</html>
