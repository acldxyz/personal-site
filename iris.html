<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    /* What shows before the first frame, and for good where WebGL2 is missing:
       the same view in a few flat stops. The gradient is centred where the
       script centres the iris, in the top right corner, and like the script
       puts the window's far corner 0.955 of the way out to the rim, so the
       stops are radii of the eye divided by 0.955. If one changes, change
       the other. */
    background:
      radial-gradient(circle farthest-corner at 100% 0%,
        #0a0705 0%, #0c0806 38.8%, #1a110b 40.4%, #6b5230 41.8%, #8a6e42 45%, #967d4f 50%,

    background-color: #918869;
    overflow: hidden;

  #iris {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    /* Hidden until the eye is fully painted, then revealed whole. */
    opacity: 0;
    transition: opacity .62s ease-out;
  }

  #iris.ready { opacity: 1; }

  /* The pill control from index.html with its ink inverted. The menu sits in
     the pupil: the one dark, quiet part of the picture, and the only place
     text stays legible. */
  nav {
    position: fixed;
    top: 14px;
    right: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: .2em;

    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;

    text-decoration: none;
    padding: .78em 1.2em;

    text-shadow: 0 1px 4px rgba(0, 0, 0, .55);

  nav a:hover {
    color: #fff;
    background: rgba(250, 248, 243, .10);
    border-color: rgba(250, 248, 243, .30);

<!--
  How the eye is made.

  An iris photographs the way it does because it is a physical thing: fine,
  pale, slightly translucent fibres lying over one another at different
  depths above a dark back surface, with pigment dusted on the front. Noise
  that merely looks stringy does not survive a second glance, least of all
  this close, so every fibre here is geometry.

  It is one particular eye. The size of the pupil, the colour at each
  distance from it, where the pale ring peaks, how many lobes that ring
  breaks into, where the ochre sits and the pair of freckles were all
  measured from a photograph of the real iris, and only of the iris: nothing
  of the lids, the white, or the reflections on the cornea. The fibres are
  grown to fit those measurements; the photograph is not sharp enough to say
  where each one runs. ?seed= regrows them and leaves the measured things
  alone.

  The page looks into one part of that eye, a little under a quarter of it,
  with the pupil at the upper right where the menu sits. ?view=whole steps
  back to the entire eye.

  1. Paths. Strands are sown evenly and radially and then displaced: drawn
     together into sheaves at the collarette, gathered into clumps that merge
     and split on the way out, parted around the crypts. Nothing is placed by
     hand; the mess is what the displacement leaves.
  2. Fibres. Fine fibres are laid along each path. A thick cord is a bundle
     of them that weave among one another, fray and fork; no fibre is wider
     than a few pixels, and every free end thins and sinks away.
  3. Drawing. The front surface of the whole mat is drawn first, as heights,
     into an offscreen map; every fibre takes its shade from that. The deep
     felt is painted small and soft as a backdrop. Everything else is painted
     over it from the back forward, each fibre a ribbon with a soft edge. How
     soft depends on its depth, which is the lens going out of focus as you
     look down into the tissue.
  4. A last pass adds what is optics and not anatomy: the dish of the iris
     toward the pupil, the furrows, the rim, the white of the eye, grain.
-->

<script id="glsl-common" type="x-shader/x-glsl">
precision highp float;
precision highp sampler2D;

const float TAU = 6.28318530718;
// The site's light, (-0.40, -0.55, 0.73) in CSS axes, with y turned up for GL.
const vec3 LIGHT = vec3(-0.4003, 0.5505, 0.7306);

uniform float uSeed;
uniform vec4  uView;       // eye units to clip space: scale in xy, offset in zw
uniform sampler2D uRing;   // by angle: r pupil radius, g collarette radius, b limbus wobble

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i),               hash(i + vec3(1,0,0)), f.x),
                 mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                 mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}

// Angle wrapped onto a circle, so angular noise has no seam at the atan2 cut.
vec3 cyl(float th, float F, float z) { return vec3(cos(th) * F, sin(th) * F, z) + uSeed; }

vec4 ringAt(float th) { return textureLod(uRing, vec2(th / TAU, 0.5), 0.0); }
</script>

<script id="vs-strand" type="x-shader/x-vertex">
layout(location = 0) in vec2  aPos;    // a point on the fibre's centre line, eye units
layout(location = 1) in vec2  aSide;   // unit vector across the fibre there
layout(location = 2) in float aU;      // -1 on one edge, +1 on the other
layout(location = 3) in float aKind;   // 0 a loose fibre, 1 pupillary ruff, 2 a fibril of a cord
layout(location = 4) in float aHw;     // half-width, as a fraction of HW_MAX
layout(location = 5) in float aZ;      // height of the axis: 0 the back of the iris, 1 its front
layout(location = 6) in vec3  aD;      // pigment, tint, fade
layout(location = 7) in float aAcross; // where a fibril lies across its cord: -1 one flank, +1 the other

uniform float uAA;      // half the width of an antialiased edge, eye units; 0 in the height pass
uniform float uBlur;    // defocus: softness gained per (unit of height below focus) squared
uniform float uMinHw;   // the narrowest fibre the height map can register; 0 when painting

out float vX;           // signed distance from the axis, eye units
out float vHw;
out float vSoft;
out float vZ;
out vec3  vD;
out float vKind;
out float vAc;
out vec2  vP;
out vec3  vTone;

const float HW_MAX = 0.02;
// Heights above this are in focus. Below it the softness grows with the
// square of the depth: nothing just under the front fibres, a clear blur by
// the time you reach the felt at the back.
const float FOCUS = 0.62;

void main() {
  float hw    = max(aHw * HW_MAX, uMinHw);
  float below = max(FOCUS - aZ, 0.0);
  float soft  = max(uAA, uBlur * below * below);
  // The ribbon is drawn wide enough to hold its soft edge.
  float ext   = hw + soft;
  vec2  p     = aPos + aSide * (ext * aU);

  vX = aU * ext;  vHw = hw;  vSoft = soft;  vZ = aZ;  vD = aD;  vKind = aKind;  vAc = aAcross;  vP = p;

  // The grey-green is not one colour. Whole patches run warm, toward khaki,
  // and others darker and greyer; and the whole cools and greys toward the
  // rim. It changes slowly, so once a vertex is enough.
  float r = length(aPos), th = atan(aPos.y, aPos.x);
  float patchy = 0.6 * noise(cyl(th, 2.4, r * 2.1 + 31.0)) + 0.4 * noise(cyl(th, 6.5, r * 4.0 + 37.0));
  vTone = mix(vec3(0.90, 0.91, 0.90), vec3(1.04, 1.02, 0.97), smoothstep(0.25, 0.75, patchy))
        * mix(vec3(1.0), vec3(0.96, 0.98, 1.01), smoothstep(0.60, 0.95, r));

  gl_Position = vec4(p * uView.xy + uView.zw, 0.0, 1.0);
}
</script>

<script id="fs-height" type="x-shader/x-fragment">
in float vX;
in float vHw;
in float vZ;
in vec3  vD;
out vec4 o;

// How far a fibre stands up from its axis, per unit of its half-width. The
// relief of an iris is about a fifteenth of its radius deep, and height runs
// 0 to 1 across that, so a round fibre is fifteen times its half-width tall.
const float RISE = 15.0;

void main() {
  // A fibre that is fading out at its end casts no shade.
  if (vD.z < 0.45) discard;
  // Each fibre is the top half of a cylinder lying on its side.
  float t = clamp(vX / max(vHw, 1e-7), -1.0, 1.0);
  float h = clamp(vZ + min(RISE * vHw, 0.09) * sqrt(1.0 - t * t), 0.0, 1.0);
  // Height is written as depth, so the map keeps the topmost fibre whatever
  // order they arrive in.
  gl_FragDepth = 1.0 - h;
  // Alpha is cover. Once the map is filtered both channels are averages over
  // covered and bare texels alike, so r is height times cover.
  o = vec4(h, 0.0, 0.0, 1.0);
}
</script>

<script id="fs-strand" type="x-shader/x-fragment">
in float vX;
in float vHw;
in float vSoft;
in float vZ;
in vec3  vD;
in float vKind;
in float vAc;
in vec2  vP;
in vec3  vTone;

uniform sampler2D uH;      // the front surface of the mat: r height times cover, a cover
uniform float uHTex;       // its texels to an eye unit
uniform sampler2D uNoise;  // four channels of tiling value noise
uniform float uAA;
uniform int   uPass;       // 0 everything, painted over; 1 only solid cores; 2 only what the cores leave
out vec4 o;

const float RISE = 15.0;
// A fibre covering at least this much of a pixel is solid there.
const float CORE = 0.90;

vec3 ramp(float x, vec3 a, vec3 b, vec3 c, vec3 d) {
  x = clamp(x, 0.0, 1.0) * 3.0;
  return x < 1.0 ? mix(a, b, x) : x < 2.0 ? mix(b, c, x - 1.0) : mix(c, d, x - 2.0);
}

void main() {
  // The direction across the fibre on screen, for its lighting.
  vec2 g = vec2(dFdx(vX), dFdy(vX));

  // Edge. A hard-edged bar blurred by `vSoft` ramps from full to nothing
  // across twice that distance, centred on its edge; a bar narrower than
  // the blur never reaches full, and is scaled so that it still deposits
  // the same total. That one rule is the antialiasing of a sharp fibre, the
  // defocus of a deep one, and the fade of one too fine to resolve.
  float cover = (1.0 - smoothstep(max(vHw - vSoft, 0.0), vHw + vSoft, abs(vX)))
              * min(1.0, 2.0 * vHw / (vHw + vSoft));
  float a = cover * vD.z;
  // Which fibre hides which is settled in two steps. Where a fibre is solid
  // it is drawn through a depth buffer, so the higher one wins at every
  // pixel whatever order they come in. Only soft edges and out-of-focus
  // fibres are painted over one another in order of height, which is
  // approximate; left to that alone, close-packed fibrils swapped places
  // along their length and showed as blunt ends.
  if (a < 0.004 || (uPass == 1 && a < CORE) || (uPass == 2 && a >= CORE)) discard;

  // Each fibre is the top half of a cylinder lying on its side.
  float t = clamp(vX / max(vHw, 1e-7), -1.0, 1.0), c = sqrt(1.0 - t * t);
  float h = vZ + min(RISE * vHw, 0.09) * c;
  g *= inversesqrt(max(dot(g, g), 1e-20));
  // Out of focus, the roundness averages away with the edge.
  float crisp = vHw / (vHw + 2.0 * max(vSoft - uAA, 0.0));
  // A fibril in a cord is lit partly as itself and partly as part of the
  // cord: by where it lies across the cord's back. Too little of the second
  // and a cord is a lock of hair; too much and it is a smooth tube with no
  // grain. A cord's back is also flatter than a cylinder's.
  float m   = vKind > 1.5 ? clamp(0.60 * vAc + 0.50 * t * crisp, -1.0, 1.0) : t * crisp;
  vec3  n   = normalize(vec3(g * m, sqrt(1.0 - m * m) + 0.30));
  float nl  = dot(n, LIGHT);
  float lit = 0.635 + 0.50 * nl;               // 1.0 where the surface faces the viewer
  // A faint sheen where a surface turns to the light: the tissue is wet.
  float sheen = pow(max(dot(n, normalize(LIGHT + vec3(0.0, 0.0, 1.0))), 0.0), 28.0) * crisp;

  // Shade from the rest of the mat. Fibres standing higher than this one
  // close by take light from it: all round it for the general gloom of lying
  // low, and on the lit side for the shadow they throw.
  vec2 uv = (vP * uView.xy + uView.zw) * 0.5 + 0.5;
  vec2 lu = normalize(LIGHT.xy) * uView.xy * 0.5;
  vec4 n1 = textureLod(uH, uv, log2(0.0040 * uHTex));
  vec4 n2 = textureLod(uH, uv, log2(0.0160 * uHTex));
  vec4 l1 = textureLod(uH, uv + lu * 0.0050, log2(0.0025 * uHTex));
  vec4 l2 = textureLod(uH, uv + lu * 0.0120, log2(0.0060 * uHTex));
  float ao = 1.0 - 0.20 * clamp((n1.r - h * n1.a) * 2.6, 0.0, 1.0)
                 - 0.13 * clamp((n2.r - h * n2.a) * 2.0, 0.0, 1.0);
  float sh = 1.0 - 0.16 * clamp((l1.r - (h + 0.04) * l1.a) * 3.5, 0.0, 1.0)
                 - 0.10 * clamp((l2.r - (h + 0.08) * l2.a) * 3.0, 0.0, 1.0);

  vec4 grain = textureLod(uNoise, vP * 1.30, 0.0);          // a texel is about 0.003 of the iris radius
  vec4 clump = textureLod(uNoise, vP * 0.21 + 0.37, 0.0);   // six times coarser
  float tint = vD.y;
  vec3 alb;

  if (vKind > 0.5 && vKind < 1.5) {
    // The ruff is the pigmented back of the iris turned out round the
    // margin: velvet, a brown that is nearly black, catching light only on
    // the flank it turns to it.
    alb = mix(vec3(0.060, 0.036, 0.024), vec3(0.135, 0.082, 0.052), grain.g) * (0.8 + 0.4 * tint);
    lit = 0.42 + 0.95 * max(nl, 0.0);
    sheen *= 0.5;
  } else {
    // Colour by depth. The stroma is pale collagen in front and coloured by
    // what lies behind it. Here that is a faint yellow all through over the
    // blue of the depths, which makes a grey-green: pale khaki in front,
    // sage in the middle, dark olive behind. The values are taken from the
    // photograph, lifted to a full exposure.
    vec3 stroma = ramp(h, vec3(0.250, 0.245, 0.200), vec3(0.500, 0.480, 0.390),
                          vec3(0.660, 0.625, 0.505), vec3(0.790, 0.745, 0.615)) * vTone;
    vec3 ochre  = ramp(h, vec3(0.250, 0.195, 0.120), vec3(0.490, 0.400, 0.255),
                          vec3(0.650, 0.545, 0.360), vec3(0.770, 0.680, 0.490));
    // Pigment runs from rust to ochre, patch by patch and fibre by fibre.
    ochre *= mix(vec3(0.98, 0.90, 0.80), vec3(1.03, 1.03, 0.99), clamp(clump.g + (tint - 0.5) * 0.6, 0.0, 1.0));
    // Melanin lies in grains and clumps, so its edge is granular and never
    // airbrushed.
    float P = smoothstep(0.26, 0.74, vD.x + (grain.r - 0.5) * 0.26 + (clump.r - 0.5) * 0.22);
    alb = mix(stroma, ochre, P);
    // Where the pigment is only a veil it does no more than yellow the fibre.
    float veil = smoothstep(0.10, 0.45, vD.x) * (1.0 - P);
    alb = mix(alb, alb * vec3(1.05, 1.00, 0.80), veil * 0.5);
    // No two fibres are quite the same colour.
    alb *= 0.86 + 0.28 * tint;
    alb *= mix(vec3(0.93, 0.99, 1.03), vec3(1.05, 1.0, 0.93), tint);
  }

  vec3 rgb = (alb * lit + vec3(0.080, 0.078, 0.070) * sheen) * (ao * sh);
  // Depth is the height of the fibre's axis, the same right across it. With
  // its rounded profile two fibres lying side by side would cut into each
  // other along a line no antialiasing reaches.
  gl_FragDepth = 1.0 - clamp(vZ, 0.0, 1.0);
  // A core is opaque. Everything else is premultiplied, for painting over
  // what is already there.
  o = uPass == 1 ? vec4(rgb, 1.0) : vec4(rgb * a, a);
}
</script>

<script id="vs-full" type="x-shader/x-vertex">
layout(location = 0) in vec2 a;
out vec2 vC;
void main() { vC = a; gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs-back" type="x-shader/x-fragment">
in vec2 vC;
uniform sampler2D uH;
uniform float uHTex;
out vec4 o;

void main() {
  vec2  q  = (vC - uView.zw) / uView.xy;
  float r  = length(q);
  vec4  rg = ringAt(atan(q.y, q.x));
  // The back of the iris, seen through whatever lies over it: near black,
  // olive under the open ciliary zone and browner inside the collarette,
  // where what little pigment there is collects.
  float inner = 1.0 - smoothstep(rg.g - 0.04, rg.g + 0.04, r);
  vec3  c = mix(vec3(0.200, 0.200, 0.166), vec3(0.215, 0.168, 0.112), inner);
  // Under a dense roof of fibres less light gets down at all.
  c *= 1.0 - 0.30 * textureLod(uH, vC * 0.5 + 0.5, log2(0.020 * uHTex)).a;
  o = vec4(c, 1.0);
}
</script>

<script id="fs-base" type="x-shader/x-fragment">
in vec2 vC;
uniform sampler2D uBack;   // the backdrop: back surface and deep felt, painted small
uniform float uScale;      // pixels to an eye unit
out vec4 o;

void main() {
  vec2  q  = (vC - uView.zw) / uView.xy;
  float r  = length(q);
  float rp = ringAt(atan(q.y, q.x)).r;
  vec3  c  = texture(uBack, vC * 0.5 + 0.5).rgb;

  // The pupil. Not a hole punched in the picture: a very dark brown, lifting
  // a little toward its edge and toward the light. Its edge is drawn sharp
  // here and then scalloped by the ruff, which is laid over it.
  vec2  ld  = normalize(LIGHT.xy);
  float u   = clamp(r / rp, 0.0, 1.0);
  vec3  pup = vec3(0.026, 0.018, 0.014) + vec3(0.034, 0.022, 0.015) * u * u * u
            + vec3(0.016, 0.012, 0.010) * smoothstep(-1.0, 1.0, dot(q / rp, ld)) * u;
  c = mix(pup, c, smoothstep(-0.7, 0.9, (r - rp) * uScale));
  o = vec4(c, 1.0);
}
</script>

<script id="fs-present" type="x-shader/x-fragment">
in vec2 vC;
uniform sampler2D uScene;
uniform vec3 uNevi[2];     // freckles: x, y and radius, in eye units
out vec4 o;

void main() {
  vec2  q  = (vC - uView.zw) / uView.xy;       // eye space: limbus at radius 1
  float r  = length(q), th = atan(q.y, q.x);
  vec4  rg = ringAt(th);
  float rp = rg.r;
  vec3  c  = texture(uScene, vC * 0.5 + 0.5).rgb;

  // Contraction furrows: faint concentric folds in the outer third, where
  // the iris creases as the pupil opens. Broken arcs, never full circles.
  float furrow = 0.0;
  if (r > 0.62) {
    for (int k = 0; k < 3; k++) {
      float fk = float(k);
      float rf = 0.735 + 0.085 * fk + 0.040 * (noise(cyl(th, 4.0, 50.0 + fk * 7.0)) - 0.5);
      float d  = (r - rf) / 0.024;
      furrow += smoothstep(0.35, 0.80, noise(cyl(th, 3.0, 60.0 + fk * 7.0))) * exp(-d * d);
    }
  }
  c *= 1.0 - 0.10 * min(furrow, 1.0);

  // The iris dishes toward the pupil, and darkens and browns as it does: in
  // this eye the margin is its darkest part and the collarette its palest.
  c *= mix(vec3(0.78, 0.76, 0.74), vec3(1.0), smoothstep(rp - 0.01, rp + 0.14, r));

  // Freckles: flat, dark, sitting on the fibres. This eye has a pair, one
  // outside the other, to the right of the pupil.
  for (int k = 0; k < 2; k++) {
    vec2  fd = (q - uNevi[k].xy) / uNevi[k].z;
    float fe = dot(fd, fd) + 0.9 * (noise(vec3(q * 34.0, 20.0 + float(k)) + uSeed) - 0.5)
                           + 0.4 * (noise(vec3(q * 110.0, 24.0 + float(k)) + uSeed) - 0.5);
    c = mix(c, c * vec3(0.44, 0.37, 0.30) + vec3(0.014, 0.010, 0.006), (1.0 - smoothstep(0.25, 1.0, fe)) * 0.78);
  }

  // Limbal ring: a broad, soft darkening toward the rim, greyer than the
  // rest, as the iris passes under the cornea's edge.
  float rim = smoothstep(0.78, 0.98, r);
  c = mix(c, c * vec3(0.88, 0.92, 0.98), rim * 0.90);

    /* Lay n fibres along the resampled path. One is a loose fibre. More are

         o.tipA, o.tipB    how much of a fibre's length its first and last

         o.fray            how far a cord's fibrils spread by its far end

         o.fork            { at, len, side, spread }: from `at` along the

         o.ac              a lone fibre's place across a cord it belongs to

        // early, which is how a cord thins and frays.

        if (o.from) ia = Math.floor(o.from * last);

        var amp = Math.sqrt(rnd()), tp = rr(0, TAU);                     // its radius and phase in a rope

        var aff  = solo ? 0 : rr(-0.10, 0.10);

          // It keeps its height as it does. An end that dipped would pass
          // under its neighbours along a line, which is a square end again.

    }

    /* ---- Growing ---------------------------------------------------------
       From here on the eye is grown, and that is most of a second of work,
       more on a phone, during which the page can do nothing else. So it is
       done a part at a time, with a breath between the parts in which the
       browser can answer a tap on the menu. The parts run in the order they
       are written. */
    var stages = [];
    function stage(part) { stages.push(part); }

    /* ---- The ciliary zone ----------------------------------------------- */

    // One strand: its path, and the fibres laid along it.

      // How readily this strand takes up pigment.

      for (var j = 0; j <= n; j++) {

        if (s < 0.5 && rooted) e = Math.max(e, 0.80 + 0.20 * sm(clamp01((r - ra) / 0.035)));

    // A population of strands at one depth.
    function sow(o) {
      for (var i = Math.round(o.n * SECF); i > 0; i--) {
        var th0 = rr(SEC[0], SEC[1]);

        if (o.patchy && rnd() * 1.5 > 0.62 + 0.88 * ring(th0, 9, S0 + 40 + o.layer)) continue;
        var rooted = rnd() < o.rooted;
        var ra = rooted ? collR(th0) + rr(-0.035, 0.015) : rr(collR(th0) + 0.02, 0.88);
        var rb = rnd() < o.reach ? 1.02 : Math.min(ra + rr(o.len[0], o.len[1]), 1.02);

    }

    stage(function () {
      // Deep: a dense, fine felt just above the back surface. It is what shows
      // through the troughs and on the crypt floors, always out of focus.
      sow({ mesh: deep, layer: 0, n: 8200, hw: 0.0014, sig: 0.35, lo: 0.0006, hi: 0.0056, z: [0.12, 0.34],
            len: [0.14, 0.55], reach: 0.35, rooted: 0.30, slope: 0.035, wob: [0.003, 0.010], step: 0.020, per: 1,
            cord: 0, branch: 0, sink: 0, pig: 0.7, alpha: 0.96 });
    });
    stage(function () {
      // Middle: a looser web of cords of every calibre, that leans and forks.
      sow({ mesh: upper, layer: 1, n: 4200, patchy: 1, hw: 0.0021, sig: 0.55, lo: 0.0007, hi: 0.0060, z: [0.46, 0.74],
            len: [0.10, 0.45], reach: 0.70, rooted: 0.45, slope: 0.060, wob: [0.004, 0.014], step: 0.016,
            per: sub(0.016, 0.008), cord: 10, branch: 0.34, sink: 0.05, pig: 1, alpha: 0.96 });
    });
    stage(function () {

            len: [0.10, 0.34], reach: 0.30, rooted: 0.72, slope: 0.040, wob: [0.003, 0.012], step: 0.012,
            per: sub(0.012, 0.004), cord: 16, branch: 0.45, sink: 0.14, pig: 1, alpha: 0.96 });

      // short, loose fibres in bunches that fan a little and lie across one
      // another. They are thickest just outside the collarette and thin out
      // toward the rim.
      var TUFT = { mesh: upper, layer: 2, slope: 0, wob: [0.003, 0.010], lam: [0.050, 0.13], step: 0.008,

      for (i = Math.round(200 * SECF); i > 0; i--) {
        var ut = rr(SEC[0], SEC[1]), ur = collR(ut) + 0.36 * Math.pow(rnd(), 1.5) - 0.01;
        var fan = rr(0.02, 0.08), lean = rr(-0.16, 0.16), uz = rr(0.70, 0.95);
        for (k = Math.round((8 + 14 * rnd()) * Math.sqrt(DETAIL)); k > 0; k--) {
          var ua = rr(-1, 1), ul = rr(0.035, 0.13), u0 = ur + rr(-0.03, 0.03);

      // They are most of what there is to see in the gaps.
      for (i = Math.round(5000 * SECF * DETAIL); i > 0; i--) {

    /* ---- The collarette --------------------------------------------------
       A raised, broken ridge. The sheaves of the ciliary zone are rooted in
       it, and the fibres of the pupillary zone run in under it. */

    stage(function () {

      // arch: a cord that comes in along one sheaf, turns across the gap with
      // its back to the pupil, and runs out again along the next. Its legs lie
      // in the grain of the sheaves and are lost in them. Only the turn
      // crosses the grain, and it is the rounded rim of a crypt. Laid straight
      // from cusp to cusp, with no legs, an arcade reads as a stray hair. No
      // two are the same weight.

        // a ring drawn round the pupil. Those gaps go unclosed.

        var sag = rr(0.15, 0.45) * ca.w * 0.47 + rr(0.0, 0.006);

        // pass over its legs, and it shows mostly where it crosses the gap.

          // to it, and the arch goes where its two cusps end up.

        }

            { f0: F0, keep: 3, fray: 0, tint: rnd(), alpha: 0.95, tipA: 0.15, tipB: 0.15 });
      }
    });

    /* ---- The pupillary zone ----------------------------------------------
       Fine radial pleats from the pupil margin to the collarette, each a
       gathering of fibrils with a rounded back, like the folds of a fan.
       Flatter and far more regular than the ciliary zone, because the
       sphincter lies just beneath and holds it taut, but still of uneven
       width and never quite straight. The fibrils come out from under the
       ruff low and dark, climb to the collarette, and end there by thinning
       to nothing among the roots of the ciliary cords, never cut off.
       Beneath them lies a felt of the same, out of focus, so the zone has a

        for (n = 0; n < NPL; n++) {

      for (i = 0; i < NPL; i++) {

        for (k = top + felt; k > 0; k--) {
          var under = k > top;
          var across = rnd() + rnd() - 1;                                   // crowded toward the middle of the pleat
          var pth = pcum[i] + pl.w * (0.5 + 0.48 * across);
          var full = under || rnd() < 0.45;
          var rin = pupilR(pth) + 0.001, rridge = collR(pth), rout = rridge + rr(-0.03, 0.04);
          var pra = full ? rin : rr(rin, rout - 0.06), prb = full ? rout : Math.min(pra + rr(0.05, 0.16), rout);
          var pslope = rr(-0.022, 0.022), pa1 = rr(0.0012, 0.0055), pk1 = TAU / rr(0.05, 0.14), pp1 = rr(0, TAU);
          var phw = under ? rr(0.0010, 0.0018) : Math.min(1.15 * F0 * Math.exp(gauss() * 0.35), 0.0022);
          var pz = under ? rr(0.20, 0.40) : pl.z * (1 - 0.22 * across * across) + rr(-0.06, 0.06);
          var paff = rr(-0.22, 0.22);

            // from it again. Without this the zone is combed.
            var pd = drift(pth + pslope * (ps - 0.5) + pa1 * Math.sin(pk1 * pr + pp1), pr);

            var prof = 0.70 + 0.22 * sm(clamp01((pr - rin) / 0.06)) + 0.08 * sm(clamp01((pr - rin) / (rridge - rin)));

          }
          resample(PER);
          PLEAT.tint = rnd();
          PLEAT.tipA = full ? 0.10 : 0.20;
          // The felt is loose fibre; a pleat's own fibrils are lit as its back.
          PLEAT.ac = under ? 0 : across;
          PLEAT.kind = under ? 0 : 2;

      }
    });

    /* ---- The pupillary ruff ----------------------------------------------
       The pigmented back surface of the iris curls forward round the margin
       of the pupil and shows there as a dark, velvety frill. It is a rolled
       rim, crimped all the way round into small rounded tongues that crowd
       and overlap, no two the same size. It is why the edge of a pupil is
       never a clean line. The roll is a fat ribbon laid along the margin;
       each tongue is a short one laid across it, tapered round at both ends,

        t = t0 + (t1 - t0) * q / arcs;
        var rr0 = pupilR(t) + 0.0035 + 0.002 * ring(t, 90, S0 + 400);
        X[q] = rr0 * Math.cos(t);  Y[q] = rr0 * Math.sin(t);
        HW[q] = 0.0058 + 0.0016 * ring(t, 60, S0 + 401);
        Z[q] = 0.90;  PG[q] = 0;  FD[q] = 1;  AC[q] = 0;
      }
      upper.fibre(arcs + 1, 0.5, 1);
      // The tongues.
      t = t0;
      while (t < t1) {
        var rp = pupilR(t), arcw = 0.0080 * Math.exp(gauss() * 0.22), wAng = arcw / rp;   // its width along the margin
        var len = rr(0.011, 0.019), r0 = rp - rr(0.004, 0.008), zr = rr(0.955, 0.985), tintR = rnd();
        var mid = t + wAng / 2, tilt = rr(-0.12, 0.12) * wAng;
        for (q = 0; q <= STEPS; q++) {
          // Points crowd toward the ends, where the outline turns fastest.
          var u = 0.5 - 0.5 * Math.cos(Math.PI * q / STEPS), rad = r0 + len * u, a = mid + tilt * u;
          X[q] = rad * Math.cos(a);  Y[q] = rad * Math.sin(a);
          HW[q] = 0.56 * arcw * Math.sqrt(Math.max(1 - (2 * u - 1) * (2 * u - 1), 0));
          Z[q] = zr;  PG[q] = 0;  FD[q] = 1;  AC[q] = 0;
        }
        upper.fibre(STEPS + 1, tintR, 1);
        // They overlap their neighbours more often than they leave a gap.
        t += wAng * rr(0.55, 0.95);
      }
    });

    /* ---- Back to front ----------------------------------------------------
       The strips are painted in order of height, lowest first, so that each
       covers what lies beneath it. Sorting once here is what lets the
       painting be a single draw of one buffer. */
    function pack(M, out, at) {
      var n = M.first.length, order = new Uint32Array(n), key = new Float32Array(M.key), src = M.u8;
      for (var i = 0; i < n; i++) order[i] = i;
      order.sort(function (a, b) { return key[a] - key[b]; });
      for (i = 0; i < n; i++) {
        var p = order[i], from = M.first[p] * VB, len = M.count[p] * VB;
        out.set(src.subarray(from, from + len), at);
        at += len;
      }
    }
    var first, count, verts;
    stage(function () {
      first = [0, deep.n];
      count = [deep.n, upper.n];
      verts = new Uint8Array((deep.n + upper.n) * VB);
      pack(deep, verts, 0);
      pack(upper, verts, deep.n * VB);
      deep = upper = null;
    });

    /* ---- What the shaders need besides ------------------------------------ */

    // The two freckles, as x, y, radius. They belong to this eye and not to
    // the seed: just right of the pupil and a little below, one at the
    // collarette and one outside it. (Out of shot unless ?view=whole.)
    var NEVI = new Float32Array([0.500, -0.150, 0.036,   0.566, -0.176, 0.042]);

    // By angle: pupil radius, collarette radius, limbus wobble.
    var RW = 2048, ringData = new Float32Array(RW * 4);
    for (i = 0; i < RW; i++) {
      var ta = (i + 0.5) / RW * TAU;
      ringData[i * 4]     = pupilR(ta);
      ringData[i * 4 + 1] = collR(ta);
      ringData[i * 4 + 2] = 0.6 * ring(ta, 9, S0 + 80) + 0.4 * ring(ta, 31, S0 + 81);
      ringData[i * 4 + 3] = 1;
    }

    // Four channels of noise that tile, for the grain and clumping of pigment.
    var NOISE = 256, noiseData = new Uint8Array(NOISE * NOISE * 4);
    stage(function () {
      for (i = 0; i < noiseData.length; i++) noiseData[i] = rnd() * 256;
    });

    /* ---------------------------------------------------------------------
       GL
       --------------------------------------------------------------------- */

    var G = null;      // everything that dies with the context

    var COMMON = document.getElementById('glsl-common').textContent;
    function shader(type, id) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, '#version 300 es\n' + COMMON + document.getElementById(id).textContent);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.error(id + ': ' + gl.getShaderInfoLog(sh));
        return null;
      }
      return sh;
    }

    function program(vsId, fsId, uniforms) {
      var vs = shader(gl.VERTEX_SHADER, vsId), fs = shader(gl.FRAGMENT_SHADER, fsId);
      if (!vs || !fs) return null;
      var p = gl.createProgram();
      gl.attachShader(p, vs);
      gl.attachShader(p, fs);
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        console.error(fsId + ': ' + gl.getProgramInfoLog(p));
        return null;
      }
      var out = { p: p };
      uniforms.forEach(function (name) { out[name] = gl.getUniformLocation(p, name); });
      return out;
    }

    function filtered(tex, min, wrap) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, min);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap === gl.REPEAT ? gl.REPEAT : gl.CLAMP_TO_EDGE);
      return tex;
    }

    function init() {
      var g = {
        height:  program('vs-strand', 'fs-height',  ['uView', 'uSeed', 'uAA', 'uBlur', 'uMinHw']),
        strand:  program('vs-strand', 'fs-strand',
                         ['uView', 'uSeed', 'uAA', 'uBlur', 'uMinHw', 'uH', 'uHTex', 'uNoise', 'uPass']),
        back:    program('vs-full',   'fs-back',    ['uView', 'uRing', 'uH', 'uHTex']),
        base:    program('vs-full',   'fs-base',    ['uView', 'uRing', 'uBack', 'uScale']),
        present: program('vs-full',   'fs-present', ['uView', 'uSeed', 'uRing', 'uScene', 'uNevi'])
      };
      if (!g.height || !g.strand || !g.back || !g.base || !g.present) return null;

      g.strands = gl.createVertexArray();
      gl.bindVertexArray(g.strands);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
      // size, type, normalised, offset: the layout set out above Mesh.
      [[2, gl.FLOAT, false, 0], [2, gl.BYTE, true, 8], [1, gl.BYTE, true, 10], [1, gl.UNSIGNED_BYTE, false, 11],
       [1, gl.UNSIGNED_SHORT, true, 12], [1, gl.UNSIGNED_SHORT, true, 14], [3, gl.UNSIGNED_BYTE, true, 16],
       [1, gl.BYTE, true, 19]
      ].forEach(function (a, loc) {
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, a[0], a[1], a[2], VB, a[3]);
      });

      // One triangle that overshoots the viewport stands in for a quad.
      g.tri = gl.createVertexArray();
      gl.bindVertexArray(g.tri);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      // Half-float is the one float format every WebGL2 device will filter.
      g.ring = filtered(gl.createTexture(), gl.LINEAR, gl.REPEAT);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, RW, 1, 0, gl.RGBA, gl.FLOAT, ringData);
      g.noise = filtered(gl.createTexture(), gl.LINEAR, gl.REPEAT);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, NOISE, NOISE, 0, gl.RGBA, gl.UNSIGNED_BYTE, noiseData);

      g.fboH = gl.createFramebuffer();
      g.fboB = gl.createFramebuffer();
      g.fboS = gl.createFramebuffer();
      g.w = g.h = 0;
      return g;
    }

    // The offscreen targets, (re)made when the canvas changes size:
    //   H  the height map, half size, with the depth buffer that builds it
    //   B  the backdrop, a third or a quarter size: it holds only what is
    //      well out of focus, and enlarging it is part of the blur
    //   S  the scene, full size, with the depth buffer that sorts its fibres
    function targets(w, h, dpr) {
      if (G.w === w && G.h === h) return true;
      [G.texH, G.texB, G.texS].forEach(function (t) { if (t) gl.deleteTexture(t); });
      [G.depth, G.depthS].forEach(function (d) { if (d) gl.deleteRenderbuffer(d); });
      G.w = w;  G.h = h;
      G.hw = Math.ceil(w / 2);  G.hh = Math.ceil(h / 2);
      var div = dpr > 1.5 ? 4 : 3;
      G.bw = Math.ceil(w / div);  G.bh = Math.ceil(h / div);

      function target(fbo, tw, th, mips) {
        var t = filtered(gl.createTexture(), mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR, gl.CLAMP_TO_EDGE);
        gl.texStorage2D(gl.TEXTURE_2D, mips ? Math.floor(Math.log2(Math.max(tw, th))) + 1 : 1, gl.RGBA8, tw, th);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
        return t;
      }
      G.texB = target(G.fboB, G.bw, G.bh, false);
      var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      function depth(dw, dh) {
        var d = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, d);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, dw, dh);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, d);
        return d;
      }
      G.texS = target(G.fboS, w, h, false);
      G.depthS = depth(w, h);
      ok = ok && gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      G.texH = target(G.fboH, G.hw, G.hh, true);
      G.depth = depth(G.hw, G.hh);
      ok = ok && gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      if (!ok) G.w = 0;
      return ok;
    }

    // Defocus, in eye units of softness per (unit of height below focus)
    // squared. At this scale it leaves the middle web a pixel soft at its
    // lowest and the deep felt five or six.
    var BLUR = 0.0207;

    // The picture is static, so it is painted once per size, not per frame.
    function paint() {
      if (!G || gl.isContextLost()) return;
      var cw = canvas.clientWidth, ch = canvas.clientHeight;
      if (!cw || !ch) return;
      // Device pixels, up to two to a CSS pixel and about a 4K screen's
      // worth in all. Past that the eye cannot tell and the memory can.
      var dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(8.3e6 / (cw * ch)));
      var w = Math.round(cw * dpr), h = Math.round(ch * dpr);
      canvas.width = w;
      canvas.height = h;
      if (!targets(w, h, dpr)) return;

      var f = frame(w, h), px = 1 / f.s;              // px: eye units to a device pixel
      var hTex = f.s * G.hw / w;                      // height-map texels to an eye unit
      function view(p) { gl.uniform4f(p.uView, 2 * f.s / w, 2 * f.s / h, 2 * f.x / w - 1, 2 * f.y / h - 1); }
      function full(p) {
        gl.useProgram(p.p);
        view(p);
        gl.uniform1i(p.uRing, 1);
        gl.uniform1i(p.uH, 0);
        gl.uniform1f(p.uHTex, hTex);
        gl.bindVertexArray(G.tri);
      }
      function strands(p, aa, blur, minHw, which, pass) {
        gl.useProgram(p.p);
        view(p);
        gl.uniform1f(p.uSeed, (seed % 97) * 3.17);
        gl.uniform1f(p.uAA, aa);
        gl.uniform1f(p.uBlur, blur);
        gl.uniform1f(p.uMinHw, minHw);
        gl.uniform1i(p.uH, 0);
        gl.uniform1f(p.uHTex, hTex);
        gl.uniform1i(p.uNoise, 2);
        gl.uniform1i(p.uPass, pass);
        gl.bindVertexArray(G.strands);
        gl.drawArrays(gl.TRIANGLE_STRIP, first[which], count[which]);
      }

      gl.activeTexture(gl.TEXTURE1);  gl.bindTexture(gl.TEXTURE_2D, G.ring);
      gl.activeTexture(gl.TEXTURE2);  gl.bindTexture(gl.TEXTURE_2D, G.noise);
      gl.activeTexture(gl.TEXTURE3);  gl.bindTexture(gl.TEXTURE_2D, G.texB);
      gl.activeTexture(gl.TEXTURE4);  gl.bindTexture(gl.TEXTURE_2D, G.texS);
      gl.activeTexture(gl.TEXTURE0);  gl.bindTexture(gl.TEXTURE_2D, null);

      // 1. The front surface of the mat, as heights. Sharp: this is where
      //    things are, not how they look.
      gl.bindFramebuffer(gl.FRAMEBUFFER, G.fboH);
      gl.viewport(0, 0, G.hw, G.hh);
      gl.disable(gl.BLEND);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LESS);
      gl.depthMask(true);
      gl.clearColor(0, 0, 0, 0);
      gl.clearDepth(1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      strands(G.height, 0, 0, 0.6 * px * w / G.hw, 1, 0);
      gl.disable(gl.DEPTH_TEST);
      gl.bindTexture(gl.TEXTURE_2D, G.texH);
      gl.generateMipmap(gl.TEXTURE_2D);

      // 2. The backdrop: the back of the iris, and the deep felt over it.
      gl.bindFramebuffer(gl.FRAMEBUFFER, G.fboB);
      gl.viewport(0, 0, G.bw, G.bh);
      full(G.back);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      // Nothing in it may be sharper than the enlarging can carry, or the
      // felt comes out as a fine hatching.
      strands(G.strand, 1.5 * px * w / G.bw, BLUR, 0, 0, 0);

      // 3. The scene: the backdrop enlarged, the pupil, and everything else
      //    over them. First every fibre's solid core, the higher hiding the
      //    lower through the depth buffer; then their soft edges and
      //    whatever is out of focus, painted from the back forward and
      //    hidden wherever a core already stands above them.
      gl.bindFramebuffer(gl.FRAMEBUFFER, G.fboS);
      gl.viewport(0, 0, w, h);
      gl.disable(gl.BLEND);
      full(G.base);
      gl.uniform1i(G.base.uBack, 3);
      gl.uniform1f(G.base.uScale, f.s);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.enable(gl.DEPTH_TEST);
      gl.clear(gl.DEPTH_BUFFER_BIT);
      strands(G.strand, 0.75 * px, BLUR, 0, 1, 1);
      gl.enable(gl.BLEND);
      gl.depthMask(false);
      strands(G.strand, 0.75 * px, BLUR, 0, 1, 2);
      gl.depthMask(true);
      gl.disable(gl.DEPTH_TEST);

      // 4. The page.
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.disable(gl.BLEND);
      full(G.present);
      gl.uniform1f(G.present.uSeed, (seed % 97) * 3.17);
      gl.uniform1i(G.present.uScene, 4);
      gl.uniform3fv(G.present.uNevi, NEVI);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      canvas.classList.add('ready');
    }

    // If the context goes, step aside for the gradient; rebuild if it returns.
    canvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      G = null;
      canvas.classList.remove('ready');
    });
    canvas.addEventListener('webglcontextrestored', function () {
      if (!verts) return;      // still growing: the last part will do it
      G = init();
      paint();
    });

    // Repaint once the window has settled, not on every resize tick.
    var settle;
    window.addEventListener('resize', function () {
      clearTimeout(settle);
      settle = setTimeout(paint, 140);
    });

    stage(function () {
      G = init();
      paint();
    });

    (function next() {
      stages.shift()();
      if (stages.length) setTimeout(next, 0);
    })();
  }
})();
</script>
</body>
</html>
