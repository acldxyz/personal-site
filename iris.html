  *, *::before, *::after { box-sizing: border-box; }

  /* --d is the iris diameter. The script sizes the painted eye by the same
     rule (IRIS_W / IRIS_H below); if one changes, change the other. */
  :root { --d: min(86vw, 76vh); }

  html, body { height: 100%; margin: 0; }

  body {
    /* What shows before the first frame, and for good where WebGL2 is missing:
       the eye in a few flat stops on the site's paper, which is close enough
       to the white of an eye that the painted version fades in over it
       without the page changing colour. */
    background:
      radial-gradient(circle at 50% 48.5%,
        #0c0806 0, #1b120d calc(var(--d) * .176),
        #6f5326 calc(var(--d) * .188), #9a8a5e calc(var(--d) * .235),
        #a39c7f calc(var(--d) * .285), #84866d calc(var(--d) * .39),
        #3d423a calc(var(--d) * .492), #c9c8c4 calc(var(--d) * .525),
        rgba(242, 238, 229, 0) calc(var(--d) * .56)),
      radial-gradient(ellipse 90% 70% at 50% 44%, #faf8f3 0%, #f2eee5 55%, #e8e3d8 100%);
    background-color: #f2eee5;
    overflow: hidden;
  }

  #iris {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    /* Hidden until the eye is fully painted, then revealed whole. */
    opacity: 0;
    transition: opacity .62s ease-out;
  }

  #iris.ready { opacity: 1; }

  /* The pill control from index.html, unchanged: the white of the eye is
     near enough to the paper that the site's own ink works on it. */
  nav {
    position: fixed;
    left: 0; right: 0;
    bottom: max(22px, env(safe-area-inset-bottom));
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .2em;
    padding: 0 12px;
    font-family: system-ui, "Segoe UI", Helvetica, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  nav a {
    color: #6f665d;
    text-decoration: none;
    padding: .78em 1.2em;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: color .2s ease, background-color .2s ease, border-color .2s ease;
  }

  nav a:hover {
    color: #2f2a24;
    background: rgba(0, 0, 0, .05);
    border-color: rgba(0, 0, 0, .14);
  }

  nav a:focus-visible {
    outline: 2px solid #3d7ba8;
    outline-offset: 2px;

     full padding a phone breaks them four and an orphan. */
  @media (max-width: 440px) {

    nav { font-size: 10px; }
    nav a { padding: .78em .42em; }
  }

  @media (prefers-reduced-motion: reduce) {
    nav a, #iris { transition-duration: .01s; }
  }

<!--
  How the eye is made.

  An iris photographs the way it does because it is a physical thing: pale
  collagen strands lying over one another at different depths above a dark
  back surface, with pigment dusted on the front. Noise that merely looks
  stringy does not survive a second glance, so the strands here are geometry.

  It is one particular eye. The size of the pupil, the colour at each
  distance from it, where the pale ring peaks, how many lobes that ring
  breaks into, where the ochre sits and the pair of freckles were all
  measured from a photograph of the real iris, and only of the iris: nothing
  of the lids, the white, or the reflections on the cornea. The fibres are
  grown to fit those measurements. ?seed= regrows the fibres and leaves the
  measured things alone.

  1. The script sows strands evenly and radially, then displaces them: drawn
     together into sheaves at the collarette, gathered into clumps that merge
     and split on the way out, parted around the crypts. Nothing is placed by
     hand; the mess is what the displacement leaves.
  2. They are drawn as ribbons into three offscreen maps, one per depth: a
     deep silk, a middle web, and the thick front trabeculae. Within a map
     strands are depth-tested, so they pass over and under each other.
  3. One full-page pass lays the maps over one another, the deeper ones out
     of focus and in the shadow of those above, and adds what is optics, not
     anatomy: colour by depth, the limbus, the pupil, the white of the eye.
-->

<script id="vs-ribbon" type="x-shader/x-vertex">#version 300 es
layout(location = 0) in vec2  aPos;    // a point on the centre line
layout(location = 1) in vec2  aSide;   // unit vector across the ribbon there
layout(location = 2) in float aHw;     // half-width
layout(location = 3) in float aU;      // -1 on one edge, +1 on the other
layout(location = 4) in vec3  aD;      // height of the axis, pigment, tint
uniform float uScale;                  // eye units to clip space
uniform float uMinHw;
out float vU;
out vec3  vD;
out float vThin;
out float vRise;
out float vSub;

void main() {
  // A ribbon narrower than the raster can resolve breaks into dashes. It is
  // drawn at the minimum width instead and made correspondingly faint.
  float hw = max(aHw, uMinHw);
  vThin = max(aHw / hw, 0.4);
  vU = aU;
  vD = aD;
  vRise = clamp(aHw * 16.0, 0.025, 0.12);     // a thick strand stands prouder than a thin one
  // How many finer fibres the raster can show side by side across this one.
  vSub = clamp(1.2 * aHw / uMinHw / 2.6, 1.0, 8.0);
  gl_Position = vec4((aPos + aSide * hw * aU) * uScale, 0.0, 1.0);
}
</script>

<script id="fs-fibre" type="x-shader/x-fragment">#version 300 es
precision highp float;
in float vU;
in vec3  vD;
in float vThin;
in float vRise;
in float vSub;
out vec4 o;

void main() {
  // Each strand is the top half of a cylinder lying on its side. A thick one
  // is not a smooth tube but a bundle: it is grooved along its length into
  // as many finer fibres as there is room to show, each a slightly different
  // tone.
  float groove = cos(vU * 3.14159 * vSub + vD.z * 40.0) * smoothstep(1.1, 1.9, vSub);
  float h = clamp(vD.x + vRise * (sqrt(max(1.0 - vU * vU, 0.0)) + 0.50 * groove), 0.0, 1.0);
  // Height is written as depth, so where strands of one layer cross, the
  // upper one wins whatever order they were drawn in.
  gl_FragDepth = 1.0 - h;
  // Alpha is coverage. Once the map is filtered every channel is an average
  // over covered and bare texels alike, i.e. premultiplied by coverage; the
  // page shader divides it back out.
  o = vec4(h, vD.y, clamp(vD.z + 0.30 * groove, 0.0, 1.0), 1.0) * vThin;
}
</script>

<script id="vs-page" type="x-shader/x-vertex">#version 300 es
layout(location = 0) in vec2 a;
void main() { gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs-page" type="x-shader/x-fragment">#version 300 es
precision highp float;

uniform vec2  uC;        // iris centre, px, GL axes (y up)
uniform float uR;        // limbus radius, px
uniform vec3  uTex;      // texels per eye unit in the deep, middle and front maps
uniform float uExt;      // half-extent of those maps, eye units
uniform float uSeed;
uniform sampler2D uDeep, uMid, uTop;   // a layer each: r height, g pigment, b tint, a coverage
uniform sampler2D uRing;               // by angle: r pupil radius, g collarette radius, b limbus wobble
uniform vec3  uNevi[2];                // freckles: x, y and radius, in eye units
out vec4 outColor;

const float TAU = 6.28318530718;
// The site's light, (-0.40, -0.55, 0.73) in CSS axes, with y turned up for GL.
const vec3 LIGHT = vec3(-0.4003, 0.5505, 0.7306);

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i),               hash(i + vec3(1,0,0)), f.x),
                 mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                 mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}

// Angle wrapped onto a circle, so angular noise has no seam at the atan2 cut.
vec3 cyl(float th, float F, float z) { return vec3(cos(th) * F, sin(th) * F, z) + uSeed; }

vec4 tap(sampler2D t, vec2 q, float lod) { return textureLod(t, q / uExt * 0.5 + 0.5, lod); }

// Four taps on a rotated grid, `spread` apart, from the mip whose texels are
// about that size: a blur of that radius for the price of four lookups.
vec4 soft(sampler2D t, float tex, vec2 q, float spread) {
  float lod = max(log2(spread * tex), 0.0);
  return 0.25 * (tap(t, q + spread * vec2( 0.38,  0.92), lod) + tap(t, q + spread * vec2(-0.92,  0.38), lod)
               + tap(t, q + spread * vec2(-0.38, -0.92), lod) + tap(t, q + spread * vec2( 0.92, -0.38), lod));
}

vec3 ramp(float x, vec3 a, vec3 b, vec3 c, vec3 d) {
  x = clamp(x, 0.0, 1.0) * 3.0;
  return x < 1.0 ? mix(a, b, x) : x < 2.0 ? mix(b, c, x - 1.0) : mix(c, d, x - 2.0);
}

// One layer of strands, lit: its colour, and how much of the pixel it covers.
// `blur` is the layer's defocus, in eye units.
vec4 strands(sampler2D t, float tex, vec2 q, float blur, vec3 tone, float grain, float gold) {
  vec4 m = soft(t, tex, q, max(blur, 0.35 / uR));
  if (m.a < 0.004) return vec4(0.0);
  float h = m.r / m.a, pig = m.g / m.a, tint = m.b / m.a;

  // Relief. A strand has a flank toward the light and a flank away from it,
  // read off the slope of the layer's own height.
  float e = max(blur, 0.0022), lod = max(log2(e * tex), 0.0);
  vec2 g = vec2(tap(t, q + vec2(e, 0.0), lod).r - tap(t, q - vec2(e, 0.0), lod).r,
                tap(t, q + vec2(0.0, e), lod).r - tap(t, q - vec2(0.0, e), lod).r) / (2.0 * e);
  float lit = 1.0 + clamp(-dot(g, LIGHT.xy) * 0.0011, -0.15, 0.18);
  // And a strand lying lower than its neighbours in the layer sees less light.
  vec4 nb = soft(t, tex, q, 0.011);
  float ao = 1.0 - 0.26 * clamp((nb.r / max(nb.a, 0.08) - h) * 2.4, 0.0, 1.0);

  // Colour by depth. The stroma is pale collagen in front and coloured by
  // what lies behind it. Here that is a faint yellow all through over the
  // blue of the depths, which makes a grey-green: pale khaki in front, sage
  // in the middle, dark olive behind. The values are taken from the
  // photograph, lifted to a full exposure.
  vec3 stroma = ramp(h, vec3(0.215, 0.203, 0.158), vec3(0.410, 0.390, 0.305),
                        vec3(0.585, 0.550, 0.435), vec3(0.815, 0.765, 0.630)) * tone;
  vec3 ochre  = ramp(h, vec3(0.220, 0.165, 0.098), vec3(0.430, 0.345, 0.215),
                        vec3(0.610, 0.510, 0.335), vec3(0.780, 0.690, 0.500));
  // Pigment runs from rust to ochre, patch by patch and strand by strand.
  ochre *= mix(vec3(0.98, 0.90, 0.80), vec3(1.03, 1.03, 0.99), clamp(gold + (tint - 0.5) * 0.6, 0.0, 1.0));
  // Melanin lies in clumps, so its edge is granular, not airbrushed.
  float P = smoothstep(0.26, 0.74, pig + (grain - 0.5) * 0.24);
  vec3 alb = mix(stroma, ochre, P);
  // Where the pigment is only a veil it does no more than yellow the strand.
  float veil = smoothstep(0.10, 0.45, pig) * (1.0 - P);
  alb = mix(alb, alb * vec3(1.05, 1.00, 0.80), veil * 0.5);
  // No two strands are quite the same colour.
  alb *= 0.86 + 0.28 * tint;
  alb *= mix(vec3(0.93, 0.99, 1.03), vec3(1.05, 1.0, 0.93), tint);
  return vec4(alb * lit * ao, m.a);
}

void main() {
  vec2  q  = (gl_FragCoord.xy - uC) / uR;      // eye space: limbus at radius 1
  float r  = length(q);
  float th = atan(q.y, q.x);
  vec4  rg = texture(uRing, vec2(th / TAU, 0.5));
  float rp = rg.r, rc = rg.g;

  // ---- The white of the eye ----------------------------------------------
  // Brightest around the cornea and falling away, warmer, as the globe turns.
  vec3 scl = mix(vec3(0.962, 0.955, 0.944), vec3(0.905, 0.884, 0.856), smoothstep(1.15, 3.6, r));
  float mott = 0.6 * noise(vec3(q * 1.3, 5.0) + uSeed) + 0.4 * noise(vec3(q * 4.3, 9.0) + uSeed);
  scl *= 0.972 + 0.056 * mott;
  // By the cornea the sclera thins over the dark tissue behind and greys.
  scl *= mix(vec3(1.0), vec3(0.900, 0.925, 0.950), exp(-pow((r - 1.030) / 0.060, 2.0)));

  vec3 col = scl;

  // The cornea is wider than it is tall: the white laps further over the
  // iris above and below than at the sides.
  float rl = 1.0 - 0.030 * q.y * q.y / max(r * r, 1e-6) + (rg.b - 0.5) * 0.016;

  if (r < rl + 0.10) {
    vec2  ld    = normalize(LIGHT.xy);
    float grain = noise(vec3(q * 230.0, 1.0) + uSeed);

    // The grey-green is not one colour. Whole patches run warm, toward
    // khaki, and others darker and greyer; and the whole cools and greys
    // toward the rim.
    float patchy = 0.6 * noise(cyl(th, 2.4, r * 2.1 + 31.0)) + 0.4 * noise(cyl(th, 6.5, r * 4.0 + 37.0));
    vec3  tone   = mix(vec3(0.87, 0.88, 0.87), vec3(1.05, 1.02, 0.96), smoothstep(0.30, 0.70, patchy))
                 * mix(vec3(1.0), vec3(0.96, 0.98, 1.01), smoothstep(0.60, 0.95, r));
    float gold   = noise(vec3(q * 9.0, 4.0) + uSeed);

    // ---- Three depths ----------------------------------------------------
    // Each layer throws a shadow on those behind it, displaced away from the
    // light and softer the further it has to fall. That, with the deeper
    // layers out of focus, is what makes it something you look into.
    float sTopMid  = soft(uTop, uTex.z, q + ld * 0.0055, 0.0045).a;
    float sTopDeep = soft(uTop, uTex.z, q + ld * 0.0120, 0.0085).a;
    float sMidDeep = soft(uMid, uTex.y, q + ld * 0.0070, 0.0060).a;
    // Under a dense roof of strands less light gets down at all.
    float roof = max(tap(uTop, q, max(log2(0.020 * uTex.z), 0.0)).a,
                     tap(uMid, q, max(log2(0.020 * uTex.y), 0.0)).a);
    float dim  = (1.0 - 0.32 * max(sTopDeep, 0.8 * sMidDeep)) * (1.0 - 0.10 * roof);

    // What lies behind everything. Out in the ciliary zone it is the back
    // surface, near-black. Inside the collarette it is the sheet of tissue
    // over the sphincter, which the pleats only ridge: mid-toned, and taking
    // its colour from whatever pigment the pleats above it carry.
    float inner = 1.0 - smoothstep(rc - 0.03, rc + 0.02, r);
    vec4  above = soft(uMid, uTex.y, q, 0.020);
    vec3  sheet = mix(vec3(0.430, 0.410, 0.330), vec3(0.500, 0.420, 0.275),
                      smoothstep(0.20, 0.70, above.g / max(above.a, 0.05)));
    sheet *= 0.82 + 0.36 * noise(cyl(th, 95.0, r * 7.0 + 15.0));
    // The sheet is right under its pleats, so it is hardly in their shadow.
    vec3 c = mix(vec3(0.130, 0.130, 0.105), sheet, inner) * mix(dim, 1.0, inner * 0.6);

    vec4 deep = strands(uDeep, uTex.x, q, 0.0075, tone, grain, gold);
    c = mix(c, deep.rgb * dim, deep.a);
    vec4 mid = strands(uMid, uTex.y, q, 0.0030, tone, grain, gold);
    c = mix(c, mid.rgb * (1.0 - 0.30 * sTopMid), mid.a);
    vec4 top = strands(uTop, uTex.z, q, 0.0, tone, grain, gold);
    c = mix(c, top.rgb, top.a);

    // Contraction furrows: faint concentric folds in the outer third, where
    // the iris creases as the pupil opens. Broken arcs, never full circles.
    float furrow = 0.0;
    if (r > 0.62) {
      for (int k = 0; k < 3; k++) {
        float fk = float(k);
        float rf = 0.735 + 0.085 * fk + 0.040 * (noise(cyl(th, 4.0, 50.0 + fk * 7.0)) - 0.5);
        float d  = (r - rf) / 0.015;
        furrow += smoothstep(0.40, 0.62, noise(cyl(th, 3.0, 60.0 + fk * 7.0))) * exp(-d * d);
      }
    }
    c *= 1.0 - 0.14 * min(furrow, 1.0);

    // The iris dishes toward the pupil, and darkens and browns as it does:
    // in this eye the margin is its darkest part and the collarette its palest.
    c *= mix(vec3(0.78, 0.76, 0.74), vec3(1.0), smoothstep(rp, rp + 0.14, r));

    // Freckles: flat, dark, sitting on the strands. This eye has a pair,
    // one outside the other, to the right of the pupil.
    for (int k = 0; k < 2; k++) {
      vec2  fd = (q - uNevi[k].xy) / uNevi[k].z;
      float fe = dot(fd, fd) + 0.9 * (noise(vec3(q * 34.0, 20.0 + float(k)) + uSeed) - 0.5)
                             + 0.4 * (noise(vec3(q * 110.0, 24.0 + float(k)) + uSeed) - 0.5);
      c = mix(c, c * vec3(0.44, 0.37, 0.30) + vec3(0.014, 0.010, 0.006), (1.0 - smoothstep(0.25, 1.0, fe)) * 0.78);
    }

    // Limbal ring: a broad, soft darkening toward the rim, greyer than the
    // rest, as the iris passes under the cornea's edge.
    float rim = smoothstep(0.78, 0.98, r);
    c = mix(c, c * vec3(0.88, 0.92, 0.98), rim * 0.90);

    // Pupillary ruff: the back surface curls round the margin as a dark,
    // beaded frill. It is why the edge of a pupil is never a clean line.
    float bead  = noise(cyl(th, 46.0, 0.0));
    float fine  = noise(cyl(th, 130.0, 2.0));
    float lightSide = 0.5 - 0.5 * dot(q / max(r, 1e-4), ld);     // the frill is lit on the far side of the pupil
    vec3  ruffC = mix(vec3(0.070, 0.038, 0.022), vec3(0.165, 0.095, 0.055), fine) * (0.75 + 0.5 * lightSide);
    float ruffOut = rp + 0.006 + 0.016 * bead;
    c = mix(ruffC, c, smoothstep(ruffOut - 0.004, ruffOut + 0.004, r));

    // The pupil. Not a hole punched in the picture: a very dark brown,
    // lifting a little toward its edge and toward the light, with a margin
    // scalloped by the ruff.
    float margin = rp - 0.002 - 0.007 * fine * bead;
    float u  = clamp(r / rp, 0.0, 1.0);
    vec3 pup = vec3(0.026, 0.018, 0.014) + vec3(0.034, 0.022, 0.015) * u * u * u
             + vec3(0.016, 0.012, 0.010) * smoothstep(-1.0, 1.0, dot(q / rp, ld)) * u;
    c = mix(pup, c, smoothstep(-0.7, 0.9, (r - margin) * uR));

    // Limbus: no line, just the cornea's clear margin clouding into sclera.
    vec3  haze = mix(vec3(0.500, 0.510, 0.490), scl, smoothstep(rl - 0.012, rl + 0.070, r));
    col = mix(c, haze, smoothstep(rl - 0.034, rl + 0.034, r));
  }

  // A grain finer than anything drawn stops the smooth passages looking rendered.
  col += (hash(vec3(gl_FragCoord.xy, uSeed)) - 0.5) * 0.014;
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script>
(function () {
  // Growing the eye is a few hundred milliseconds of script. It waits for
  // the first frame, so the menu and the flat stand-in are already on screen
  // while it runs.
  requestAnimationFrame(function () { setTimeout(grow, 0); });

  function grow() {
    var canvas = document.getElementById('iris');
    var gl = canvas.getContext('webgl2',
      { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: true });
    if (!gl) return;   // the CSS gradients on <body> stand in

    var TAU = Math.PI * 2;

    // Must match --d in the stylesheet.
    var IRIS_W = 0.86, IRIS_H = 0.76, CENTRE_Y = 0.485;

    // The strand maps cover the eye out to this radius. Strands end at 1.02.
    var EXT = 1.04;

    // ?seed=n grows a different eye. Fixed by default, so the page is the same
    // iris on every visit, as a portrait would be.
    var seed = parseInt(new URLSearchParams(location.search).get('seed'), 10);
    if (!isFinite(seed)) seed = 7;
    var S0 = seed * 1013 + 7;

    /* ---------------------------------------------------------------------
       Randomness. Everything is drawn from one seeded stream or from hashed
       lattice noise, never Math.random, so the anatomy is reproducible.
       --------------------------------------------------------------------- */

    var rs = (seed * 7919 + 17) | 0;
    function rnd() {
      rs = (rs + 0x6D2B79F5) | 0;
      var t = Math.imul(rs ^ (rs >>> 15), 1 | rs);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    function rr(a, b) { return a + (b - a) * rnd(); }
    function gauss() { return (rnd() + rnd() + rnd() + rnd() - 2) * 1.732; }   // near enough to normal

    function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    function sm(t) { return t * t * (3 - 2 * t); }
    function angd(a, b) {
      var d = (a - b) % TAU;
      return d > Math.PI ? d - TAU : d < -Math.PI ? d + TAU : d;
    }

    function hsh(x, y, s) {
      var h = (Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1)) | 0;
      h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
      h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }

    // Value noise that repeats every `per` cells in x, so it can run round a circle.
    function pnoise(x, y, per, s) {
      var ix = Math.floor(x), iy = Math.floor(y);
      var fx = sm(x - ix), fy = sm(y - iy);
      var x0 = ((ix % per) + per) % per, x1 = (x0 + 1) % per;
      var a = hsh(x0, iy, s), b = hsh(x1, iy, s), c = hsh(x0, iy + 1, s), d = hsh(x1, iy + 1, s);
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
    }
    function ring(th, F, s) { return pnoise(th / TAU * F, 0, F, s); }
    function polar(th, r, F, G, s) { return pnoise(th / TAU * F, r * G, F, s); }

    /* ---------------------------------------------------------------------
       Anatomy. Radii are fractions of the limbus radius; a real iris is about
       12 mm across, so 0.01 here is roughly 60 microns.
       --------------------------------------------------------------------- */

    var i, j, k;

    // The pupil sits a little off the centre of the iris, and the collarette
    // goes with it.
    var ECC = 0.014, ECC_A = rr(2.6, 3.7);

    // Pupil about 4.3 mm: wide, as it is in the photograph. Never a true circle.
    function pupilR(th) {
      return 0.36 * (1 + 0.050 * (ring(th, 3, S0 + 1) - 0.5) + 0.030 * (ring(th, 7, S0 + 2) - 0.5)
                       + 0.012 * (ring(th, 19, S0 + 8) - 0.5)) + ECC * Math.cos(th - ECC_A);
    }

    // Collarette: the wreath where the pupillary zone ends and the ciliary
    // zone begins. The thickest part of the iris, and in this eye the palest.
    function collR(th) {
      return 0.555 + 0.075 * (ring(th, 5, S0 + 3) - 0.5) + 0.040 * (ring(th, 13, S0 + 4) - 0.5)
                   + 0.8 * ECC * Math.cos(th - ECC_A);
    }

    // Toward the root every strand dives under the limbus.
    function dive(r) { return 0.12 * sm(clamp01((r - 0.90) / 0.11)); }

    // The pupillary zone lies over the sphincter and is held taut; the
    // displacements below act on it at a fraction of their strength.
    function taut(r) { return 0.30 + 0.70 * sm(clamp01((r - 0.46) / 0.22)); }

    /* Strands are sown evenly, each at its own angle, and would run dead
       straight out from the collarette. What makes an iris is how they are
       displaced from that. There are four displacements, all of the angle as
       a function of radius, so a strand is free to lean, converge on its
       neighbours, cross them and part from them again. */

    /* 1. Sheaves. At the collarette the front fibres are gathered to a row of
       cusps and fan out from them. The space between two sheaves is closed on
       the pupil side by an arcade and stands open, down to the deep layer,
       for some way out. This eye has about thirty sheaves, and they are what
       it looks like from any distance: pale flames round the pupil with a
       darker olive between them. Where a gap is drawn wide and runs long it
       is a Fuchs crypt. */
    var NK = 30, A0 = rr(0, TAU), cusps = [], cum = [];
    (function () {
      var w = [], sum = 0, run = 0, n;
      for (n = 0; n < NK; n++) { w.push(Math.exp(rr(-0.9, 0.9))); sum += w[n]; }
      for (n = 0; n < NK; n++) {
        cum.push(run / sum * TAU);
        cusps.push({ th: A0 + run / sum * TAU, w: w[n] / sum * TAU });   // w: the gap that follows this cusp
        run += w[n];
      }
    })();
    for (i = 0; i < NK; i++) {
      var cu = cusps[i];
      cu.r = collR(cu.th) + rr(0.0, 0.03);
      // Crypts favour some sectors, but within one no two are alike.
      var open = ring(cu.th + cu.w / 2, 9, S0 + 20) > 0.50 && rnd() < 0.55;
      cu.P = open ? rr(0.55, 0.80) : rr(0.22, 0.50);      // how hard the fibres are drawn aside
      cu.L = open ? rr(0.10, 0.30) : rr(0.06, 0.22);      // how far out before they close up again
      // An arcade closes an open gap; elsewhere the wreath is only there in places.
      cu.arc = rnd() < (open ? 0.80 : 0.40);
    }
    // `anchor` is the angle the strand was sown at. Which sheaf it belongs to
    // is settled by that, once, for its whole length. Decided afresh at each
    // point, a strand that wandered past the middle of a gap would be
    // snatched across to the other side, drawing a rung straight across it.
    function sheaf(th, r, k, anchor) {
      var t = (((anchor - A0) % TAU) + TAU) % TAU, lo = 0, hi = NK - 1;
      while (lo < hi) { var m = (lo + hi + 1) >> 1; if (cum[m] <= t) lo = m; else hi = m - 1; }
      var g = cusps[lo], f = (t - cum[lo]) / g.w;
      var rc = g.r + (cusps[(lo + 1) % NK].r - g.r) * f;
      var p = k * g.P * (1 - sm(clamp01((r - rc) / g.L)));
      return p > 0 ? th - angd(th, f < 0.5 ? g.th : g.th + g.w) * p : th;
    }

    /* 2. Clumps. A shared displacement at about the spacing of the
       trabeculae. Where neighbouring strands are pushed together they pile
       into a ridge, and where apart they leave a trough; since the push
       changes along the radius, ridges merge, split and cross on the way
       out. Each depth has its own field, so the layers do not line up. */
    var CLUMP = [0.040, 0.065, 0.085];
    function clump(th, r, s) {
      return 1.10 * (polar(th, r, 37, 2.6, s) - 0.5) + 0.90 * (polar(th, r, 71, 4.1, s + 1) - 0.5);
    }
    function bundle(th, r, L) {
      var c = clump(th, r, S0 + 200 + L * 17);
      // The middle layer half follows the front one: enough that a trough
      // shows the deep layer through both, not so much that they are one.
      if (L === 1) c = 0.5 * c + 0.5 * clump(th, r, S0 + 200 + 2 * 17);
      return CLUMP[L] * c;
    }

    /* 3. Lean. Whole sectors drift one way and then the other. */
    function meander(th, r) {
      return 0.120 * (polar(th, r, 5, 2.2, S0 + 5) - 0.5) + 0.050 * (polar(th, r, 14, 5, S0 + 6) - 0.5);
    }

    /* 4. Pits. A few crypts further out, where the fibres simply part round
       an opening and close again behind it. */
    var pits = [];
    for (i = 0; i < 3; i++) {
      pits.push({ th: rr(0, TAU), r0: rr(0.58, 0.84), len: rr(0.06, 0.15), w: rr(0.013, 0.032) });
    }
    function part(th, r, k) {
      for (var n = 0; n < pits.length; n++) {
        var p = pits[n], v = (r - p.r0) / p.len;
        if (v <= 0 || v >= 1) continue;
        var d = angd(th, p.th);
        // Half-width of the opening at this radius, as an angle: a teardrop,
        // rounded toward the pupil and drawn out to a point behind.
        var W = k * p.w / r * Math.sin(Math.PI * Math.pow(v, 0.72));
        if (Math.abs(d) < 8 * W) th = p.th + (d < 0 ? -1 : 1) * Math.sqrt(d * d + W * W);
      }
      return th;
    }

    // The whole course of a ciliary strand of layer L. The deep layer takes
    // no part in the sheaves or the pits: it runs on underneath them, which
    // is why a crypt has a floor.
    function course(th, r, L, grip, anchor) {
      var k = L === 2 ? 1 : L === 1 ? 0.50 : 0;
      if (k) th = sheaf(th, r, Math.min(k * grip, 1), anchor);
      th += taut(r) * (bundle(th, r, L) + meander(th, r));
      return k ? part(th, r, k) : th;
    }
    // The same without sheaves or pits, for what is not a ciliary strand.
    function drift(th, r) { return th + taut(r) * (bundle(th, r, 2) + meander(th, r)); }

    /* Pigment. This eye has very little, which is why it is grey-green and
       not hazel. What there is hugs the pupil: an ochre band at the margin,
       heaviest lower left, running round underneath and failing toward the
       top, with rust flecks beside it. */
    var PIG_A = -2.0;      // the clock position where the band is heaviest: lower left (y is up)
    function sideOf(th) { return 0.12 + 0.88 * sm(clamp01(0.5 + 0.80 * Math.cos(th - PIG_A))); }
    function fleckAt(th, r, d) {
      var x = th / TAU * 64, y = r * 15, ix = Math.floor(x), iy = Math.floor(y);
      var cx = ((ix % 64) + 64) % 64;
      // Thick by the pupil, none past the collarette.
      if (hsh(cx, iy, S0 + 300) > 0.50 * (1 - sm(clamp01((d - 0.05) / 0.22)))) return 0;
      var fx = x - ix - (0.3 + 0.4 * hsh(cx, iy, S0 + 301)), fy = y - iy - (0.3 + 0.4 * hsh(cx, iy, S0 + 302));
      // Mostly specks, now and then a real patch.
      var rad = 0.05 + 0.36 * Math.pow(hsh(cx, iy, S0 + 303), 1.8);
      var e = (fx * fx + 0.5 * fy * fy) / (rad * rad);          // drawn out along the radius
      return e >= 1 ? 0 : (0.45 + 0.55 * hsh(cx, iy, S0 + 304)) * (1 - sm(e));
    }
    function pigmentAt(th, r) {
      var d = r - pupilR(th);
      if (d > 0.30) return 0;
      var side = sideOf(th);
      // How far out from the margin the band runs here.
      var width = (0.022 + 0.060 * side) * (0.55 + 0.90 * ring(th, 17, S0 + 60));
      var streak = 0.5 * polar(th, r, 170, 2.5, S0 + 62) + 0.5 * polar(th, r, 61, 2.0, S0 + 63);
      var p = 1 - sm(clamp01((d - width * (0.60 + 0.80 * streak)) / 0.12));
      p *= (0.25 + 0.75 * side) * (0.60 + 0.40 * polar(th, r, 29, 9, S0 + 64));
      return Math.max(p, fleckAt(th, r, d) * (0.30 + 0.70 * side));
    }

    /* ---------------------------------------------------------------------
       Ribbons. Every strand becomes a triangle strip two vertices wide;
       strips are chained with repeated vertices so one draw call takes a
       whole layer.
       --------------------------------------------------------------------- */

    function Mesh() { this.a = new Float32Array(1 << 18); this.n = 0; }
    Mesh.prototype.vert = function (x, y, sx, sy, hw, u, d0, d1, d2) {
      if (this.n + 9 > this.a.length) {

        var o = i * 5, p = Math.max(i - 1, 0) * 5, q = Math.min(i + 1, cnt - 1) * 5;
        var tx = pts[q] - pts[p], ty = pts[q + 1] - pts[p + 1], l = Math.sqrt(tx * tx + ty * ty) || 1;
        var sx = -ty / l, sy = tx / l;

        this.vert(pts[o], pts[o + 1], sx, sy, pts[o + 2], -1, pts[o + 3], pts[o + 4], d2);
        this.vert(pts[o], pts[o + 1], sx, sy, pts[o + 2],  1, pts[o + 3], pts[o + 4], d2);
        if (i === cnt - 1) this.vert(pts[o], pts[o + 1], sx, sy, pts[o + 2], 1, pts[o + 3], pts[o + 4], d2);

    // Deep, middle, front.
    var layers = [new Mesh(), new Mesh(), new Mesh()];
    var P = new Float32Array(5 * 1024), pc = 0;

    // A strand point: where it ends up, its half-width, height and pigment.
    function pt(th, r, hw, z, pig) {
      var o = pc * 5;

      pc++;
    }
    function flush(L, tint) { layers[L].ribbon(P, pc, tint); pc = 0; }

    /* ---- The ciliary zone ----------------------------------------------- */

    // One strand, and any branches it throws off.
    function strand(o, th0, ra, rb, hw, z, rooted, lean) {
      var L = o.layer, tint = rnd(), span = rb - ra;
      // Its lean: how far round it has drifted by the time it ends.
      var slope = lean === undefined ? rr(-o.slope, o.slope) : lean * span;
      // Its own wander. The swing is capped by the wavelength: a short wave
      // is a ripple, and never the zigzag a full swing would make of it.
      var lam = o.lam || [0.08, 0.28], wl = rr(lam[0], lam[1]);
      var a1 = Math.min(rr(o.wob[0], o.wob[1]), 0.095 * wl), k1 = TAU / wl, p1 = rr(0, TAU), p3 = rr(0, TAU);
      // How strongly it is drawn into the sheaves. Were every strand drawn
      // alike, the sparse ones in a gap would line up like harp strings.
      var grip = rr(0.45, 1.30);
      // And crimp, no finer than the points the strand is drawn with can carry.
      var a2 = rr(0.0004, 0.0016), k2 = TAU / Math.max(rr(0.04, 0.08), 5 * o.step), p2 = rr(0, TAU);
      // How readily this strand takes up pigment; a few are flecked with it
      // along their length.
      var aff = rr(-0.24, 0.24);
      var dash = rnd() < o.dash ? rr(0.5, 0.9) : 0;
      // A strand rooted in the collarette leaves it high and pale and sinks
      // as it runs out, some soon and some late. Together they are the
      // flames: pale tongues of very different lengths.
      var fall = rooted ? o.sink * rr(0.5, 1.1) : 0, flen = rr(0.12, 0.36);
      var wn = (rnd() * 4096) | 0;

      function run(r0, r1, hwK, dz, side, spread, blen) {
        var n = Math.ceil((r1 - r0) / o.step) + 1;
        for (var j = 0; j <= n; j++) {
          var s = j / n, r = r0 + (r1 - r0) * s, e = Math.sin(Math.PI * s);
          // A branch leaves its parent at full size. A strand rooted in the
          // collarette comes up from underneath it: thin and low for its
          // first little way, then quickly to its full size.
          if (s < 0.5 && side) e = 0.75 + 0.25 * e;
          if (s < 0.5 && rooted) e = Math.max(e, sm(clamp01((r - r0) / 0.035)));
          // One that reaches the rim does not end there either. It passes
          // on under the limbus, so it keeps most of its size to the edge.
          if (s > 0.5 && r1 > 1.019) e = 0.62 + 0.38 * e;
          // Two waves that never fall into step, so the wander is not a
          // regular crimp. The second is the longer, so that it is never
          // finer than the first.
          var th = th0 + slope * ((r - ra) / span - 0.5) + a2 * Math.sin(k2 * r + p2)
                 + a1 * (0.72 * Math.sin(k1 * r + p1) + 0.45 * Math.sin(0.61 * k1 * r + p3));
          if (side) th += side * spread * sm(clamp01((r - r0) / blen));
          th = course(th, r, L, grip, th0);
          var pg = pigmentAt(th, r) + aff;
          if (dash) pg += dash * sm(clamp01((pnoise(r * 9, wn + 9, 4096, S0 + 35) - 0.66) / 0.14));
          // Calibre is never constant along a strand either.
          // A free end does not taper to a point: it sinks, darkening into
          // whatever lies beneath it.
          pt(th, r, hw * hwK * (0.50 + 0.50 * e) * (0.70 + 0.60 * pnoise(r * 16, wn, 4096, S0 + 31)),
             (z + dz - fall * sm(clamp01((r - ra - 0.03) / flen)) - dive(r) * (0.4 + z)) * (0.55 + 0.45 * e),
             clamp01(pg * o.pig));
        }
        flush(L, tint);
      }

      run(ra, rb, 1, 0, 0, 0, 0);
      if (span > 0.15 && rnd() < o.branch) {
        for (var b = rnd() < 0.3 ? 2 : 1; b > 0; b--) {
          var rs = rr(ra + 0.03, rb - 0.08);
          run(rs, Math.min(rs + rr(0.08, 0.30), 1.02), rr(0.45, 0.80), -0.03,
              rnd() < 0.5 ? -1 : 1, rr(0.015, 0.070), rr(0.05, 0.20));
        }
      }
    }

    // A population of strands at one depth.
    function sow(o) {
      for (var i = 0; i < o.n; i++) {
        var th0 = rr(0, TAU);
        // Some sectors are simply more thickly grown than others.
        if (o.patchy && rnd() * 1.5 > 0.62 + 0.88 * ring(th0, 9, S0 + 40 + o.layer)) continue;
        var rooted = rnd() < o.rooted;
        var ra = rooted ? collR(th0) + rr(-0.035, 0.015) : rr(collR(th0) + 0.02, 0.88);
        var rb = rnd() < o.reach ? 1.02 : Math.min(ra + rr(o.len[0], o.len[1]), 1.02);
        // Calibre is log-normal: mostly fine, with a long tail of thick
        // cords. The thick ones are the strong ones and lie proud.
        var hw = Math.min(Math.max(o.hw * Math.exp(gauss() * o.sig), 0.0006), 0.0056);
        var z = o.z[0] + (o.z[1] - o.z[0]) * clamp01(0.75 * rnd() + 0.25 * clamp01((hw / o.hw - 0.5) / 2));
        strand(o, th0, ra, rb, hw, z, rooted);
      }
    }

    // Deep: a dense, fine silk just above the back surface, running nearly
    // straight. It is what shows through the troughs and on the crypt floors.
    sow({ layer: 0, n: 8200, hw: 0.0014, sig: 0.35, z: [0.14, 0.38], len: [0.14, 0.55], reach: 0.35, rooted: 0.30,
          slope: 0.035, wob: [0.003, 0.010], step: 0.020, branch: 0, sink: 0, dash: 0, pig: 0.7 });
    // Middle: a looser web, of every calibre, that leans and forks.
    sow({ layer: 1, n: 5600, patchy: 1, hw: 0.0017, sig: 0.55, z: [0.44, 0.72], len: [0.10, 0.45], reach: 0.70,
          rooted: 0.45, slope: 0.060, wob: [0.004, 0.014], step: 0.013, branch: 0.28, sink: 0.05, dash: 0.015, pig: 1 });
    // And wisps that stray right across the grain.
    sow({ layer: 1, n: 260, hw: 0.0011, sig: 0.40, z: [0.50, 0.72], len: [0.08, 0.25], reach: 0, rooted: 0,
          slope: 0.100, wob: [0.006, 0.018], step: 0.010, branch: 0, sink: 0, dash: 0.015, pig: 1 });
    // Front: the trabeculae proper, mostly rooted in the collarette.
    sow({ layer: 2, n: 2500, patchy: 1, hw: 0.0016, sig: 0.62, z: [0.66, 0.94], len: [0.08, 0.30], reach: 0.22,
          rooted: 0.70, slope: 0.040, wob: [0.003, 0.012], step: 0.012, branch: 0.34, sink: 0.14, dash: 0.015, pig: 1 });

    // Tufts. The pale lobes of this eye are not neat sheaves but clouds:
    // short, fine strands in loose bunches that fan a little and lie across
    // one another. They are thickest just outside the collarette and thin
    // out toward the rim.
    var TUFT = { layer: 2, slope: 0, wob: [0.003, 0.010], lam: [0.050, 0.13], step: 0.006, branch: 0.20, sink: 0,
                 dash: 0.02, pig: 1 };
    for (i = 0; i < 330; i++) {
      var ut = rr(0, TAU), ur = collR(ut) + 0.36 * Math.pow(rnd(), 1.5) - 0.01;
      var fan = rr(0.02, 0.08), lean = rr(-0.16, 0.16), uz = rr(0.70, 0.95);
      for (k = 8 + Math.floor(rnd() * 18); k > 0; k--) {
        var ua = rr(-1, 1), ul = rr(0.035, 0.13), u0 = ur + rr(-0.03, 0.03);
        // Each strand lies at its own angle, and none of them is straight:
        // their wander is as short as they are.
        strand(TUFT, ut + fan * ua * 0.5, u0, Math.min(u0 + ul, 1.0),
               Math.min(0.0013 * Math.exp(gauss() * 0.5), 0.0040), uz + rr(-0.10, 0.04), false, lean + rr(-0.45, 0.45));
      }
    }

    /* ---- The collarette -------------------------------------------------- */

    // Arcades: from cusp to cusp, sagging toward the pupil. Each is a loose
    // rope: a few strands that wind round one another, thin where they
    // leave the sheaves at either end and fullest in the middle. No two are
    // the same weight.
    for (i = 0; i < NK; i++) {
      var ca = cusps[i], cb = cusps[(i + 1) % NK];
      if (!ca.arc) continue;
      var sag = rr(0.15, 0.45) * ca.w * 0.47 + rr(0.0, 0.006);
      // The strands of one arcade lie on top of one another. Spread apart,
      // they read as the rungs of a ladder across the gap.
      var ropeHw = rr(0.0006, 0.0020), ropeZ = rr(0.76, 0.92), ropeAff = rr(-0.2, 0.2), twist = rr(1.2, 3.5);
      for (k = 2 + Math.floor(rnd() * 3); k > 0; k--) {
        var lane = rr(-1, 1), shw = 0.0022 * Math.exp(gauss() * 0.4), ph = rr(0, TAU);
        var wv = rr(0.001, 0.004), wf = rr(8, 20), wp = rr(0, TAU);
        for (j = 0; j <= 18; j++) {
          var s = j / 18, belly = Math.sin(Math.PI * s);
          var rad = ca.r + (cb.r - ca.r) * s - sag * Math.pow(belly, 0.8)
                  + ropeHw * lane * Math.cos(twist * Math.PI * s + ph) + wv * Math.sin(wf * s + wp);
          var th = drift(ca.th + ca.w * s, rad);
          pt(th, rad, shw * (0.40 + 0.60 * belly),
             (ropeZ + 0.04 * Math.sin(twist * Math.PI * s + ph)) * (0.72 + 0.28 * belly),
             clamp01(pigmentAt(th, rad) + ropeAff));
        }
        flush(2, rnd());
      }
    }

    // And strands that run along the collarette rather than across it, lacing
    // the arcades into a wreath.
    for (i = 0; i < 18; i++) {
      var w0 = rr(0, TAU), reachA = rr(0.08, 0.22) * (rnd() < 0.5 ? -1 : 1);
      var lift = rr(-0.022, 0.018), zig = rr(0.004, 0.012), zf = rr(40, 90), zp = rr(0, TAU);
      var lhw = 0.0022 * Math.exp(gauss() * 0.45), lz = rr(0.70, 0.88), laff = rr(-0.2, 0.2);
      var ln = Math.ceil(Math.abs(reachA) / 0.009);
      for (j = 0; j <= ln; j++) {
        var ls = j / ln, lth = w0 + reachA * ls, le = Math.sin(Math.PI * ls);
        var lr = collR(lth) + lift + zig * Math.sin(zf * lth + zp) + 0.03 * (ls - 0.5) * (lift > 0 ? 1 : -1);
        var ld = drift(lth, lr);
        pt(ld, lr, lhw * (0.35 + 0.65 * le), lz * (0.80 + 0.20 * le), clamp01(pigmentAt(ld, lr) + laff));
      }
      flush(2, rnd());
    }

    /* ---- The pupillary zone ----------------------------------------------
       Fine radial pleats from the collarette to the pupil margin, each a
       small gathering of strands with a rounded back. Flatter and far more
       regular than the ciliary zone, because the sphincter lies just beneath
       and holds it taut, but still of uneven width and never quite straight. */
    var NPL = 210, pleats = [], pcum = [];
    (function () {
      var w = [], sum = 0, run = 0, n;
      for (n = 0; n < NPL; n++) { w.push(Math.exp(rr(-0.7, 0.7))); sum += w[n]; }
      for (n = 0; n < NPL; n++) {
        pcum.push(run / sum * TAU);
        pleats.push({ w: w[n] / sum * TAU, z: rr(0.60, 0.88) });
        run += w[n];
      }
    })();
    for (i = 0; i < 5200; i++) {
      var pa = rr(0, TAU), lo = 0, hi = NPL - 1;
      while (lo < hi) { var pm = (lo + hi + 1) >> 1; if (pcum[pm] <= pa) lo = pm; else hi = pm - 1; }
      var pl = pleats[lo], across = (pa - pcum[lo]) / pl.w * 2 - 1;      // -1..1 across the pleat
      var pth = pcum[lo] + pl.w * (0.5 + 0.47 * across);                 // drawn in from its edges a little
      var full = i < 2300;
      var rin = pupilR(pth) - 0.008, rout = collR(pth) + rr(-0.085, 0.010);
      var pra = full ? rin : rr(rin, rout - 0.05);
      var prb = full ? rout : Math.min(pra + rr(0.05, 0.14), rout);
      var pslope = rr(-0.022, 0.022), pa1 = rr(0.0012, 0.0055), pk1 = TAU / rr(0.05, 0.14), pp1 = rr(0, TAU);
      var phw = Math.min(0.0013 * Math.exp(gauss() * 0.50), 0.0040);
      var pz = pl.z * (1 - 0.20 * across * across) + rr(-0.08, 0.08), paff = rr(-0.22, 0.22);
      var pn = Math.ceil((prb - pra) / 0.020) + 1;
      for (j = 0; j <= pn; j++) {
        var ps = j / pn, pr = pra + (prb - pra) * ps, pe = full ? 1 : Math.sin(Math.PI * ps);
        var pd = drift(pth + pslope * (ps - 0.5) + pa1 * Math.sin(pk1 * pr + pp1), pr);
        pt(pd, pr, phw * (0.55 + 0.45 * pe) * (0.7 + 0.3 * ps), pz * (0.75 + 0.25 * pe) * (0.66 + 0.34 * ps),
           clamp01(pigmentAt(pd, pr) + paff));
      }
      flush(pz > 0.66 ? 2 : 1, rnd());
    }

    /* ---- What the page shader needs to know by angle ---------------------- */

    // The two freckles, as x, y, radius. They belong to this eye and not to
    // the seed: just right of the pupil and a little below, one at the
    // collarette and one outside it.
    var NEVI = new Float32Array([0.500, -0.150, 0.036,   0.566, -0.176, 0.042]);


    var RW = 2048, ringData = new Float32Array(RW * 4);
    for (i = 0; i < RW; i++) {
      var ta = (i + 0.5) / RW * TAU;
      ringData[i * 4]     = pupilR(ta);
      ringData[i * 4 + 1] = collR(ta);
      ringData[i * 4 + 2] = 0.6 * ring(ta, 9, S0 + 80) + 0.4 * ring(ta, 31, S0 + 81);
      ringData[i * 4 + 3] = 1;
    }

    // The three layers go to the GPU as one buffer; each is drawn as a range.
    var first = [], count = [], total = 0;
    for (i = 0; i < 3; i++) { first.push(total / 9); count.push(layers[i].n / 9); total += layers[i].n; }
    var verts = new Float32Array(total);
    for (i = 0; i < 3; i++) verts.set(layers[i].a.subarray(0, layers[i].n), first[i] * 9);
    layers = null;

    /* ---------------------------------------------------------------------
       GL
       --------------------------------------------------------------------- */

    var G = null;      // everything that dies with the context

    function shader(type, id) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, document.getElementById(id).textContent);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.error(id + ': ' + gl.getShaderInfoLog(sh));
        return null;
      }
      return sh;
    }

    function program(vsId, fsId, uniforms) {
      var vs = shader(gl.VERTEX_SHADER, vsId), fs = shader(gl.FRAGMENT_SHADER, fsId);
      if (!vs || !fs) return null;
      var p = gl.createProgram();
      gl.attachShader(p, vs);
      gl.attachShader(p, fs);
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        console.error(fsId + ': ' + gl.getProgramInfoLog(p));
        return null;
      }
      var out = { p: p };
      uniforms.forEach(function (name) { out[name] = gl.getUniformLocation(p, name); });
      return out;
    }

    function init() {
      var g = {
        fibre: program('vs-ribbon', 'fs-fibre', ['uScale', 'uMinHw']),
        page:  program('vs-page', 'fs-page',
                       ['uC', 'uR', 'uTex', 'uExt', 'uSeed', 'uDeep', 'uMid', 'uTop', 'uRing', 'uNevi'])
      };
      if (!g.fibre || !g.page) return null;

      g.strands = gl.createVertexArray();
      gl.bindVertexArray(g.strands);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
      var sizes = [2, 2, 1, 1, 3], off = 0;
      for (var a = 0; a < sizes.length; a++) {
        gl.enableVertexAttribArray(a);
        gl.vertexAttribPointer(a, sizes[a], gl.FLOAT, false, 36, off);
        off += sizes[a] * 4;
      }

      // One triangle that overshoots the viewport stands in for a quad.
      g.tri = gl.createVertexArray();
      gl.bindVertexArray(g.tri);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      // Half-float is the one float format every WebGL2 device will filter.
      g.ring = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, g.ring);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, RW, 1, 0, gl.RGBA, gl.FLOAT, ringData);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      g.fbo = gl.createFramebuffer();
      g.size = 0;
      g.tex = [];
      g.depth = [];
      return g;
    }

    // The deep layer is only ever seen out of focus, so it gets half the
    // resolution of the other two.
    function layerSize(size, L) { return L ? size : size >> 1; }

    // The strand maps, (re)allocated when the eye changes size on screen.
    function targets(size) {
      if (G.size === size) return true;
      G.tex.forEach(function (t) { gl.deleteTexture(t); });
      G.depth.forEach(function (d) { gl.deleteRenderbuffer(d); });
      G.tex = [];
      G.depth = [];
      G.size = size;
      gl.bindFramebuffer(gl.FRAMEBUFFER, G.fbo);
      for (var L = 0; L < 3; L++) {
        var n = layerSize(size, L);
        var t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texStorage2D(gl.TEXTURE_2D, Math.floor(Math.log2(n)) + 1, gl.RGBA8, n, n);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        G.tex.push(t);
        // The two full-size layers can share a depth buffer; it is cleared between them.
        if (L < 2) {
          var d = gl.createRenderbuffer();
          gl.bindRenderbuffer(gl.RENDERBUFFER, d);
          gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, n, n);
          G.depth.push(d);
        }
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, G.depth[Math.min(L, 1)]);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) { G.size = 0; return false; }
      }
      return true;
    }

    // The picture is static, so it is painted once per size, not per frame.
    function paint() {
      if (!G || gl.isContextLost()) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
      if (!w || !h) return;
      canvas.width = w;
      canvas.height = h;

      var R = 0.5 * Math.min(IRIS_W * w, IRIS_H * h);
      var cx = 0.5 * w, cy = (1 - CENTRE_Y) * h;

      // The maps are drawn finer than the page and filtered down, which is
      // what antialiases the strands. Twice over at 1x; a little less on dense
      // screens, where the pixels are already too small to see stair-steps.
      var over = dpr > 1.5 ? 1.5 : 2;
      var size = Math.min(Math.ceil(2 * R * EXT * over), Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 2560));
      if (!targets(size)) return;
      var tex = [0, 0, 0];

      // 1. Strands into their layers.
      gl.bindFramebuffer(gl.FRAMEBUFFER, G.fbo);
      gl.disable(gl.BLEND);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LESS);
      gl.depthMask(true);
      gl.clearColor(0, 0, 0, 0);
      gl.clearDepth(1);
      gl.useProgram(G.fibre.p);
      gl.uniform1f(G.fibre.uScale, 1 / EXT);
      gl.bindVertexArray(G.strands);
      for (var L = 0; L < 3; L++) {
        var n = layerSize(size, L);
        tex[L] = n / (2 * EXT);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, G.tex[L], 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, G.depth[Math.min(L, 1)]);
        gl.viewport(0, 0, n, n);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.uniform1f(G.fibre.uMinHw, 0.6 / tex[L]);
        gl.drawArrays(gl.TRIANGLE_STRIP, first[L], count[L]);
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      for (L = 0; L < 3; L++) {
        gl.bindTexture(gl.TEXTURE_2D, G.tex[L]);
        gl.generateMipmap(gl.TEXTURE_2D);
      }

      // 2. The page.
      gl.viewport(0, 0, w, h);
      gl.disable(gl.DEPTH_TEST);
      gl.useProgram(G.page.p);
      gl.uniform2f(G.page.uC, cx, cy);
      gl.uniform1f(G.page.uR, R);
      gl.uniform3f(G.page.uTex, tex[0], tex[1], tex[2]);
      gl.uniform1f(G.page.uExt, EXT);
      gl.uniform1f(G.page.uSeed, (seed % 97) * 3.17);
      gl.uniform3fv(G.page.uNevi, NEVI);
      var units = ['uDeep', 'uMid', 'uTop'];
      for (L = 0; L < 3; L++) {
        gl.activeTexture(gl.TEXTURE0 + L);
        gl.bindTexture(gl.TEXTURE_2D, G.tex[L]);
        gl.uniform1i(G.page[units[L]], L);
      }
      gl.activeTexture(gl.TEXTURE3);
      gl.bindTexture(gl.TEXTURE_2D, G.ring);
      gl.uniform1i(G.page.uRing, 3);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindVertexArray(G.tri);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      canvas.classList.add('ready');
    }

    // If the context goes, step aside for the gradient; rebuild if it returns.
    canvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      G = null;
      canvas.classList.remove('ready');
    });
    canvas.addEventListener('webglcontextrestored', function () {
      G = init();
      paint();
    });

    // Repaint once the window has settled, not on every resize tick.
    var settle;
    window.addEventListener('resize', function () {
      clearTimeout(settle);
      settle = setTimeout(paint, 140);
    });

    G = init();
    paint();
  }
})();
</script>
</body>
</html>
